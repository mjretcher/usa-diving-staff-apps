name: Winter Nationals qualifying-score data probe

# Read-only. Counts and meet names from core.result_phases, committed to
# db/audits so the result can be read without the run logs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - db/scripts/wn_qual_probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/wn_qual_probe.py 2>&1 | tee db/audits/wn_qual_probe.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/audits/wn_qual_probe.txt
          git commit -m "Winter Nationals qualifying-score data probe" || echo none
          git pull --rebase --autostash -q || true
          git push
