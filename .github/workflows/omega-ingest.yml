name: OMEGA international dive-sheet ingest

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Wikipedia article titles, comma-separated"
        required: true
        default: "Diving at the 2019 World Aquatics Championships"
      dry_run:
        description: "1 = parse and report only, 0 = load"
        required: true
        default: "1"

permissions: { contents: write }

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary pdfplumber
      - name: Ingest
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          WIKI_PAGES: ${{ inputs.pages }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/omega_ingest.py 2>&1 | tee db/audits/omega_ingest.txt
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/omega_ingest.txt
          git commit -m "OMEGA ingest log" || echo none
          git push
