name: DiveMeets entries sync

on:
  workflow_dispatch:
    inputs:
      meet_id:
        description: "DiveMeets meet number"
        required: true
        default: "12923"
      recon_event_id:
        description: "If set, ONLY capture a raw DiveSheets page sample for this event id (parser design aid)"
        required: false
        default: ""
  schedule:
    # Daily at 10:05 UTC (~6 AM ET) while registration is open / meet approaches.
    # Harmless after the meet — remove or comment out when no longer needed.
    - cron: "5 10 * * *"
    # Meet-window top-ups for the 2026 Junior Nationals (Jul 29 - Aug 4), at 11:05am and
    # 6:05pm ET alongside the 6:05am daily run. Entries can technically change until three
    # hours before each prelim event, but the late fee is steep enough that late signups
    # are uncommon — so this is a light top-up so the app is never a day stale, NOT a poll.
    # Date-scoped, so it stops on its own after Aug 4. REMOVE these four lines afterwards:
    # otherwise they fire on the same calendar days next year against a stale default
    # meet id (scheduled runs have no inputs and fall back to 12923 below).
    - cron: "5 15 28-31 7 *"
    - cron: "5 22 28-31 7 *"
    - cron: "5 15 1-4 8 *"
    - cron: "5 22 1-4 8 *"

jobs:
  sync:
    name: Fetch entry counts into Neon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Recon DiveSheets sample (only when recon_event_id set)
        if: ${{ github.event.inputs.recon_event_id != '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_ID: ${{ github.event.inputs.meet_id || '12923' }}
          EVENT_ID: ${{ github.event.inputs.recon_event_id }}
        run: python db/scripts/recon_divesheet.py

      - name: Fetch and upsert entries
        if: ${{ github.event.inputs.recon_event_id == '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_ID: ${{ github.event.inputs.meet_id || '12923' }}
        run: python db/scripts/fetch_divemeets_entries.py
