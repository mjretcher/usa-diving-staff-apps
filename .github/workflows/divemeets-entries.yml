name: DiveMeets entries sync

# Syncs live entry counts for a LIST of meets. It used to take a single id and
# scheduled runs fell back to 12923, which meant the Senior Qualifier (12924)
# and National Championships (12925) were never picked up automatically — they
# would have run their entire week with no entry data behind them.

on:
  workflow_dispatch:
    inputs:
      meet_ids:
        description: "DiveMeets meet numbers, comma separated"
        required: true
        default: "12923,12924,12925"
      recon_event_id:
        description: "If set, ONLY capture a raw DiveSheets page sample for this event id (parser design aid). Uses the first meet in the list."
        required: false
        default: ""
  schedule:
    # Daily at 10:05 UTC (~6 AM ET) while registration is open / meets approach.
    # Compute cost on Neon is driven by how often it is woken, not by how much
    # work is done, so this should be switched off once the season closes
    # rather than left running against meets that are over.
    - cron: "5 10 * * *"
    # Meet-window top-ups for the 2026 Senior meets in Morgantown: the National
    # Championships Qualifier (5-6 Aug) and the National Championships (7-11
    # Aug), at 11:05am and 6:05pm ET alongside the 6:05am daily run. Entries can
    # technically change until three hours before an event, but the late fee is
    # steep enough that late signups are uncommon — this is a light top-up so
    # the apps are never a day stale, NOT a poll.
    # Date-scoped, so they stop on their own after 11 Aug. REMOVE these two
    # lines afterwards: otherwise they fire on the same calendar days next year
    # against stale meet numbers, because scheduled runs carry no inputs and
    # fall back to the default list below.
    - cron: "5 15 5-11 8 *"
    - cron: "5 22 5-11 8 *"

permissions:
  contents: write

jobs:
  sync:
    name: Fetch entry counts into Neon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Recon DiveSheets sample (only when recon_event_id set)
        if: ${{ github.event.inputs.recon_event_id != '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_IDS: ${{ github.event.inputs.meet_ids || '12923,12924,12925' }}
          EVENT_ID: ${{ github.event.inputs.recon_event_id }}
        run: |
          MEET_ID="$(echo "$MEET_IDS" | cut -d, -f1 | xargs)"
          echo "Recon against meet $MEET_ID"
          MEET_ID="$MEET_ID" python db/scripts/recon_divesheet.py

      - name: Fetch and upsert entries
        if: ${{ github.event.inputs.recon_event_id == '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_IDS: ${{ github.event.inputs.meet_ids || '12923,12924,12925' }}
        run: |
          # One meet failing must not stop the others — a parser problem on the
          # Qualifier should not cost us the Championships' numbers — but the
          # job must still end red so the failure is not silently absorbed.
          fail=0
          IFS=',' read -ra IDS <<< "$MEET_IDS"
          for raw in "${IDS[@]}"; do
            id="$(echo "$raw" | xargs)"
            [ -z "$id" ] && continue
            echo "::group::meet $id"
            if MEET_ID="$id" python db/scripts/fetch_divemeets_entries.py; then
              echo "meet $id ok"
            else
              echo "::error::meet $id failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Write sync status
        if: ${{ always() && github.event.inputs.recon_event_id == '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_IDS: ${{ github.event.inputs.meet_ids || '12923,12924,12925' }}
        run: python db/scripts/entry_sync_status.py

      - name: Commit status if changed
        if: ${{ always() && github.event.inputs.recon_event_id == '' }}
        run: |
          # This step runs with always(), so the status write may have failed
          # and left no file at all. Nothing here should ever fail the job.
          if [ ! -f membership-analytics/entry-sync-status.json ]; then
            echo "::warning::no status file written"
            exit 0
          fi
          # `git diff` alone misses the first run, when the file is untracked.
          git add -A membership-analytics/entry-sync-status.json
          if git diff --cached --quiet; then
            echo "Status unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [skip ci] so a thrice-daily status write does not trigger a Pages
          # deploy each time. Nothing renders this file; it is an audit trail.
          git commit -m "Entry sync status [skip ci]"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::could not rebase status commit; skipping push"
            exit 0
          fi
          # Never fail the job over the audit trail: the sync itself is the point.
          git push origin HEAD:main || echo "::warning::could not push status file"
