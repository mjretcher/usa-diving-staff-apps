name: Build Competition Athlete breakdown
# County counts of Competition Athlete members by age group and gender
# (membership-analytics/comp-athletes-data.json). Re-run after a membership import.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [db/scripts/build_comp_athletes.py]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - run: python db/scripts/build_comp_athletes.py
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
      - run: |
          git add membership-analytics/comp-athletes-data.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build comp-athletes-data.json"; git pull --rebase; git push
