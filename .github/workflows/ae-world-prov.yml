name: AE world provenance
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: |
          mkdir -p db/audits
          python db/scripts/ae_world_provenance.py 2>&1 | tee db/audits/ae_world_prov.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/ae_world_prov.txt
          git commit -m "AE world provenance" || echo none
          git push
