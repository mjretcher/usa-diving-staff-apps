name: AE taxonomy fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p db/audits
          python db/scripts/ae_taxonomy_fix.py 2>&1 | tee db/audits/ae_taxonomy_fix.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/audits/ae_taxonomy_fix.txt
          git commit -m "AE taxonomy fix output" || echo "no change"
          git pull --rebase --autostash -q || true
          git push
