name: DiveMeets results crawl

on:
  workflow_dispatch:
    inputs:
      meet_id:
        description: "Crawl exactly this meet id (bypasses queue)"
        required: false
        default: ""
      sanction:
        description: "Narrow to one sanction (blank = drain the full chain)"
        required: false
        default: ""
      target_tag:
        description: "Queue from divemeets.crawl_targets with this tag ('*' = all). Overrides sanction."
        required: false
        default: ""
      fetch_budget:
        description: "Approx max page fetches this run"
        required: false
        default: "1200"
  schedule:
    # ONE slot. The script drains the whole chain per run — USA Diving, then
    # AAU, then the NCAA target list — so throughput comes from fetch_budget,
    # not from staggered crons.
    #
    # Neon bills compute by AWAKE time and scale-to-zero waits a fixed 5 min
    # after the last query, so a run that exits in 18s still costs ~5 min of
    # compute. Fewer, fuller wakeups is both cheaper and faster here.
    #
    # The three staggered crons this replaces each carried a
    # `github.event.schedule == '<cron literal>'` test to pick the scope. When
    # the crons were retimed on 2026-07-28 those literals were not updated, so
    # every run silently fell back to the already-drained USA Diving queue and
    # the NCAA crawl made zero progress for 31 hours while reporting success.
    - cron: "5 */2 * * *"

concurrency:
  group: divemeets-results
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary

      - name: Crawl results batch
        id: crawl
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_ID: ${{ github.event.inputs.meet_id }}
          # Both empty on a scheduled run: that is the signal for the script
          # to drain its default chain. Only a manual dispatch narrows scope.
          SANCTION: ${{ github.event.inputs.sanction }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
          # Scheduled runs carry no inputs, so this MUST have a fallback — otherwise the
          # env var is empty on cron and the reduced run frequency above would not be
          # compensated by a larger per-run budget.
          FETCH_BUDGET: ${{ github.event.inputs.fetch_budget || '1200' }}
        run: |
          set -o pipefail
          python -u db/scripts/dm_results.py 2>&1 | tee /tmp/crawl.log

      - name: Record console tail to Neon
        # The script self-reports through report(), but that only runs when the
        # process survives to its own except block. A hard exit -- an OOM kill,
        # a segfault in the driver, an exception before DB_URL is read -- leaves
        # no trace anywhere, and Actions logs are not always reachable. This
        # step always runs, so a failed crawl can be diagnosed from Neon alone.
        if: always()
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          STEP_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          python - <<'PY'
          import os, json, datetime, psycopg2
          try:
              log = open('/tmp/crawl.log', encoding='utf-8', errors='replace').read()[-8000:]
          except Exception as e:
              log = '(no console captured: %r)' % (e,)
          payload = json.dumps({
              'at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'outcome': os.environ.get('STEP_OUTCOME'),
              'console': log})
          conn = psycopg2.connect(os.environ['DATABASE_URL']); cur = conn.cursor()
          cur.execute("""INSERT INTO app_meta.config (key, value, description)
                         VALUES (%s, %s, 'console tail of the last crawl run')
                         ON CONFLICT (key) DO UPDATE
                           SET value = EXCLUDED.value, updated_at = now()""",
                      (os.environ.get('CONSOLE_KEY', 'dm_results_last_console'), payload))
          conn.commit(); cur.close(); conn.close()
          PY
