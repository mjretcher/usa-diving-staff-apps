name: AE dive taxonomy audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Read-only audit of dive-category coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Run audit
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p db/audits
          python db/scripts/ae_taxonomy_audit.py | tee db/audits/ae_taxonomy_audit.txt
          cat db/audits/ae_taxonomy_audit.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/audits/ae_taxonomy_audit.txt
          git commit -m "AE taxonomy audit results ($(date -u +%Y-%m-%dT%H:%MZ))" || echo "no change"
          git pull --rebase --autostash -q || true
          git push
