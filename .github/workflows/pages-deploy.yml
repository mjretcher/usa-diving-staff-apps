name: Deploy to GitHub Pages

# DORMANT, deliberately. This deploys with actions/deploy-pages, which only
# works when the repository's Pages source is set to "GitHub Actions". It is
# currently set to "Deploy from a branch" (main, /), so GitHub's own built-in
# "pages build and deployment" does the real work and this workflow CANNOT
# succeed -- it failed on every push from 15:31 on 6 August, which is a red
# cross next to commits that deployed perfectly well.
#
# It is left in place rather than deleted so switching back is one edit: set
# Pages source to GitHub Actions in repository settings, then restore the push
# trigger below. Until then it runs only when asked for, so it stops reporting
# failure for work that succeeded.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
