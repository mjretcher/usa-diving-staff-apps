name: Deploy to GitHub Pages

# The site's publisher. Requires Settings -> Pages -> Source = "GitHub Actions".
# Branch-based Pages builds are capped at roughly 10 per hour and silently
# skip pushes past that; this workflow is not. Runs on every push to main,
# every hour (data commits marked [skip ci] still get published), and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gives every page its build id and writes version.json, which is what
      # the "Update now" bar compares against (shared/usad-update.js). The
      # stamped files exist only in the published copy, never in the repo.
      - name: Stamp build ids
        run: node tools/stamp-build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # The deploy step sometimes starts before GitHub can see the artifact
      # uploaded a second earlier ("No artifacts named github-pages were
      # found"). A short pause, then one more try if the first still misses it.
      - name: Give the upload a moment to register
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (second try)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
