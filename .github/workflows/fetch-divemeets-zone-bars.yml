name: Fetch DiveMeets zone qualifying scores

# Reads the published Regionals -> Zones "Qualifying Score" per event from the
# DiveMeets zone qualifier pages and commits db/seeds/divemeets_zone_bars_<year>.json.
# Read-only against DiveMeets; nothing is written to the database here.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated seasons, e.g. 2024 2025"
        required: true
        default: "2024 2025"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        continue-on-error: true
        run: |
          mkdir -p _raw
          for y in ${{ github.event.inputs.years }}; do
            for z in A B C D E F; do
              curl -sL -A "Mozilla/5.0" "https://secure.meetcontrol.com/divemeets/system/qualify-$y-summer-JO.php?zone=$z" -o "_raw/$y-$z.html" || true
            done
            python db/scripts/fetch_divemeets_zone_bars.py "$y" > "_raw/$y-parse.txt" 2>&1 || true
          done
          ls -la _raw
      - name: Commit results and raw pages to the scratch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B scratch-divemeets
          git add -f _raw db/seeds/divemeets_zone_bars_*.json 2>/dev/null || git add -f _raw
          git commit -m "DiveMeets zone qualifying-score pages [skip ci]" || true
          git push -f origin scratch-divemeets
