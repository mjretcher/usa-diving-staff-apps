name: Neon seed — junior_results.zone_thresholds

# Average-score bars. zone says where a bar applies:
#   A-F  2026 Regionals -> Zones, one per zone and event (DiveMeets zone qualifier lists)
#   ALL  a season's national Regionals -> Zones bar per event (2024: USA Diving workbook)
#   EWC  2026 E/W/C -> Junior Nationals 3rd-place average per event (Art. 303(b)(3)(ii))
#   Z18  2026 Zones -> E/W/C 18th-place average per event (Art. 304(a)(3))
# This table is the single source for all three; the apps and reports read it.

on:
  push:
    branches: [main]
    paths:
      - 'db/seeds/zone_thresholds.csv'
  workflow_dispatch:

jobs:
  seed:
    name: Load junior_results.zone_thresholds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Ensure table exists
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS junior_results;
            CREATE TABLE IF NOT EXISTS junior_results.zone_thresholds (
              id              BIGSERIAL PRIMARY KEY,
              year            SMALLINT,
              zone            TEXT,
              meet_id         TEXT,
              event_id        TEXT,
              event_name      TEXT,
              event_key       TEXT,
              threshold_score NUMERIC,
              event_sort      INT,
              source_url      TEXT,
              updated_at      TIMESTAMPTZ DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS idx_jzt_year_event ON junior_results.zone_thresholds(year, zone, event_key);
          SQL

      - name: Replace rows in one transaction
        # Truncate and load together: if the load fails (a bad line in the CSV),
        # the transaction rolls back and the old rows stay. On 2026-09-25 the two
        # ran as separate steps and a failed load left the table empty.
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          TRUNCATE junior_results.zone_thresholds RESTART IDENTITY;
          \copy junior_results.zone_thresholds(year,zone,meet_id,event_id,event_name,event_key,threshold_score,event_sort,source_url) FROM 'db/seeds/zone_thresholds.csv' WITH (FORMAT csv, HEADER true, NULL '')
          COMMIT;
          SQL

      - name: Report load stats
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT COUNT(*) AS rows_loaded, COUNT(DISTINCT zone) AS zones, COUNT(DISTINCT event_key) AS events FROM junior_results.zone_thresholds;"
