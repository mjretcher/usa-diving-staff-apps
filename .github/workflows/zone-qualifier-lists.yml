name: Zone qualifier lists (official Zone->Nationals qualifiers)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (default 2026)"
        required: false
        default: "2026"
      event_filter:
        description: "Comma-separated {meet}_{event} keys to (re)scrape, blank = all 48"
        required: false
        default: ""

jobs:
  scrape:
    name: Scrape Zone qualifier lists into core.zone_qualifier_lists
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Scrape and upsert
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          QUAL_YEAR: ${{ github.event.inputs.year || '2026' }}
          QUAL_EVENT_FILTER: ${{ github.event.inputs.event_filter }}
        run: python db/scripts/fetch_zone_qualifier_lists.py
