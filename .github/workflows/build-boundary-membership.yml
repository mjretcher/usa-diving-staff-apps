name: Build Boundary Studio membership counts

# Keeps Boundary Studio's map on the current membership. Started by Membership
# Analytics the moment an import finishes, with a once-a-day check as a fallback
# (it does nothing unless an import has landed since the last build), and
# whenever the build script changes. Rebuilds the three files the map reads,
# then asks Pages to deploy so the new numbers are live in a few minutes.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no import has landed since the last build"
        required: false
        default: ""
  schedule:
    - cron: "41 9 * * *"
  push:
    branches: [main]
    paths:
      - db/scripts/build_boundary_membership.py

permissions:
  contents: write
  actions: write

concurrency:
  group: build-boundary-membership
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - name: County member counts (boundary-data.json)
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FORCE: ${{ (github.event_name == 'push' || inputs.force != '') && '1' || '' }}
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/build_boundary_membership.py 2>&1 | tee db/audits/boundary_membership_build.txt
      - name: Membership types by zip (membership-geo.json)
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: python db/scripts/build_membership_geo.py
      - name: Competition Athletes by age and gender (comp-athletes-data.json)
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: python db/scripts/build_comp_athletes.py
      - name: Commit and deploy
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/audits/boundary_membership_build.txt membership-analytics/boundary-data.json membership-analytics/membership-geo.json membership-analytics/comp-athletes-data.json
          if git diff --cached --quiet -- membership-analytics; then DATA=0; else DATA=1; fi
          git commit -m "Boundary Studio: membership counts rebuilt from the database" || echo "nothing to commit"
          git pull --rebase --autostash -q || true
          git push
          # A push made with the workflow's own token does not start other
          # workflows, so ask for the Pages deploy directly.
          if [ "$DATA" = "1" ]; then gh workflow run pages-deploy.yml --ref main || true; fi
