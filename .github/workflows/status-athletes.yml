name: Measure foreign, dual and High Performance athletes

# Counts only (no names). Runs when the script changes and on demand; commits
# membership-analytics/status-athletes.json for the Boundary Studio Reports tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - db/scripts/measure_status_athletes.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/measure_status_athletes.py 2>&1 | tee db/audits/status_athletes.txt
      - name: Commit
        if: always()
        run: |
          git add -A membership-analytics/status-athletes.json db/audits/status_athletes.txt
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Foreign, dual and High Performance athlete counts"
          git pull --rebase --autostash -q || true
          git push origin HEAD:main
