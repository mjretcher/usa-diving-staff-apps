name: AE dive taxonomy backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Backfill taxonomy
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python db/scripts/backfill_dive_taxonomy.py | tee -a "$GITHUB_STEP_SUMMARY"
