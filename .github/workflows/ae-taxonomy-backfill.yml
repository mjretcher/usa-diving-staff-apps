name: AE dive taxonomy backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Backfill taxonomy
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          # Without pipefail the step reports tee's exit status, so a script
          # that died still shows green. This job "succeeded" for a run that
          # raised CardinalityViolation partway through.
          set -o pipefail
          python db/scripts/backfill_dive_taxonomy.py | tee -a "$GITHUB_STEP_SUMMARY"
