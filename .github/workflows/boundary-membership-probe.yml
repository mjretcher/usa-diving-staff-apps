name: Boundary membership probe (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [db/scripts/boundary_membership_probe.py]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - shell: bash
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/boundary_membership_probe.py 2>&1 | tee db/audits/boundary_membership_probe.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/audits/boundary_membership_probe.txt
          git commit -m "Boundary membership probe" || echo none
          git pull --rebase --autostash -q || true
          git push
