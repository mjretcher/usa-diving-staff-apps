name: Build Nearby data
# Counts by home ZIP and club placement for boundary-studio/nearby.html.
# Weekly (one Neon wake-up) plus on demand after a roster import.
on:
  workflow_dispatch: {}
  schedule: [{ cron: "0 11 * * 1" }]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary zipcodes==3.0.0
      - run: python db/scripts/build_nearby_data.py
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
      - run: |
          git add boundary-studio/nearby-data.json boundary-studio/nearby-places.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Nearby data (membership counts by home ZIP)"; git pull --rebase; git push
