name: AE omega verify
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - shell: bash
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/ae_omega_verify.py 2>&1 | tee db/audits/ae_omega_verify.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/ae_omega_verify.txt
          git commit -m "OMEGA load verification" || echo none
          git push
