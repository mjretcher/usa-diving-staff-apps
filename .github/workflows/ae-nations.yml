name: AE nation normalization
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - name: Apply DDL then backfill
        shell: bash
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: |
          set -o pipefail
          mkdir -p db/audits
          { echo "=== DDL ==="
            python db/scripts/apply_nation_ddl.py
            echo; echo "=== BACKFILL ==="
            python db/scripts/backfill_nations.py
          } 2>&1 | tee db/audits/ae_nations.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/ae_nations.txt
          git commit -m "AE nation normalization results" || echo none
          git push
