name: Neon full backup (download)

# One-click full backup of the entire Neon database.
# Run it from the Actions tab ("Run workflow"), wait for the green check,
# then open the run and download the "neon-backup" artifact — a single
# compressed .dump file you can copy to a flash drive or any storage.
#
# Restoring later (any Postgres, including a fresh Neon project):
#   pg_restore --no-owner --dbname="<connection string>" neon_backup_<date>.dump

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Check client version
        run: pg_dump --version && psql --version

      - name: Check connectivity (direct endpoint)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          psql "$DIRECT_URL" -c "SELECT version()"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          pg_dump "$DIRECT_URL" \
            --format=custom --compress=9 --no-owner --no-privileges \
            --file="neon_backup_${STAMP}.dump" 2> dump_err.txt || {
              RC=$?
              cat dump_err.txt
              psql "$DATABASE_URL" -v e="$(head -c 3000 dump_err.txt)" -c \
                "INSERT INTO app_meta.config (key, value, description) VALUES ('neon_backup_last_error', to_jsonb((:'e')::text)::text, 'neon-backup.yml') ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value, updated_at=now()"
              exit $RC
            }
          ls -lh neon_backup_*.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup
          path: neon_backup_*.dump
          retention-days: 14
          compression-level: 0
