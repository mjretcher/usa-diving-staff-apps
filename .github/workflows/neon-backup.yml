name: Neon full backup (download)

# One-click full backup of the entire Neon database.
# Run it from the Actions tab ("Run workflow"), wait for the green check,
# then open the run and download the "neon-backup" artifact — a single
# compressed .dump file you can copy to a flash drive or any storage.
#
# Restoring later (any Postgres, including a fresh Neon project):
#   pg_restore --no-owner --dbname="<connection string>" neon_backup_<date>.dump

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Check client version
        run: pg_dump --version && psql --version

      - name: Check connectivity (direct endpoint)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          psql "$DIRECT_URL" -c "SELECT version()"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.request
          from datetime import datetime, timezone

          db = os.environ["DATABASE_URL"]
          direct = db.replace("-pooler", "")
          host = re.search(r"@([^/:?]+)", direct).group(1)
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          out = f"neon_backup_{stamp}.dump"

          p = subprocess.run(
              ["pg_dump", direct, "--format=custom", "--compress=9",
               "--no-owner", "--no-privileges", f"--file={out}"],
              capture_output=True, text=True)

          report = {"at": datetime.now(timezone.utc).isoformat(),
                    "ok": p.returncode == 0, "rc": p.returncode,
                    "stderr": p.stderr[-4000:], "stdout": p.stdout[-1000:]}
          if p.returncode == 0:
              report["size_mb"] = round(os.path.getsize(out) / 1e6, 1)
          body = json.dumps({"query":
              "INSERT INTO app_meta.config (key, value, description) "
              "VALUES ('neon_backup_last_run', " 
              + "'" + json.dumps(report).replace("'", "''") + "', 'neon-backup.yml') "
              "ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value, updated_at=now()"}).encode()
          req = urllib.request.Request(f"https://{host}/sql", data=body, headers={
              "Neon-Connection-String": direct, "Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30).read()
          print(json.dumps(report, indent=2)[:2000])
          sys.exit(p.returncode)
          PYEOF

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup
          path: neon_backup_*.dump
          retention-days: 14
          compression-level: 0
