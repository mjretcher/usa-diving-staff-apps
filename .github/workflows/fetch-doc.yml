name: Fetch Doc Text

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of a PDF or HTML document to fetch"
        required: true
      first_page:
        description: "First page (PDF only)"
        required: false
        default: "1"
      last_page:
        description: "Last page (PDF only, 0 = end)"
        required: false
        default: "0"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch and extract
        run: |
          set -e
          mkdir -p db/scratch
          curl -sSL -A "Mozilla/5.0" -o /tmp/doc.bin "${{ github.event.inputs.url }}"
          if head -c 4 /tmp/doc.bin | grep -q '%PDF'; then
            FP="${{ github.event.inputs.first_page }}"
            LP="${{ github.event.inputs.last_page }}"
            if [ "$LP" = "0" ]; then
              pdftotext -layout -f "$FP" /tmp/doc.bin db/scratch/fetched-doc.txt
            else
              pdftotext -layout -f "$FP" -l "$LP" /tmp/doc.bin db/scratch/fetched-doc.txt
            fi
          else
            cp /tmp/doc.bin db/scratch/fetched-doc.txt
          fi
          wc -c db/scratch/fetched-doc.txt
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f db/scratch/fetched-doc.txt
          git commit -m "scratch: fetched doc text" || echo "no change"
          git push
