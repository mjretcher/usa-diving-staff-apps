name: Analytics Refresh

# Rebuilds the analytics schema (identity crosswalk, directory, benchmarks,
# field profiles) from core tables. Runs daily because the dive-sheet scraper
# is still back-filling meets toward 2015; safe to re-run any time.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
  push:
    branches: [main]
    paths:
      - 'db/scripts/build_analytics.py'

concurrency:
  group: analytics-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Key safety scan
        run: python db/scripts/key_safety_scan.py

      - name: Build analytics tables
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p db/audits
          python db/scripts/build_analytics.py 2>&1 | tee db/audits/analytics_refresh.log
      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/analytics_refresh.log || true
          git commit -m "analytics refresh log" || echo none
          git pull --rebase --autostash -q || true
          git push || true
