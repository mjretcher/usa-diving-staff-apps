name: DiveMeets dive-sheet crawl

on:
  workflow_dispatch:
    inputs:
      meet_id:
        description: "Crawl sheets for exactly this meet id (bypasses queue)"
        required: false
        default: ""
      sanction:
        description: "Narrow to one sanction (blank = drain the full chain)"
        required: false
        default: ""
      target_tag:
        description: "Queue from divemeets.crawl_targets with this tag ('*' = all). Overrides sanction."
        required: false
        default: ""
      fetch_budget:
        description: "Approx max page fetches this run"
        required: false
        default: "1100"
  schedule:
    # ONE slot; the script drains USA Diving then the NCAA targets per run.
    # See divemeets-results.yml for why the scope is no longer keyed off the
    # cron literal, and for the Neon awake-time cost reasoning.
    - cron: "35 */2 * * *"

concurrency:
  group: divemeets-sheets
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary

      - name: Crawl dive sheets batch
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MEET_ID: ${{ github.event.inputs.meet_id }}
          SANCTION: ${{ github.event.inputs.sanction }}
          TARGET_TAG: ${{ github.event.inputs.target_tag }}
          FETCH_BUDGET: ${{ github.event.inputs.fetch_budget || '2400' }}
        run: python db/scripts/dm_sheets.py
