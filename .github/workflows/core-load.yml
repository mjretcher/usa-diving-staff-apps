name: Load core from crawl

# Populates core.result_phases and core.dive_sheets directly from the DiveMeets
# crawl, then rebuilds analytics so the Athlete Evaluation app sees the new
# data in the same run.
#
# NOTE ON ORDERING: neon-seed-criteria.yml also truncates these two tables and
# reloads them from db/seeds/*.csv. That workflow only fires when those CSVs
# change, and they are no longer rewritten by anything. If it ever does run,
# re-run this workflow afterwards -- load_core.py reloads the CSV rows too, so
# it is a superset, never a subset.

on:
  workflow_dispatch:
    inputs:
      er_from_year:
        description: "Earliest year to load into core.event_results (2013 = full history)"
        required: false
        default: "2013"
  schedule:
    - cron: "40 4 * * *"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install psycopg2-binary

      - name: Load core from crawl
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ER_FROM_YEAR: ${{ github.event.inputs.er_from_year || '2013' }}
        run: python3 db/scripts/seedgen/load_core.py

      # core.dive_sheets is TRUNCATEd and reloaded above, and CORE_DIVE_COLS
      # carries no taxonomy columns — so every run of this job wipes
      # dive_bucket, dive_group_code, dive_group_label and dive_code_norm to
      # NULL across all 1.6M rows. Until now the backfill was dispatch-only,
      # which meant the nightly 04:40 run silently emptied
      # analytics.field_group_exec, field_group_exec_vo and dive_population
      # every night: The Field, Dive Groups and Meet Replay's percentile layer
      # all read those. It has to run here, after the load and BEFORE analytics
      # is rebuilt from it.
      - name: Restore dive taxonomy
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python3 db/scripts/backfill_dive_taxonomy.py

      - name: Rebuild analytics
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python3 db/scripts/build_analytics.py

      - name: Rebuild meet layer
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python3 db/scripts/build_meet_layer.py
