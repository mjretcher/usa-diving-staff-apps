name: AE gender check
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: |
          mkdir -p db/audits
          python db/scripts/ae_gender_check.py | tee db/audits/ae_gender_check.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "gha@users.noreply.github.com"
          git add db/audits/ae_gender_check.txt
          git commit -m "AE gender check" || echo none
          git push
