name: Schema drift check

# Compares db/schema.sql against the live database. Exists because every table
# is created with CREATE TABLE IF NOT EXISTS, which silently does nothing once
# the table exists -- so the file and the database drift apart with no error
# and the migration still reports success.

on:
  workflow_dispatch:
  push:
    paths:
      - 'db/schema.sql'
      - 'db/scripts/check_schema_drift.py'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Check drift
        id: drift
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python db/scripts/check_schema_drift.py
      - name: Commit report
        run: |
          git add -A membership-analytics/schema-drift.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Schema drift report [skip ci]"
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; exit 0; }
          git push origin HEAD:main || echo "::warning::could not push report"
      - name: Fail if drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo "::error::schema.sql does not match the database - see membership-analytics/schema-drift.json"
          exit 1
