name: Rebuild senior prequalification

# Derives the placement-based senior prequalification pathways from
# core.event_results and commits the result. Manual only: it should be rerun
# when a new Nationals or Winter Nationals lands, not on a timer.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Derive senior prequalification pathways
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Derive
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python db/scripts/build_senior_prequal.py

      - name: Commit if changed
        run: |
          git add -A membership-analytics/senior-prequal.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Derive senior prequalification pathways from core.event_results"
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; echo "::warning::rebase failed"; exit 0; }
          git push origin HEAD:main
