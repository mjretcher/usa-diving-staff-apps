name: Build AAU/USAD overlap

# Classifies Dive Live meets and measures the AAU <-> USA Diving membership
# overlap. Runs here rather than in the browser because matching needs member
# names, which the public browser role deliberately cannot read. Only
# aggregates are written back to the database.

on:
  workflow_dispatch:
  schedule:
    # Daily, after the hourly Dive Live scrape has had time to extend coverage.
    - cron: "50 6 * * *"

concurrency:
  group: build-aau-overlap
  cancel-in-progress: false

jobs:
  build:
    name: Classify meets and match membership
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary

      - name: Build
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python db/scripts/build_aau_overlap.py
