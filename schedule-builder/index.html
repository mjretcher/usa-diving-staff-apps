<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Schedule Builder — USA Diving</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#171F69;--red:#E31937;--gray:#5F6062;--cyan:#009AC7;--lb:#8FC3EA;
  --navy-10:rgba(23,31,105,.08);--navy-20:rgba(23,31,105,.15);
  --bg:#F2F3F7;--surface:#fff;--surface-2:#F8F9FC;
  --bd:rgba(0,0,0,.08);--bd-md:rgba(0,0,0,.14);--bd-strong:rgba(0,0,0,.22);
  --tx:#111827;--tx-2:#4B5563;--tx-3:#9CA3AF;
  --practice-bg:#F0FDF4;--practice-bd:#86EFAC;--practice-accent:#16A34A;
  --warmup-bg:#FFF7ED;--warmup-bd:#FCD34D;--warmup-accent:#D97706;
  --comp-bg:#EEF3FD;--comp-bd:#BFDBFE;--comp-accent:#171F69;
  --final-bg:#FEF2F2;--final-bd:#FECACA;--final-accent:#DC2626;
  --prelim-bg:#F0FDF4;--prelim-bd:#BBF7D0;--prelim-accent:#15803D;
  --split-bg:#FFFBEB;--split-bd:#FDE68A;--split-tx:#92400E;
  --r-sm:6px;--r:10px;--r-lg:14px;--r-xl:18px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --drawer-h:480px;
}

html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ── TOPBAR ── */
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.bar{
  background:var(--navy);display:flex;align-items:center;gap:0;
  padding:0;border-bottom:1px solid rgba(255,255,255,.06);z-index:200;
  box-shadow:0 2px 8px rgba(0,0,0,.25)
}
.bar-logo{display:flex;align-items:center;padding:0 16px;height:52px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0}
.bar-logo img{height:28px;width:auto;display:block}
.bar-meet{flex:1;padding:0 16px;cursor:pointer;overflow:hidden;min-width:0}
.bar-meet:hover .bar-meet-name{color:#fff}
.bar-meet-name{font-size:14px;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.bar-meet-meta{font-size:11px;color:rgba(255,255,255,.38);margin-top:1px}
.bar-days{display:flex;align-items:center;gap:3px;padding:0 12px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0}
.day-pill{
  height:30px;padding:0 11px;border-radius:15px;
  font-size:12px;font-weight:500;border:1px solid transparent;
  color:rgba(255,255,255,.55);background:transparent;transition:.15s;white-space:nowrap
}
.day-pill:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.day-pill.active{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.bar-actions{display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0}
.bar-btn{
  height:30px;padding:0 13px;border-radius:8px;
  font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);transition:.15s;white-space:nowrap
}
.bar-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.bar-btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.bar-btn.primary:hover{background:#CC1530}
.bar-status{
  height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:600;
  border:1px solid rgba(255,255,255,.14);transition:.15s;white-space:nowrap
}
.bar-status.draft{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45)}
.bar-status.review{background:rgba(234,179,8,.15);border-color:rgba(234,179,8,.3);color:#FDE047}
.bar-status.ready{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86EFAC}
.bar-status.published{background:rgba(0,154,199,.2);border-color:rgba(0,154,199,.4);color:#7DD3FC}
.bar-sep{width:1px;height:22px;background:rgba(255,255,255,.1)}
.bar-sync{display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0}
.sync-pip{width:6px;height:6px;border-radius:50%;background:#4ADE80;transition:background .3s}
.sync-pip.saving{background:#FBBF24}
.sync-pip.offline{background:var(--gray)}
.sync-pip.error{background:var(--red)}
.sync-lbl{font-size:11px;color:rgba(255,255,255,.35)}

/* ── MAIN AREA ── */
.workspace{display:flex;height:100%;overflow:hidden;position:relative}

/* ── TIMELINE (center, full width by default) ── */
.tl-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tl-sub{
  display:flex;align-items:center;gap:8px;padding:0 16px;
  height:40px;min-height:40px;background:var(--surface);
  border-bottom:1px solid var(--bd);
}
.tl-view-toggle{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:2px;gap:1px}
.tl-view-btn{
  height:26px;padding:0 12px;border-radius:5px;font-size:12px;font-weight:500;
  border:none;background:transparent;color:var(--tx-2);transition:.12s
}
.tl-view-btn.active{background:var(--surface);color:var(--tx);box-shadow:var(--shadow-sm)}
.tl-spacer{flex:1}
.tl-action-btn{
  height:28px;padding:0 10px;border-radius:var(--r-sm);font-size:11px;font-weight:500;
  border:1px solid var(--bd-md);background:var(--surface);color:var(--tx-2);
  display:flex;align-items:center;gap:5px;transition:.12s
}
.tl-action-btn:hover{background:var(--bg);border-color:var(--bd-strong)}
.tl-action-btn.lanes-open{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-add-btn{
  height:28px;padding:0 12px;border-radius:var(--r-sm);font-size:12px;font-weight:600;
  border:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:4px
}
.tl-add-btn:hover{background:#111750}

.tl-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.tl-body::-webkit-scrollbar{width:4px}
.tl-body::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:2px}

.tl-day-label{
  font-size:10px;font-weight:700;color:var(--tx-3);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:8px;margin-bottom:-2px
}
.tl-day-label::after{content:'';flex:1;height:1px;background:var(--bd)}

/* ── SESSION BLOCK ── */
.sess-block{
  background:var(--surface);border-radius:var(--r-lg);
  border:1px solid var(--bd);
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:box-shadow .15s,border-color .15s;
}
.sess-block:hover{box-shadow:var(--shadow);border-color:var(--bd-md)}
.sess-block.selected{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,31,105,.1),var(--shadow)}
.sess-block.practice-block{border-left:4px solid var(--practice-accent)}
.sess-block.warmup-block{border-left:4px solid var(--warmup-accent)}
.sess-block.comp-block{border-left:4px solid var(--navy)}
.sess-block.finals-block{border-left:4px solid var(--red)}

/* Block header */
.sb-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.sb-type-pill{
  height:22px;padding:0 9px;border-radius:11px;
  font-size:10px;font-weight:700;letter-spacing:.03em;
  white-space:nowrap;flex-shrink:0
}
.sb-type-pill.comp{background:var(--navy);color:#fff}
.sb-type-pill.finals{background:var(--red);color:#fff}
.sb-type-pill.prelim{background:var(--prelim-accent);color:#fff}
.sb-type-pill.practice{background:var(--practice-accent);color:#fff}
.sb-type-pill.warmup-type{background:var(--warmup-accent);color:#fff}
.sb-type-pill.training{background:var(--gray);color:#fff}

.sb-time{font-size:15px;font-weight:700;color:var(--tx);white-space:nowrap;flex-shrink:0}
.sb-time-range{font-size:11px;color:var(--tx-3);margin-left:2px;font-weight:400}
.sb-title{flex:1;min-width:0}
.sb-title-name{font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-title-sub{font-size:11px;color:var(--tx-3);margin-top:1px}
.sb-dur{font-size:12px;color:var(--tx-3);white-space:nowrap;flex-shrink:0}
.sb-edit-btn{
  width:28px;height:28px;border-radius:var(--r-sm);
  border:1px solid var(--bd);background:transparent;
  display:flex;align-items:center;justify-content:center;
  color:var(--tx-3);font-size:14px;flex-shrink:0;transition:.12s
}
.sb-edit-btn:hover{background:var(--bg);color:var(--tx-2);border-color:var(--bd-md)}

/* Warmup band */
.sb-warmup{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px;background:var(--warmup-bg);
  border-top:1px solid var(--warmup-bd);
  border-bottom:1px solid var(--warmup-bd);
}
.sb-wu-icon{font-size:13px;flex-shrink:0}
.sb-wu-label{font-size:11px;color:var(--warmup-accent);font-weight:600;flex:1}
.sb-wu-time{font-size:11px;color:var(--warmup-accent);font-weight:600}
.sb-wu-edit{
  height:20px;padding:0 7px;border-radius:4px;font-size:10px;font-weight:600;
  border:1px solid var(--warmup-bd);background:transparent;color:var(--warmup-accent)
}
.sb-wu-edit:hover{background:var(--warmup-bd)}

/* Event rows */
.sb-events{padding:4px 0 8px}
.sb-ev{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px;transition:background .1s;cursor:grab
}
.sb-ev:hover{background:var(--surface-2)}
.sb-ev+.sb-ev{border-top:1px solid var(--bd)}
.ev-drag-handle{color:var(--tx-3);font-size:13px;flex-shrink:0;cursor:grab;opacity:.4}
.ev-drag-handle:hover{opacity:.8}
.ev-name{flex:1;min-width:0}
.ev-name-main{font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-name-sub{font-size:10px;color:var(--tx-3);margin-top:1px}
.ev-badge{
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;
  white-space:nowrap;flex-shrink:0;letter-spacing:.02em
}
.ev-badge.split{background:var(--split-bg);border:1px solid var(--split-bd);color:var(--split-tx)}
.ev-badge.prelim{background:var(--prelim-bg);border:1px solid var(--prelim-bd);color:var(--prelim-accent)}
.ev-badge.final{background:var(--final-bg);border:1px solid var(--final-bd);color:var(--final-accent)}
.ev-badge.qualifier{background:var(--comp-bg);border:1px solid var(--comp-bd);color:var(--comp-accent)}
.ev-badge.semifinal{background:#F5F3FF;border:1px solid #C4B5FD;color:#6D28D9}
.ev-spd{
  font-size:11px;color:var(--tx-3);
  display:flex;align-items:center;gap:3px;flex-shrink:0
}
.ev-spd input{
  width:34px;font-size:11px;padding:2px 3px;border-radius:4px;
  border:1px solid var(--bd-md);text-align:center;background:var(--surface);
  color:var(--tx);font-family:inherit
}
.ev-spd input:focus{outline:none;border-color:var(--navy)}
.ev-time{font-size:11px;color:var(--tx-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
.ev-divers{
  display:flex;align-items:center;gap:3px;flex-shrink:0;font-size:11px;color:var(--tx-3)
}
.ev-divers input{
  width:36px;font-size:11px;padding:2px 4px;border-radius:4px;
  border:1px solid var(--bd-md);text-align:center;background:var(--surface);
  color:var(--tx);font-family:inherit
}
.ev-divers input:focus{outline:none;border-color:var(--navy)}
.ev-split-btn{
  height:20px;padding:0 6px;border-radius:4px;font-size:9px;font-weight:700;
  border:1px solid var(--bd-md);background:transparent;color:var(--tx-3);transition:.1s
}
.ev-split-btn.on{background:var(--split-bg);border-color:var(--split-bd);color:var(--split-tx)}
.ev-split-btn:hover:not(.on){background:var(--bg)}
.ev-remove{
  width:20px;height:20px;border-radius:4px;border:none;
  background:transparent;color:var(--tx-3);font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.ev-remove:hover{background:#FEE2E2;color:var(--red)}

/* Flights (sub-slots of practice blocks) */
.sb-flights{padding:6px 14px 10px;border-top:1px solid var(--bd)}
.flights-label{font-size:10px;font-weight:700;color:var(--tx-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.flight-row{
  display:flex;align-items:center;gap:8px;padding:5px 0;
  border-bottom:1px solid var(--bd)
}
.flight-row:last-child{border-bottom:none}
.flight-color{width:3px;height:32px;border-radius:2px;flex-shrink:0}
.flight-name{flex:1;min-width:0}
.flight-name input{
  width:100%;font-size:12px;padding:3px 6px;border-radius:5px;
  border:1px solid var(--bd-md);background:var(--surface);color:var(--tx);font-family:inherit
}
.flight-name input:focus{outline:none;border-color:var(--navy)}
.flight-dur{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:11px;color:var(--tx-3)}
.flight-dur input{
  width:38px;font-size:11px;padding:2px 4px;border-radius:4px;
  border:1px solid var(--bd-md);text-align:center;background:var(--surface);
  color:var(--tx);font-family:inherit
}
.flight-dur input:focus{outline:none;border-color:var(--navy)}
.flight-time{font-size:11px;color:var(--tx-3);white-space:nowrap;min-width:120px;font-variant-numeric:tabular-nums}
.flight-remove{
  width:20px;height:20px;border-radius:4px;border:none;
  background:transparent;color:var(--tx-3);font-size:14px;flex-shrink:0
}
.flight-remove:hover{background:#FEE2E2;color:var(--red)}
.add-flight-btn{
  margin-top:6px;width:100%;padding:5px;border-radius:6px;
  border:1px dashed var(--bd-strong);background:transparent;
  font-size:11px;color:var(--tx-3);display:flex;align-items:center;justify-content:center;gap:4px
}
.add-flight-btn:hover{background:var(--bg);color:var(--tx-2)}

/* Block footer actions */
.sb-foot{
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  border-top:1px solid var(--bd);background:var(--surface-2)
}
.sb-foot-btn{
  height:26px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:500;
  border:1px solid var(--bd-md);background:var(--surface);color:var(--tx-2);
  display:flex;align-items:center;gap:4px;transition:.12s
}
.sb-foot-btn:hover{background:var(--bg);border-color:var(--bd-strong)}
.sb-foot-btn.add{background:var(--navy-10);border-color:var(--navy-20);color:var(--navy)}
.sb-foot-btn.add:hover{background:var(--navy-20)}
.sb-foot-spacer{flex:1}
/* Buffer / warning inline */
.sb-buf{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  background:#F0FDF4;border-top:1px solid var(--practice-bd)
}
.sb-buf-label{font-size:10px;color:var(--practice-accent);font-weight:600;flex:1}
.buf-chips{display:flex;gap:3px}
.buf-chip{
  height:20px;padding:0 7px;border-radius:10px;font-size:10px;font-weight:600;
  border:1px solid var(--bd-md);background:transparent;color:var(--tx-3)
}
.buf-chip:hover{background:var(--bg)}
.buf-chip.on{background:var(--practice-accent);border-color:var(--practice-accent);color:#fff}
.sb-warn{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  background:#FFFBEB;border-top:1px solid #FDE68A
}
.sb-warn-dot{width:6px;height:6px;border-radius:50%;background:#D97706;flex-shrink:0}
.sb-warn-text{font-size:11px;color:#92400E;flex:1}
.sb-warn-ack{font-size:10px;color:#92400E;text-decoration:underline;border:none;background:transparent;cursor:pointer;font-family:inherit}

/* Add block row */
.add-block-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;opacity:0;transition:opacity .2s
}
.tl-body:hover .add-block-row{opacity:1}
.add-block-row:hover{opacity:1!important}
.add-block-line{flex:1;height:1px;background:var(--bd)}
.add-block-btn{
  height:26px;padding:0 12px;border-radius:13px;font-size:11px;font-weight:600;
  border:1px dashed var(--bd-strong);background:var(--surface);color:var(--tx-2);
  display:flex;align-items:center;gap:4px;white-space:nowrap
}
.add-block-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── RIGHT PANEL (lanes / preview) ── */
.right-panel{
  width:0;overflow:hidden;border-left:1px solid var(--bd);
  background:var(--surface);transition:width .25s;flex-shrink:0;
  display:flex;flex-direction:column
}
.right-panel.open{width:280px}
.rp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:40px;min-height:40px;
  border-bottom:1px solid var(--bd);flex-shrink:0
}
.rp-head-label{font-size:11px;font-weight:700;color:var(--tx-2);text-transform:uppercase;letter-spacing:.6px}
.rp-close-btn{
  width:22px;height:22px;border-radius:5px;border:1px solid var(--bd);
  background:transparent;color:var(--tx-3);font-size:13px;display:flex;align-items:center;justify-content:center
}
.rp-close-btn:hover{background:var(--bg)}
.rp-body{flex:1;overflow-y:auto;padding:12px}
.rp-body::-webkit-scrollbar{width:3px}
.rp-body::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:2px}

/* Mini schedule preview in right panel */
.mini-day-head{
  font-size:10px;font-weight:700;color:#fff;
  background:var(--navy);border-radius:5px;
  padding:4px 8px;margin-bottom:6px;letter-spacing:.04em
}
.mini-sess{margin-bottom:10px}
.mini-sess-head{
  font-size:11px;font-weight:600;color:var(--tx);
  display:flex;align-items:center;gap:6px;margin-bottom:4px
}
.mini-sess-type{
  width:6px;height:6px;border-radius:50%;flex-shrink:0
}
.mini-ev{
  font-size:11px;color:var(--tx-2);padding:3px 0 3px 12px;
  border-left:2px solid var(--bd);margin-left:3px;
  display:flex;align-items:baseline;gap:6px
}
.mini-ev-name{flex:1}
.mini-ev-time{font-size:10px;color:var(--tx-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini-practice{
  font-size:11px;color:var(--practice-accent);padding:4px 8px;
  background:var(--practice-bg);border-radius:5px;margin-bottom:6px;
  display:flex;align-items:center;gap:6px
}
.mini-warmup{
  font-size:10px;color:var(--warmup-accent);padding:3px 8px;
  background:var(--warmup-bg);border-radius:4px;margin-bottom:3px
}

/* ── DRAWER (edit panel) ── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0);z-index:300;
  pointer-events:none;transition:background .25s
}
.drawer-overlay.open{background:rgba(0,0,0,.3);pointer-events:all}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:400;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-lg);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:85vh;display:flex;flex-direction:column
}
.drawer.open{transform:translateY(0)}
.drawer-grip{
  width:36px;height:4px;border-radius:2px;background:var(--bd-strong);
  margin:10px auto 0;flex-shrink:0
}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 12px;border-bottom:1px solid var(--bd);flex-shrink:0
}
.drawer-title{font-size:16px;font-weight:700;color:var(--tx)}
.drawer-subtitle{font-size:12px;color:var(--tx-3);margin-top:2px}
.drawer-close{
  width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--bd);
  background:transparent;color:var(--tx-3);font-size:18px;
  display:flex;align-items:center;justify-content:center
}
.drawer-close:hover{background:var(--bg)}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-body::-webkit-scrollbar{width:4px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:2px}
.drawer-foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:12px 20px;border-top:1px solid var(--bd);flex-shrink:0
}

/* Form fields in drawer */
.field-group{margin-bottom:16px}
.field-label{font-size:11px;font-weight:600;color:var(--tx-2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.field-input{
  width:100%;font-size:14px;padding:8px 11px;
  border:1px solid var(--bd-md);border-radius:var(--r);
  background:var(--surface);color:var(--tx);
  transition:border-color .12s
}
.field-input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,31,105,.08)}
.field-select{
  width:100%;font-size:14px;padding:8px 11px;
  border:1px solid var(--bd-md);border-radius:var(--r);
  background:var(--surface);color:var(--tx);cursor:pointer
}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip-group{display:flex;gap:5px;flex-wrap:wrap}
.f-chip{
  height:30px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:500;
  border:1px solid var(--bd-md);background:transparent;color:var(--tx-2)
}
.f-chip:hover{background:var(--bg)}
.f-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.f-chip.on-green{background:var(--practice-accent);border-color:var(--practice-accent);color:#fff}
.f-chip.on-red{background:var(--red);border-color:var(--red);color:#fff}
.divider{height:1px;background:var(--bd);margin:14px 0}
.section-head{font-size:12px;font-weight:700;color:var(--tx-2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-head::after{content:'';flex:1;height:1px;background:var(--bd)}

/* Drawer events table */
.dev-table{width:100%;border-collapse:collapse;font-size:12px}
.dev-table th{font-size:10px;font-weight:700;color:var(--tx-3);text-transform:uppercase;letter-spacing:.5px;padding:4px 6px;text-align:left;border-bottom:1px solid var(--bd);background:var(--surface-2)}
.dev-table td{padding:6px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
.dev-table tr:last-child td{border-bottom:none}
.dev-table tr:hover td{background:var(--surface-2)}
.dev-inp{
  width:52px;font-size:12px;padding:3px 4px;border-radius:5px;
  border:1px solid var(--bd-md);text-align:center;font-family:inherit;
  background:var(--surface);color:var(--tx)
}
.dev-inp:focus{outline:none;border-color:var(--navy)}
.dev-inp.wide{width:70px}

/* Buttons */
.btn{
  height:36px;padding:0 18px;border-radius:var(--r);
  font-size:13px;font-weight:600;border:1px solid var(--bd-md);
  background:var(--surface);color:var(--tx);font-family:inherit;transition:.12s
}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#111750}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger:hover{background:#CC1530}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:var(--r-sm)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn-ghost:hover{background:var(--bg);border-color:var(--bd)}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px
}
.modal{
  background:var(--surface);border-radius:var(--r-xl);
  width:540px;max-width:100%;max-height:calc(100vh - 40px);
  overflow-y:auto;box-shadow:var(--shadow-lg)
}
.modal-lg{width:700px}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--bd);position:sticky;top:0;
  background:var(--surface);z-index:1;border-radius:var(--r-xl) var(--r-xl) 0 0
}
.modal-title{font-size:17px;font-weight:700;color:var(--tx)}
.modal-close{
  width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--bd);
  background:transparent;font-size:16px;color:var(--tx-3);
  display:flex;align-items:center;justify-content:center
}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:20px 22px}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;
  padding:14px 22px;border-top:1px solid var(--bd)
}

/* Event picker */
.ev-search{
  width:100%;font-size:14px;padding:9px 12px;
  border:1px solid var(--bd-md);border-radius:var(--r);
  background:var(--surface);color:var(--tx);margin-bottom:12px
}
.ev-search:focus{outline:none;border-color:var(--navy)}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:280px;overflow-y:auto;margin-bottom:14px}
.ev-grid::-webkit-scrollbar{width:3px}
.ev-grid::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:2px}
.ev-pick{
  padding:9px 11px;border-radius:var(--r);border:1px solid var(--bd);
  cursor:pointer;transition:.12s;background:var(--surface)
}
.ev-pick:hover{background:var(--surface-2);border-color:var(--bd-md)}
.ev-pick.sel{border-color:var(--navy);background:var(--comp-bg)}
.ep-name{font-size:12px;font-weight:600;color:var(--tx)}
.ep-meta{font-size:10px;color:var(--tx-3);margin-top:2px}
.ep-status{font-size:9px;padding:1px 5px;border-radius:4px;margin-top:3px;display:inline-block}
.ep-status.avail{background:var(--prelim-bg);color:var(--prelim-accent)}
.ep-status.used{background:var(--comp-bg);color:var(--comp-accent)}
.round-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.round-chip{
  height:30px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:600;
  border:1px solid var(--bd-md);background:transparent;color:var(--tx-2)
}
.round-chip:hover{background:var(--bg)}
.round-chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.round-chip.used{opacity:.4;cursor:not-allowed}

/* Library */
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:var(--r-lg);border:1px solid var(--bd);
  background:var(--surface);transition:.12s
}
.lib-item:hover{border-color:var(--bd-md);background:var(--surface-2)}
.lib-icon{

  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0

.lib-icon.builtin{background:var(--comp-bg)}
.lib-icon.cloud{background:#EFF6FF}
.lib-icon.local{background:var(--surface-2);border:1px solid var(--bd)}
.lib-info{flex:1;min-width:0}
.lib-name{font-size:13px;font-weight:600;color:var(--tx)}
.lib-meta{font-size:11px;color:var(--tx-3);margin-top:1px}
.lib-acts{display:flex;gap:5px;flex-shrink:0}
.lib-act{
  height:26px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:600;
  border:1px solid var(--bd-md);background:transparent;color:var(--tx-2)
}
.lib-act:hover{background:var(--bg)}
.lib-act.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.lib-section-label{font-size:10px;font-weight:700;color:var(--tx-3);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 6px}

/* Generate modal */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.aud-card{padding:12px 14px;border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:.12s}
.aud-card:hover{border-color:var(--bd-md);background:var(--surface-2)}
.aud-card.sel{border-color:var(--navy);background:var(--comp-bg)}
.aud-name{font-size:13px;font-weight:600;color:var(--tx)}
.aud-desc{font-size:11px;color:var(--tx-3);margin-top:2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;color:var(--tx-2)}
.toggle-row:last-child{border-bottom:none}
.tog{position:relative;width:34px;height:18px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--bd-strong);border-radius:9px;transition:.2s}
.tog-sl::before{content:'';position:absolute;width:14px;height:14px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl{background:var(--navy)}
.tog input:checked+.tog-sl::before{transform:translateX(16px)}

/* Print preview */
.pp-wrap{background:white;border-radius:var(--r-lg);padding:24px 28px;font-family:'Inter',sans-serif;max-height:380px;overflow-y:auto}
.pp-hd{border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between}
.pp-meet{font-size:18px;font-weight:700;color:var(--navy);margin:2px 0}
.pp-venue{font-size:11px;color:var(--gray)}
.pp-org{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.pp-logo-img{height:40px;width:auto}
.pp-day-hd{background:var(--navy);color:#fff;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:700;margin:12px 0 6px}
.pp-sess{padding:5px 0 6px;border-bottom:1px solid #eee}
.pp-sess:last-child{border-bottom:none}
.pp-sess-time{font-size:11px;font-weight:700;color:var(--navy)}
.pp-wu{font-size:10px;color:#888;margin-bottom:2px}
.pp-ev{font-size:11px;color:#333;padding:1px 0;display:flex;align-items:center;gap:5px}
.pp-ev-badge{font-size:9px;padding:1px 4px;border-radius:3px;background:#EEF3FD;color:#171F69}
.pp-footer{border-top:1px solid #eee;padding-top:8px;margin-top:12px;font-size:10px;color:#888;display:flex;justify-content:space-between}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:500;z-index:1000;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty states */
.empty{padding:48px 20px;text-align:center}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.4}
.empty-title{font-size:15px;font-weight:600;color:var(--tx-2);margin-bottom:4px}
.empty-sub{font-size:13px;color:var(--tx-3)}

@media print{
  body *{visibility:hidden}
  #printPreview,#printPreview *{visibility:visible}
  #printPreview{position:absolute;left:0;top:0;width:100%}
  .modal-bg{position:absolute;background:white;display:block}
  .modal{width:100%;max-width:none;max-height:none;box-shadow:none;border:none}
  .pp-wrap{max-height:none;padding:0}
}

    const others=(pr.rows||[]).length;

    if(cr.rows?.length&&cr.rows[0][0]){
      const remoteAt=new Date(cr.rows[0][0]).toISOString();

    const el=document.querySelector('.sync-editors');
    if(el)el.textContent=others?`· ${others} other${others>1?'s':''}':'';

// ── TIMING ENGINE ─────────────────────────────────────────────────────
function calcEvDur(ev){
  // Custom duration (practice blocks, custom blocks)
  if(Number(ev.customDurationMinutes||0)>0)return{totalDives:0,eventMinutes:Number(ev.customDurationMinutes),rawMinutes:Number(ev.customDurationMinutes),splitLanes:1};
  const divers=Math.max(0,Number(ev.numberOfDivers||0));
  const dives=Math.max(0,Number(ev.numberOfDives||ev.defaultDives||0));
  const spd=Math.max(0,Number(ev.secondsPerDive||ev.defaultSpd||35));
  const total=divers*dives;
  const raw=(total*spd)/60;
  const split=Boolean(ev.manualSplit)&&!isPlatform(ev.apparatus);
  const comp=split?raw/2:raw;
  const panels=split?Number(ev.numberOfPanelChanges||0)*Number(ev.minutesPerPanelChange||2.5):0;
  return{totalDives:total,eventMinutes:comp+panels,rawMinutes:raw,splitLanes:split?2:1};
}

// Calculate auto-stacked flight times within a practice block
function calcFlightTimes(session){
  const flights=session.flights||[];
  if(!flights.length)return[];
  let cursor=Number(session.warmupStartMinutes||0);
  return flights.map(f=>{
    const dur=Number(f.durationMinutes||30);
    const start=cursor;
    const end=start+dur;
    cursor=end;
    return{...f,startMinutes:start,endMinutes:end};
  });
}

function calcSessionTiming(session){
  // Practice/custom blocks
  if(session.isPractice){
    let dur=0;
    // If flighted, total is sum of flights; else use first event's customDuration
    if(session.flights?.length){
      const timed=calcFlightTimes(session);
      const lastFlight=timed[timed.length-1];
      dur=lastFlight?lastFlight.endMinutes-Number(session.warmupStartMinutes):60;
    } else {
      dur=Number(session.events[0]?.customDurationMinutes||60);
    }
    const start=Number(session.warmupStartMinutes);
    return{warmupStartMinutes:start,warmupEndMinutes:start,eventStartMinutes:start,
           sessionEndMinutes:start+dur,competitiveEnd:start+dur,events:[],flightTimes:calcFlightTimes(session)};
  }
  // Competition session
  const wu=Number(session.warmupStartMinutes);
  const wuEnd=wu+Number(session.warmupMinutes||55);
  const intro=Number(session.introMinutes||0);
  const first=roundUp(wuEnd+intro,Number(session.rounding||5));
  const cursors={};const timedEvs=[];
  (session.events||[]).forEach(ev=>{
    const lane=laneKey(ev.apparatus);
    const cursor=cursors[lane]??first;
    const dur=calcEvDur(ev);
    timedEvs.push({...ev,eventStartMinutes:cursor,eventEndMinutes:cursor+dur.eventMinutes,
      totalDives:dur.totalDives,rawMinutes:dur.rawMinutes,splitLanes:dur.splitLanes});
    cursors[lane]=roundUp(cursor+dur.eventMinutes,Number(session.rounding||5));
  });
  const compEnd=timedEvs.reduce((m,e)=>Math.max(m,e.eventEndMinutes),first);
  const awards=session.awardsEnabled?15:0;
  return{warmupStartMinutes:wu,warmupEndMinutes:wuEnd,eventStartMinutes:first,
         competitiveEnd:compEnd,sessionEndMinutes:compEnd+awards,
         awardsEnabled:session.awardsEnabled,awardsMinutes:awards,events:timedEvs,flightTimes:[]};
}

function allTimedSessions(){
  return state.meet.days.flatMap(day=>
    state.sessions.filter(s=>s.dayId===day.id)
      .sort((a,b)=>Number(a.warmupStartMinutes)-Number(b.warmupStartMinutes))
      .map(s=>({...s,timing:calcSessionTiming(s)}))
  );
}

function sessForDay(dayId,timed=false){
  const src=timed?allTimedSessions():state.sessions;
  return src.filter(s=>s.dayId===dayId).sort((a,b)=>Number(a.warmupStartMinutes)-Number(b.warmupStartMinutes));
}

function getSessNum(sess,all){
  if(sess.isPractice)return null;
  let n=1;for(const s of all){if(s.isPractice)continue;if(s.id===sess.id)return n;n++}
  return n;
}

function dayEnd(dayId){
  const s=sessForDay(dayId,true);
  if(!s.length)return null;
  return{start:Math.min(...s.map(x=>x.timing.warmupStartMinutes)),end:Math.max(...s.map(x=>x.timing.sessionEndMinutes))};
}

function buildWarnings(dayId){
  const sessions=sessForDay(dayId,true).filter(s=>!s.isPractice);
  const warns=[];
  for(let i=0;i<sessions.length-1;i++){
    const a=sessions[i],b=sessions[i+1];
    if(a.timing.sessionEndMinutes>b.timing.eventStartMinutes){
      const key=`overlap-${a.id}-${b.id}`;
      warns.push({key,sessionId:a.id,msg:`Session ends after next session starts (${fmt12(a.timing.sessionEndMinutes)} vs ${fmt12(b.timing.eventStartMinutes)})`});
    }
  }
  return warns.filter(w=>!(state.acknowledgedWarnings||[]).includes(w.key));
}

// ── EVENT CATALOG ─────────────────────────────────────────────────────
function buildCatalog(meetType){
  const def=MEET_TYPES[meetType]||MEET_TYPES.custom;
  const evs=[];
  const rounds=def.rounds||['Qualifier'];
  for(const group of(def.groups||[])){
    for(const gender of['Girls','Boys']){
      for(const app of['1m','3m']){
        const name=`${group} ${gender} ${appLabel(app)}`;
        const t=EVENT_TIMING[name]||{};
        evs.push({id:`${group}-${gender}-${app}`.toLowerCase().replace(/\s+/g,'-'),
          level:group,gender,apparatus:app,style:'Individual',
          defaultDives:t.dives||6,defaultSpd:t.spd||35,defaultWarmup:t.warmup||35,allowedRounds:rounds});
      }
      if(def.platform){
        const name=`${group} ${gender} Platform`;const t=EVENT_TIMING[name]||{};
        evs.push({id:`${group}-${gender}-platform`.toLowerCase().replace(/\s+/g,'-'),
          level:group,gender,apparatus:'Platform',style:'Individual',
          defaultDives:t.dives||6,defaultSpd:t.spd||45,defaultWarmup:t.warmup||35,allowedRounds:rounds});
      }
    }
  }
  if(def.senior){
    for(const gender of['Women','Men']){
      for(const app of['1m','3m','10m']){
        evs.push({id:`senior-${gender}-${app}`.toLowerCase(),
          level:'Senior',gender,apparatus:app,style:'Individual',
          defaultDives:gender==='Women'?5:6,defaultSpd:isPlatform(app)?38:32,
          defaultWarmup:isPlatform(app)?55:45,allowedRounds:rounds});
      }
    }
  }
  return evs;
}

  });

  `;

function afterRender(){
  // Drag and drop
  document.querySelectorAll('[data-ev][draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',`${el.dataset.sess}::${el.dataset.ev}`);
      el.style.opacity='.4';
    });
    el.addEventListener('dragend',()=>el.style.opacity='1');
  });
  document.querySelectorAll('[data-ev]').forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();el.style.background='var(--comp-bg)'});
    el.addEventListener('dragleave',()=>el.style.background='');
    el.addEventListener('drop',e=>{
      e.preventDefault();el.style.background='';
      const payload=e.dataTransfer.getData('text/plain');
      if(!payload)return;
      const[fromSess,fromEv]=payload.split('::');
      const toEv=el.dataset.ev;const toSess=el.dataset.sess;
      if(fromSess!==toSess||fromEv===toEv)return;
      update(s=>{
        const sess=s.sessions.find(x=>x.id===fromSess);if(!sess)return;
        const fi=sess.events.findIndex(e=>e.id===fromEv);
        const ti=sess.events.findIndex(e=>e.id===toEv);
        if(fi<0||ti<0)return;
        const[moved]=sess.events.splice(fi,1);sess.events.splice(ti,0,moved);
      });
    });
  });
  setSyncDot(state.currentLibraryId?(syncState.connected?'ok':'offline'):'offline');
}

function renderBar(timed){
  const tz=TZ_OPTS.find(t=>t.value===state.meet.timezone)||TZ_OPTS[0];
  const status=state.publishStatus||'draft';
  const dayBtns=state.meet.days.map(d=>`<button class="day-pill ${d.id===ui.activeDayId?'active':''}" onclick="selectDay('${d.id}')">${shortDate(d.date).split(',')[0]}</button>`).join('');
  return`<header class="bar">
    <div class="bar-logo"><img src="../shared/images/logo-white-horizontal.png" alt="USA Diving"/></div>
    <div class="bar-meet" onclick="ui.modal='meet';render()">
      <div class="bar-meet-name">${esc(state.meet.name||'New Schedule')}</div>
      <div class="bar-meet-meta">${esc(state.meet.venue)}${state.meet.city?' · '+esc(state.meet.city):''}${tz?' · '+tz.short:''} · ${MEET_TYPES[state.meet.meetType]?.label||'Custom'}</div>
    </div>
    <div class="bar-days">${dayBtns}
      <button class="day-pill" onclick="addDay()" title="Add day" style="opacity:.5">+</button>
    </div>
    <div class="bar-actions">
      <button class="bar-status ${status}" onclick="cycleStatus()" title="Click to advance status">${STATUS_LABELS[status]}</button>
      <div class="bar-sep"></div>
      <button class="bar-btn" onclick="openLibrary()">Library</button>
      <button class="bar-btn" onclick="saveSchedule()">Save</button>
      <button class="bar-btn primary" onclick="ui.modal='generate';render()">Generate</button>
    </div>
    <div class="bar-sync">
      <div class="sync-pip ${state.currentLibraryId?(syncState.connected?'':'offline'):'offline'}"></div>
      <span class="sync-lbl">${state.currentLibraryId?(syncState.connected?'Synced':'Offline'):'Local only'}</span>
      <span class="sync-editors" style="font-size:11px;color:rgba(0,154,199,.7)"></span>
    </div>

}

// ── TIMELINE ──────────────────────────────────────────────────────────
function renderTimeline(timed){
  const day=state.meet.days.find(d=>d.id===ui.activeDayId);
  const warns=day?buildWarnings(ui.activeDayId):[];
  const de=day?dayEnd(ui.activeDayId):null;

  return`<div class="tl-wrap">
    <div class="tl-sub">
      <div class="tl-view-toggle">
        <button class="tl-view-btn ${ui.previewMode==='operations'?'active':''}" onclick="ui.previewMode='operations';render()">Operations</button>
        <button class="tl-view-btn ${ui.previewMode==='public'?'active':''}" onclick="ui.previewMode='public';render()">Public view</button>
      </div>
      <div class="tl-spacer"></div>
      ${de?`<span style="font-size:11px;color:var(--tx-3)">Day: ${fmt12(de.start)}–${fmt12(de.end)} · ${fmtDur(de.end-de.start)}</span>`:''}
      <div class="tl-sep" style="width:1px;height:18px;background:var(--bd);margin:0 4px"></div>
      <button class="tl-action-btn ${ui.rightOpen?'lanes-open':''}" onclick="ui.rightOpen=!ui.rightOpen;render()">
        ${ui.rightOpen?'◀ Hide preview':'Preview ▶'}
      </button>
      <button class="tl-action-btn" onclick="showAddMenu()">+ Add block</button>
    </div>
    <div class="tl-body">
      ${day?`<div class="tl-day-label">${fullDate(day.date)}</div>`:''}
      ${day?(ui.previewMode==='public'?renderPublic(ui.activeDayId,timed):renderOpsTimeline(ui.activeDayId,timed,warns))
           :`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No days added</div><div class="empty-sub">Click + in the day bar above to add a competition day</div></div>`}
      ${day?`<div class="add-block-row">
        <div class="add-block-line"></div>
        <button class="add-block-btn" onclick="showAddMenu()">+ Add session or practice block</button>
        <div class="add-block-line"></div>
      </div>`:''}
    </div>
  </div>`;
}

function renderOpsTimeline(dayId,timed,warns){
  const sessions=sessForDay(dayId,true);
  if(!sessions.length)return`<div class="empty"><div class="empty-icon">🏊</div><div class="empty-title">No sessions yet</div><div class="empty-sub">Click "Add block" to build this day's schedule</div></div>`;
  return sessions.map(s=>renderSessBlock(s,timed,warns)).join('');
}

function renderSessBlock(session,timed,warns){
  const t=session.timing;
  const isPrac=session.isPractice;
  const isSelected=ui.drawerSessId===session.id;
  const warn=warns?.find(w=>w.sessionId===session.id);
  const n=getSessNum(session,timed);
  const buf=Number(session.bufferMinutes||0);

  // Determine block type for styling
  const blockType=isPrac?'practice-block':'comp-block';
  const hasFinals=!isPrac&&session.events.some(e=>e.round==='Final');
  const typeClass=isPrac?'practice-block':hasFinals?'finals-block':'comp-block';

  // Type pill label
  const typePill=isPrac?
    `<span class="sb-type-pill practice">${session.title||'Practice'}</span>`:
    hasFinals?`<span class="sb-type-pill finals">Finals</span>`:
    session.events.some(e=>e.round==='Prelim')?`<span class="sb-type-pill prelim">Prelim</span>`:
    `<span class="sb-type-pill comp">Session ${n}</span>`;

  const title=isPrac?(session.title||'Open Practice'):`Session ${n}`;
  const timeRange=`${fmt12(t.warmupStartMinutes)}–${fmt12(t.sessionEndMinutes)}`;
  const dur=fmtDur(t.sessionEndMinutes-t.warmupStartMinutes);

  // Sub-title
  const subtitle=isPrac?
    (session.flights?.length?`${session.flights.length} flights · ${fmtDur(t.sessionEndMinutes-t.warmupStartMinutes)}`:
     `Practice · ${fmtDur(t.sessionEndMinutes-t.warmupStartMinutes)}`):
    `${session.events.length} event${session.events.length!==1?'s':''}${session.events.some(e=>e.manualSplit&&!isPlatform(e.apparatus))?' · includes splits':''}`;

  const bufChips=[0,5,10,15].map(v=>`<button class="buf-chip ${buf===v?'on':''}" onclick="event.stopPropagation();setBuffer('${session.id}',${v})">${v===0?'Off':v+'m'}</button>`).join('');

  return`<div class="sess-block ${typeClass} ${isSelected?'selected':''} ${warn?'':''}" id="sess-${session.id}">
    <div class="sb-head" onclick="openDrawer('${session.id}')">
      ${typePill}
      <div class="sb-title">
        <div class="sb-title-name">${esc(title)}</div>
        <div class="sb-title-sub">${esc(subtitle)}</div>
      </div>
      <span class="sb-time">${fmt12(t.warmupStartMinutes)}</span>
      <span class="sb-time-range">–${fmt12(t.sessionEndMinutes)}</span>
      <span class="sb-dur">${dur}</span>
      <button class="sb-edit-btn" onclick="event.stopPropagation();openDrawer('${session.id}')" title="Edit session">✎</button>
    </div>

    ${!isPrac&&t.warmupStartMinutes<t.eventStartMinutes?`
    <div class="sb-warmup">
      <span class="sb-wu-icon">🌡</span>
      <span class="sb-wu-label">Warm-up</span>
      <span class="sb-wu-time">${fmt12(t.warmupStartMinutes)} – ${fmt12(t.warmupEndMinutes)} (${session.warmupMinutes||55} min)</span>
      <button class="sb-wu-edit" onclick="event.stopPropagation();openDrawer('${session.id}')">Edit</button>
    </div>`:''}

    ${isPrac?renderPracticeBody(session,t):''}
    ${!isPrac?renderEventsBody(session,t):''}

    ${warn?`<div class="sb-warn" onclick="event.stopPropagation()">
      <div class="sb-warn-dot"></div>
      <span class="sb-warn-text">${esc(warn.msg)}</span>
      <button class="sb-warn-ack" onclick="ackWarning('${warn.key}')">Dismiss</button>
    </div>`:''}

    ${!isPrac?`<div class="sb-buf" onclick="event.stopPropagation()">
      <span class="sb-buf-label">Buffer after session</span>
      <div class="buf-chips">${bufChips}
        <button class="buf-chip" onclick="const v=prompt('Buffer (min):',${buf});if(v!==null)setBuffer('${session.id}',Number(v)||0)">…</button>
      </div>
    </div>`:''}
  </div>`;
}

function renderPracticeBody(session,t){
  const flights=session.flights||[];
  if(!flights.length){
    // Simple practice block - show time window
    return`<div class="sb-warmup" style="background:var(--practice-bg);border-color:var(--practice-bd)">
      <span class="sb-wu-icon">🏊</span>
      <span class="sb-wu-label" style="color:var(--practice-accent)">Pool open</span>
      <span class="sb-wu-time" style="color:var(--practice-accent)">${fmt12(t.eventStartMinutes)} – ${fmt12(t.sessionEndMinutes)} (${fmtDur(t.sessionEndMinutes-t.eventStartMinutes)})</span>
      <button class="sb-wu-edit" style="border-color:var(--practice-bd);color:var(--practice-accent)" onclick="event.stopPropagation();openDrawer('${session.id}')">Edit</button>
    </div>`;
  }
  // Flighted practice - show each flight
  return`<div class="sb-flights">
    <div class="flights-label">Flights</div>
    ${(t.flightTimes||[]).map(f=>`
      <div class="flight-row">
        <div class="flight-color" style="background:${f.color||'var(--practice-accent)'}"></div>
        <div class="flight-name" style="font-size:12px;font-weight:500;color:var(--tx)">${esc(f.name)}</div>
        <div class="flight-time">${fmt12(f.startMinutes)} – ${fmt12(f.endMinutes)} · ${fmtDur(f.durationMinutes)}</div>
      </div>`).join('')}
  </div>`;
}

function renderEventsBody(session,t){
  if(!session.events.length)return`<div style="padding:10px 14px;font-size:12px;color:var(--tx-3)">No events — click Edit to add events to this session</div>`;
  return`<div class="sb-events">${(t.events||[]).map(ev=>{
    const split=ev.manualSplit&&!isPlatform(ev.apparatus);
    const roundClass=(ev.round||'qualifier').toLowerCase().replace(/[^a-z]+/g,'');
    const dur=calcEvDur(ev);
    const splitRec=dur.rawMinutes>=3||Number(ev.numberOfDivers||0)>=40;
    return`<div class="sb-ev" draggable="true" data-ev="${ev.id}" data-sess="${session.id}">
      <span class="ev-drag-handle" aria-hidden="true">⠿</span>
      <div class="ev-name">
        <div class="ev-name-main">${esc(evName(ev))}${split?` <span class="ev-badge split">SPLIT</span>`:''}</div>
        <div class="ev-name-sub">${ev.numberOfDives||ev.defaultDives||0} dives · ${fmtDur(dur.eventMinutes)}</div>
      </div>
      <div class="ev-divers">
        <input type="number" min="0" value="${ev.numberOfDivers||0}" title="Divers"
          onchange="updateEvent('${session.id}','${ev.id}','numberOfDivers',this.value)"
          onclick="event.stopPropagation()" />
        <span>divers</span>
      </div>
      ${ev.round&&ev.round!=='Custom Block'?`<span class="ev-badge ${roundClass}">${esc(ev.round)}</span>`:''}
      <div class="ev-spd">
        <input type="number" min="5" step="1" value="${ev.secondsPerDive||ev.defaultSpd||35}" title="Sec/dive"
          onchange="updateEvent('${session.id}','${ev.id}','secondsPerDive',this.value)"
          onclick="event.stopPropagation()" />
        <span>s</span>
      </div>
      ${!isPlatform(ev.apparatus)?`<button class="ev-split-btn ${split?'on':''}" onclick="event.stopPropagation();toggleSplit('${session.id}','${ev.id}')" title="${split?'Split on':'Split off'}">${split?'÷ Split':splitRec?'⚠ Split?':'Split'}</button>`:''}
      <span class="ev-time">${fmt12(ev.eventStartMinutes)}–${fmt12(ev.eventEndMinutes)}</span>
      <button class="ev-remove" onclick="event.stopPropagation();removeEvent('${session.id}','${ev.id}')" title="Remove">×</button>
    </div>`;
  }).join('')}</div>`;
}

// ── PUBLIC VIEW ───────────────────────────────────────────────────────
function renderPublic(dayId,timed){
  const sessions=sessForDay(dayId,true).filter(s=>!s.isPractice);
  if(!sessions.length)return`<div class="empty"><div class="empty-title">No competition sessions</div></div>`;
  const day=state.meet.days.find(d=>d.id===dayId);
  return`<div>
    <div style="font-size:13px;font-weight:700;color:var(--navy);padding:6px 10px;background:var(--comp-bg);border-radius:8px;margin-bottom:10px">${fullDate(day?.date||'')}</div>
    ${sessions.map(sess=>{const t=sess.timing;const n=getSessNum(sess,timed);return`<div style="padding:8px 0;border-bottom:1px solid var(--bd)">
      <div style="font-size:13px;font-weight:700;color:var(--tx)">Session ${n} — Events start ${fmt12(t.eventStartMinutes)}</div>
      <div style="font-size:11px;color:var(--tx-3);margin-bottom:4px">Warm-up ${fmt12(t.warmupStartMinutes)}–${fmt12(t.warmupEndMinutes)}</div>
      ${(t.events||[]).map(ev=>`<div style="font-size:12px;color:var(--tx-2);padding:2px 0;display:flex;align-items:center;gap:6px">
        ${esc(evName(ev))}
        ${ev.round&&ev.round!=='Custom Block'?`<span class="ev-badge ${(ev.round||'').toLowerCase().replace(/[^a-z]+/g,'')}">${esc(ev.round)}</span>`:''}
        <span style="margin-left:auto;font-size:10px;color:var(--tx-3)">${fmt12(ev.eventStartMinutes)}–${fmt12(ev.eventEndMinutes)}</span>
      </div>`).join('')}
    </div>`}).join('')}
  </div>`;
}

// ── RIGHT PANEL ───────────────────────────────────────────────────────
function renderRightPanel(timed){
  if(!ui.rightOpen)return`<div class="right-panel"></div>`;
  const day=state.meet.days.find(d=>d.id===ui.activeDayId);
  const sessions=day?sessForDay(ui.activeDayId,true):[];
  const comp=sessions.filter(s=>!s.isPractice);
  const prac=sessions.filter(s=>s.isPractice);

  return`<div class="right-panel open">
    <div class="rp-head">
      <span class="rp-head-label">Schedule preview</span>
      <button class="rp-close-btn" onclick="ui.rightOpen=false;render()">✕</button>
    </div>
    <div class="rp-body">
      ${day?`<div class="mini-day-head">${shortDate(day.date)}</div>`:''}
      ${prac.map(sess=>{
        const t=sess.timing;
        const flights=t.flightTimes||[];
        return`<div class="mini-practice">
          🏊 ${esc(sess.title||'Open Practice')} · ${fmt12(t.eventStartMinutes)}–${fmt12(t.sessionEndMinutes)}
        </div>
        ${flights.map(f=>`<div style="font-size:10px;color:var(--tx-3);padding:1px 0 1px 10px;border-left:2px solid ${f.color||'#ccc'};margin:2px 0 2px 4px">${esc(f.name)} · ${fmt12(f.startMinutes)}–${fmt12(f.endMinutes)}</div>`).join('')}`;
      }).join('')}
      ${comp.map(sess=>{
        const t=sess.timing;const n=getSessNum(sess,timed);
        const hasF=sess.events.some(e=>e.round==='Final');
        return`<div class="mini-sess">
          <div class="mini-sess-head">
            <div class="mini-sess-type" style="background:${hasF?'var(--red)':'var(--navy)'}"></div>
            Session ${n}
            <span style="font-size:10px;color:var(--tx-3);font-weight:400">${fmt12(t.eventStartMinutes)}</span>
          </div>
          <div class="mini-warmup">Warm-up ${fmt12(t.warmupStartMinutes)}–${fmt12(t.warmupEndMinutes)}</div>
          ${(t.events||[]).map(ev=>`<div class="mini-ev">
            <span class="mini-ev-name">${esc(evName(ev))}${ev.manualSplit&&!isPlatform(ev.apparatus)?' (Split)':''}</span>
            <span class="mini-ev-time">${fmt12(ev.eventStartMinutes)}</span>
          </div>`).join('')}
        </div>`;
      }).join('')}
      ${!sessions.length?`<div style="font-size:12px;color:var(--tx-3);text-align:center;padding:20px">No sessions yet</div>`:''}
    </div>
  </div>`;
}

// ── DRAWER ────────────────────────────────────────────────────────────
function renderDrawerOverlay(timed){
  const session=state.sessions.find(s=>s.id===ui.drawerSessId);
  if(!session)return'';
  const n=getSessNum(session,timed);
  const isPrac=session.isPractice;
  const t=session.timing||calcSessionTiming(session);
  const title=isPrac?(session.title||'Open Practice'):`Session ${n}`;
  const buf=Number(session.bufferMinutes||0);
  const intro=Number(session.introMinutes||0);
  const bufChips=[0,5,10,15].map(v=>`<button class="f-chip ${buf===v?'on-green':''}" onclick="setBuffer('${session.id}',${v})">${v===0?'Off':v+'m'}</button>`).join('');
  const introChips=[0,5,10,15].map(v=>`<button class="f-chip ${intro===v?'on':''}" onclick="updateSession('${session.id}','introMinutes',${v})">${v===0?'Off':v+'m'}</button>`).join('');
  const flights=session.flights||[];

  const drawerBody=isPrac?renderPracticeDrawer(session,t,flights):renderCompDrawer(session,t,timed,intro,introChips,bufChips);

  return`<div class="drawer-overlay open" onclick="if(event.target===this)closeDrawer()">
    <div class="drawer open">
      <div class="drawer-grip"></div>
      <div class="drawer-head">
        <div>
          <div class="drawer-title">${esc(title)}</div>
          <div class="drawer-subtitle">${fmt12(t.warmupStartMinutes)} – ${fmt12(t.sessionEndMinutes)} · ${fmtDur(t.sessionEndMinutes-t.warmupStartMinutes)}</div>
        </div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
      </div>
      <div class="drawer-body">${drawerBody}</div>
      <div class="drawer-foot">
        <button class="btn btn-danger btn-sm btn-ghost" onclick="deleteSession('${session.id}')">Delete session</button>
        <div style="flex:1"></div>
        <button class="btn btn-sm" onclick="closeDrawer()">Done</button>
      </div>
    </div>
  </div>`;
}

function renderPracticeDrawer(session,t,flights){
  return`
    <div class="field-group">
      <label class="field-label">Block name</label>
      <input class="field-input" value="${esc(session.title||'')}" placeholder="Open Practice" onchange="updateSession('${session.id}','title',this.value)" />
    </div>
    <div class="field-grid">
      <div class="field-group">
        <label class="field-label">Start time</label>
        <input class="field-input" type="time" value="${fmt24(session.warmupStartMinutes)}" onchange="updateSession('${session.id}','warmupStartMinutes',parseTime(this.value))" />
      </div>
      <div class="field-group">
        <label class="field-label">Duration (min) — auto if flights</label>
        <input class="field-input" type="number" min="15" step="15"
          value="${session.events[0]?.customDurationMinutes||90}"

    <div class="section-head">Flights (optional)</div>

    ${flights.length?`<div style="margin-bottom:8px">
      ${flights.map((f,i)=>{
        const ft=(t.flightTimes||[])[i]||{};
        return`<div class="flight-row">
          <div class="flight-color" style="background:${f.color||'var(--practice-accent)'}"></div>
          <div class="flight-name">
            <input value="${esc(f.name)}" placeholder="Flight name" onchange="updateFlight('${session.id}','${f.id}','name',this.value)" />
          </div>
          <div class="flight-dur">
            <input type="number" min="5" step="5" value="${f.durationMinutes||45}" onchange="updateFlight('${session.id}','${f.id}','durationMinutes',this.value)" />

          </div>
          <div class="flight-time">${ft.startMinutes!==undefined?`${fmt12(ft.startMinutes)}–${fmt12(ft.endMinutes)}`:'...'}</div>
          <button class="flight-remove" onclick="removeFlight('${session.id}','${f.id}')">×</button>

      }).join('')}
      <div style="font-size:11px;color:var(--tx-3);margin-top:4px">Total: ${fmtDur(flights.reduce((s,f)=>s+Number(f.durationMinutes||0),0))}</div>
    </div>`:''}
    <button class="add-flight-btn" onclick="addFlight('${session.id}')">+ Add flight</button>
  `;
}

    <div class="field-group">
      <label class="field-label">Buffer after session</label>

    <div class="divider"></div>
    <div class="section-head">Events</div>

          <td style="text-align:left;font-weight:500">${esc(evName(ev))}</td>
          <td><span class="ev-badge ${(ev.round||'qualifier').toLowerCase().replace(/[^a-z]+/g,'')}">${esc(ev.round||'')}</span></td>

          <td><input class="dev-inp" type="number" min="5" step="1" value="${ev.secondsPerDive||ev.defaultSpd||35}" onchange="updateEvent('${session.id}','${ev.id}','secondsPerDive',this.value)" /></td>
          <td>${!isPlatform(ev.apparatus)?`<button class="ev-split-btn btn-sm ${split?'on':''}" onclick="toggleSplit('${session.id}','${ev.id}')">${split?'÷':'—'}</button>`:'—'}</td>
          <td style="white-space:nowrap;font-variant-numeric:tabular-nums">${tev.eventStartMinutes!==undefined?`${fmt12(tev.eventStartMinutes)}–${fmt12(tev.eventEndMinutes)}`:'—'}</td>
          <td><button class="ev-remove" onclick="removeEvent('${session.id}','${ev.id}')">×</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`:`<div style="font-size:12px;color:var(--tx-3);margin-bottom:12px">No events added yet.</div>`}

  `;
}

function renderPickerModal(timed){

      if(!daySess.length&&!pracSess.length)return'';

          const t=s.timing;
          return`<div style="font-size:11px;color:var(--practice-accent);padding:3px 0;display:flex;align-items:center;gap:6px">

        }).join('')}
        ${daySess.map(sess=>{
          const t=sess.timing;const n=getSessNum(sess,timed);
          return`<div class="pp-sess"><div class="pp-sess-time">Session ${n} — Events start ${fmt12(t.eventStartMinutes)}</div>
            ${cfg.showWarmup?`<div class="pp-wu">Warm-up ${fmt12(t.warmupStartMinutes)}–${fmt12(t.warmupEndMinutes)}</div>`:''}
            ${(t.events||[]).map(ev=>`<div class="pp-ev">
              ${esc(evName(ev))}

              ${ev.manualSplit&&!isPlatform(ev.apparatus)?`<span class="pp-ev-badge" style="background:#FFFBEB;color:#92400E">Split</span>`:''}

            </div>`).join('')}
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
    <div class="pp-footer"><span>USA Diving · ${esc(state.meet.name)}</span><span>Schedule subject to change · ${new Date().toLocaleDateString()}</span></div>
  </div>`;

function splitPanelRotation(ev){
  const rots={springboard:{Girls:{'Group A':{pA:'Rounds 1,2,3,6,7',pB:'Rounds 4,5,8,9'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}},Boys:{'Group A':{pA:'Rounds 1,2,3,7,8',pB:'Rounds 4,5,6,9,10'},'Group B':{pA:'Rounds 1,2,3,6,7',pB:'Rounds 4,5,8,9'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}}},platform:{Girls:{'Group A':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group C':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}},Boys:{'Group A':{pA:'Rounds 1,2,5,6,7',pB:'Rounds 3,4,8,9'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}}}};
  const type=isPlatform(ev.apparatus)?'platform':'springboard';
  const r=rots[type]?.[ev.gender]?.[ev.level];
  if(!r)return'Review manually';
  return`Panel A: ${r.pA} | Panel B: ${r.pB}`;
}

function exportOpsTimeline(){
  const timed=allTimedSessions();
  const N='#171F69',R='#E31937',C='#009AC7',LB='#D6EBF8',PK='#FFF0F4',W='#FFFFFF',G='#F0F2F6';
  const th=(t,x='')=>`<th style="background:${N};color:${W};border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center;${x}">${t}</th>`;
  const td=(t,x='')=>`<td style="border:1px solid #888;padding:4px 6px;font-size:11px;text-align:center;${x}">${esc(String(t??''))}</td>`;
  const tdL=(t,x='')=>`<td style="border:1px solid #888;padding:4px 6px;font-size:11px;text-align:left;${x}">${esc(String(t??''))}</td>`;
  let rows='';
  state.meet.days.forEach(day=>{
    const ds=timed.filter(s=>s.dayId===day.id).sort((a,b)=>a.warmupStartMinutes-b.warmupStartMinutes);
    if(!ds.length)return;
    rows+=`<tr><td colspan="16" style="background:${R};color:${W};font-weight:700;font-size:12px;text-align:center;border:1px solid #000;padding:5px;text-transform:uppercase">${fullDate(day.date)}</td></tr>`;
    ds.forEach((sess,si)=>{
      const t=sess.timing;const bg=si%2===0?LB:PK;
      const n=getSessNum(sess,timed);const label=sess.isPractice?(sess.title||'Open Practice'):`Session ${n}`;
      rows+=`<tr style="background:${N}"><td colspan="16" style="background:${N};color:${W};font-weight:700;font-size:12px;text-align:left;border:1px solid #000;padding:5px 8px">${esc(label)}</td></tr>`;
      if(sess.isPractice){
        const ev=sess.events[0]||{};
        rows+=`<tr style="background:${bg}">${td('','background:'+N)
        }${td('Practice')}${tdL(ev.customLabel||label,'font-weight:500')}${td('')}${td('')}${td('')}${td('')}${td('','')}${td(fmtD1(ev.customDurationMinutes||0))}${td(fmt12(t.eventStartMinutes))}${td(fmt12(t.sessionEndMinutes))}${td('')}${td('')}${td('')}${td(fmt12(t.eventStartMinutes),'font-weight:700;background:'+C+';color:'+W)}${td(fmt12(t.sessionEndMinutes),'font-weight:700;background:'+C+';color:'+W)}</tr>`;
        return;
      }
      const intro=Number(sess.introMinutes||0);
      if(intro>0){
        rows+=`<tr style="background:${bg}">${td('')}${td('Intro')}${tdL('Introductions / Ceremony','font-style:italic')}${td('')}${td('')}${td('')}${td('')}${td('')}${td(fmtD1(intro))}${td('')}${td('')}${td(sess.warmupMinutes||0)}${td(fmt12(t.warmupStartMinutes))}${td(fmt12(t.warmupEndMinutes))}${td(fmt12(t.warmupStartMinutes-intro),'background:'+C+';color:'+W)}${td(fmt12(t.warmupStartMinutes),'background:'+C+';color:'+W)}</tr>`;
      }
      (t.events||[]).forEach(ev=>{
        const dur=calcEvDur(ev);const split=ev.manualSplit&&!isPlatform(ev.apparatus);
        const rBg=ev.round==='Final'?'#FEF2F2':ev.round==='Prelim'?'#F0FDF4':ev.round==='Semifinal'?'#F5F3FF':'#EEF3FD';
        rows+=`<tr style="background:${bg}">${td('')}${td(ev.round||'',`background:${rBg};font-weight:700;font-size:10px`)}${tdL(evName(ev)+(split?' (Split)':''),'font-weight:500')}${td(split?'Split':'')}${tdL(split?splitPanelRotation(ev):'')}${td(ev.numberOfDives||ev.defaultDives||0,`background:${G};font-weight:700`)}${td(ev.numberOfDivers||0,`background:${G};font-weight:700`)}${td(ev.secondsPerDive||ev.defaultSpd||0,`background:${G};font-weight:700`)}${td(fmtD1(dur.eventMinutes))}${td('')}${td('')}${td(sess.warmupMinutes||0,'font-weight:700')}${td(fmt12(t.warmupStartMinutes),'font-weight:700')}${td(fmt12(t.warmupEndMinutes),'font-weight:700')}${td(fmt12(ev.eventStartMinutes),`font-weight:700;background:${C};color:${W}`)}${td(fmt12(ev.eventEndMinutes),`font-weight:700;background:${C};color:${W}`)}</tr>`;
      });
    });
  });
  const html=`<html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:11px}table{border-collapse:collapse;width:100%}@media print{tr{page-break-inside:avoid}}</style></head><body>
  <div style="display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:3px solid ${N};margin-bottom:12px">
    <img src="../shared/images/logo-color-horizontal.png" alt="USA Diving" style="height:40px;width:auto" />
    <div><div style="font-size:18px;font-weight:700;color:${N}">${esc(state.meet.name)}</div><div style="font-size:12px;color:#666">${esc(state.meet.venue)} · Operations Timeline</div></div>
  </div>
  <table><thead><tr>${th('Day/Session','min-width:90px')}${th('Round','min-width:60px')}${th('Event','min-width:160px;text-align:left')}${th('Format')}${th('Panel Rotation','min-width:160px;text-align:left')}${th('# Dives',`background:${C}`)}${th('# Divers',`background:${C}`)}${th('Sec/Dive',`background:${C}`)}${th('Event Min')}${th('Prac Start')}${th('Prac End')}${th('WU Min')}${th('WU Start')}${th('WU End')}${th('Ev Start',`background:${R}`)}${th('Ev End',`background:${R}`)}</tr></thead><tbody>${rows}</tbody></table>
  <div style="margin-top:12px;font-size:10px;color:#888;border-top:1px solid #ddd;padding-top:8px">USA Diving · ${esc(state.meet.name)} · Generated ${new Date().toLocaleDateString()}</div></body></html>`;
  const blob=new Blob([html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${state.meet.name.replace(/[^a-z0-9]/gi,'-')}-ops-timeline.xls`;
  a.click();URL.revokeObjectURL(a.href);showToast('Operations timeline downloaded');
}

function exportExcel(){
  const timed=allTimedSessions();
  let html=`<html><head><meta charset="UTF-8"><style>body{font-family:Arial;font-size:11pt}table{border-collapse:collapse;width:100%}th{background:#171F69;color:white;padding:6px 10px;text-align:left}td{padding:5px 10px;border-bottom:1px solid #ddd}.day td{background:#E8ECFF;font-weight:bold;color:#171F69}.sess td{background:#F5F6FA;font-weight:bold}</style></head><body>
  <h2 style="color:#171F69;margin-bottom:4px">${esc(state.meet.name)}</h2>
  <p style="color:#666;margin-bottom:16px">${esc(state.meet.venue)}${state.meet.city?' · '+esc(state.meet.city):''}</p>
  <table><thead><tr><th>Day</th><th>Session</th><th>Event</th><th>Round</th><th>Divers</th><th>Dives</th><th>Sec/dive</th><th>Split</th><th>Warm-up</th><th>Event start</th><th>Event end</th><th>Duration</th></tr></thead><tbody>`;
  state.meet.days.forEach(day=>{
    const ds=timed.filter(s=>s.dayId===day.id).sort((a,b)=>a.warmupStartMinutes-b.warmupStartMinutes);
    if(!ds.length)return;
    html+=`<tr class="day"><td colspan="12">${fullDate(day.date)}</td></tr>`;
    ds.forEach(sess=>{
      const t=sess.timing;const n=getSessNum(sess,timed);
      const lbl=sess.isPractice?(sess.title||'Practice'):`Session ${n}`;
      html+=`<tr class="sess"><td></td><td colspan="11">${esc(lbl)} · ${fmt12(t.warmupStartMinutes)}–${fmt12(t.sessionEndMinutes)}</td></tr>`;
      (t.events||[]).forEach(ev=>{
        const dur=calcEvDur(ev);
        html+=`<tr><td>${fullDate(day.date)}</td><td>${esc(lbl)}</td><td>${esc(evName(ev))}</td><td>${esc(ev.round||'')}</td><td>${ev.numberOfDivers||0}</td><td>${ev.numberOfDives||ev.defaultDives||0}</td><td>${ev.secondsPerDive||ev.defaultSpd||35}</td><td>${ev.manualSplit&&!isPlatform(ev.apparatus)?'Yes':''}</td><td>${fmt12(t.warmupStartMinutes)}</td><td>${fmt12(ev.eventStartMinutes)}</td><td>${fmt12(ev.eventEndMinutes)}</td><td>${fmtDur(dur.eventMinutes)}</td></tr>`;
      });
    });
  });
  html+='</tbody></table></body></html>';
  const blob=new Blob([html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${state.meet.name.replace(/[^a-z0-9]/gi,'-')}-schedule.xls`;
  a.click();URL.revokeObjectURL(a.href);showToast('Excel downloaded');
}

ps.textContent='@media print{body *{visibility:hidden}#printPreview,#printPreview *{visibility:visible}#printPreview{position:absolute;left:0;top:0;width:100%}.modal-bg{position:absolute;background:white;display:block}.modal{width:100%;max-width:none;max-height:none;box-shadow:none;border:none}.pp-wrap{max-height:none;padding:0}}';
document.head.appendChild(ps);

// ── BOOT ──────────────────────────────────────────────────────────────
if(state.currentLibraryId)startSync();
render();
</script>
</body>
</html>
