<!-- ─────────────────────────────────────────────────────────────────────
     TOUCH DRAG-AND-DROP BRIDGE  (mobile only)
     Native HTML5 drag-and-drop does not fire from touch input, so on phones
     and tablets the existing reorder handlers never run. This bridge turns a
     touch gesture into the exact same dragstart / dragover / dragleave /
     drop / dragend events the desktop code already listens for — including a
     real .dataTransfer payload and .clientX/.clientY — so ALL existing reorder
     logic is reused unchanged. It is gated to touch devices and wrapped in
     try/catch, so on desktop (mouse) it does nothing at all.
     • Event rows  : drag from the ⠿ grip (starts after a small finger move).
     • Sessions    : long-press the session header (~400ms) to pick it up.
     A completed drag swallows the trailing click so nothing toggles by accident.
─────────────────────────────────────────────────────────────────────── -->
<script src="sb-touch-dnd.js?v=202607080038"></script>
