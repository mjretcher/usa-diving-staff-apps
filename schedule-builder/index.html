<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Schedule Builder — USA Diving</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#171F69;--red:#E31937;--gray:#5F6062;--cyan:#009AC7;
  --navy-soft:rgba(23,31,105,.07);--navy-mid:rgba(23,31,105,.14);
  --bg:#EDEEF3;--surf:#fff;--surf2:#F7F8FA;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.15);--bd3:rgba(0,0,0,.22);
  --tx:#111827;--tx2:#4B5563;--tx3:#9CA3AF;
  --g-prac:#16A34A;--g-prac-bg:#F0FDF4;--g-prac-bd:#BBF7D0;
  --g-wu:#D97706;--g-wu-bg:#FFFBEB;--g-wu-bd:#FDE68A;
  --g-split-bg:#FFFBEB;--g-split-bd:#FDE68A;--g-split-tx:#92400E;
  --r:8px;--r-lg:12px;--r-xl:16px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.14),0 4px 12px rgba(0,0,0,.06);
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

/* APP SHELL */
#app{display:grid;grid-template-rows:50px 1fr;height:100vh}

/* TOP BAR */
.bar{background:var(--navy);display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.bar-logo{display:flex;align-items:center;padding:0 16px;height:50px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0;text-decoration:none;transition:background .15s}
.bar-logo:hover{background:rgba(255,255,255,.06)}
.bar-logo img{height:26px;width:auto;display:block}
.bar-meet{flex:1;padding:0 14px;cursor:pointer;min-width:0;overflow:hidden}
.bar-meet-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.bar-meet-meta{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.bar-meet:hover .bar-meet-name{color:#fff}
.bar-days{display:flex;align-items:center;gap:2px;padding:0 10px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0;overflow-x:auto;max-width:50vw}
.bar-days::-webkit-scrollbar{display:none}
.dp{height:28px;padding:0 10px;border-radius:14px;font-size:11px;font-weight:500;border:1px solid transparent;color:rgba(255,255,255,.5);background:transparent;transition:.15s;white-space:nowrap;flex-shrink:0}
.dp:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.dp.active{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.2);font-weight:600}
.bar-right{display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0}
.bb{height:28px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);transition:.15s;white-space:nowrap}
.bb:hover{background:rgba(255,255,255,.15);color:#fff}
.bb.red{background:var(--red);border-color:var(--red);color:#fff}
.bb.red:hover{background:#CC1530}
.bar-status{height:22px;padding:0 9px;border-radius:11px;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.15);letter-spacing:.03em}
.bar-status.draft{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4)}
.bar-status.review{background:rgba(234,179,8,.15);border-color:rgba(234,179,8,.3);color:#FDE047}
.bar-status.ready{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86EFAC}
.bar-status.published{background:rgba(0,154,199,.2);border-color:rgba(0,154,199,.4);color:#7DD3FC}
.bar-bsep{width:1px;height:20px;background:rgba(255,255,255,.1)}
.bar-sync{display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0}
.sync-pip{width:6px;height:6px;border-radius:50%;background:#4ADE80;transition:background .3s;flex-shrink:0}
.sync-pip.saving{background:#FBBF24}.sync-pip.offline{background:var(--gray)}.sync-pip.error{background:var(--red)}
.sync-lbl{font-size:10px;color:rgba(255,255,255,.3)}

/* WORKSPACE: timeline + optional right edit panel */
.workspace{display:flex;height:100%;overflow:hidden;position:relative}

/* TIMELINE — full width primary surface */
.tl-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tl-bar{display:flex;align-items:center;gap:6px;padding:0 16px;height:38px;min-height:38px;background:var(--surf);border-bottom:1px solid var(--bd);flex-shrink:0}
.tl-view{display:flex;background:var(--bg);border-radius:6px;padding:2px;gap:1px}
.tvb{height:24px;padding:0 10px;border-radius:4px;font-size:11px;font-weight:500;border:none;background:transparent;color:var(--tx2);transition:.12s}
.tvb.active{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.tl-spacer{flex:1}
.tlab{height:26px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid var(--bd2);background:var(--surf);color:var(--tx2);display:flex;align-items:center;gap:4px;transition:.12s}
.tlab:hover{background:var(--bg);border-color:var(--bd3)}
.tlab.active-btn{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-day-info{font-size:11px;color:var(--tx3)}

.tl-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tl-body::-webkit-scrollbar{width:5px}
.tl-body::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:3px}

.tl-day-header{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px;margin-bottom:2px;padding-bottom:2px}
.tl-day-header::after{content:'';flex:1;height:1px;background:var(--bd)}

/* SESSION CARDS — expanded by default, show everything */
.sc{background:var(--surf);border-radius:var(--r-lg);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.sc:hover{border-color:var(--bd2)}
.sc.editing{border-color:var(--navy);box-shadow:0 0 0 2px rgba(23,31,105,.1),var(--sh-md)}
.sc.prac{border-left:4px solid var(--g-prac)}
.sc.training{border-left:4px solid var(--gray)}
.sc.comp{border-left:4px solid var(--navy)}
.sc.finals{border-left:4px solid var(--red)}

/* Card header — always visible, clean */
.sc-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.sc-hd:hover{background:rgba(0,0,0,.015)}

/* Type badge — compact pill, left of title */
.sc-badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.sc-badge.prac{background:var(--g-prac);color:#fff}
.sc-badge.training{background:var(--gray);color:#fff}
.sc-badge.comp{background:var(--navy);color:#fff}
.sc-badge.prelim{background:#16A34A;color:#fff}
.sc-badge.final{background:var(--red);color:#fff}
.sc-badge.qualifier{background:#2563EB;color:#fff}

.sc-title{flex:1;min-width:0}
.sc-title-name{font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.sc-title-sub{font-size:11px;color:var(--tx3);margin-top:1px}

/* Time display — right aligned, bold */
.sc-time-block{text-align:right;flex-shrink:0}
.sc-time-main{font-size:15px;font-weight:700;color:var(--tx);line-height:1}
.sc-time-range{font-size:11px;color:var(--tx3);margin-top:1px}
.sc-dur{font-size:11px;color:var(--tx3);margin-left:8px;white-space:nowrap;flex-shrink:0}

.sc-edit-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--tx3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:.12s}
.sc-edit-btn:hover{background:var(--bg);color:var(--tx2);border-color:var(--bd2)}

/* WARMUP ROW — always shown for comp sessions */
.sc-wu{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--g-wu-bg);border-top:1px solid var(--g-wu-bd);border-bottom:1px solid var(--g-wu-bd)}
.sc-wu-dot{width:8px;height:8px;border-radius:50%;background:var(--g-wu);flex-shrink:0}
.sc-wu-label{font-size:11px;font-weight:600;color:var(--g-wu);flex:1}
.sc-wu-time{font-size:11px;font-weight:600;color:var(--g-wu)}

/* PRACTICE OPEN POOL ROW */
.sc-pool{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--g-prac-bg);border-top:1px solid var(--g-prac-bd)}
.sc-pool-dot{width:8px;height:8px;border-radius:50%;background:var(--g-prac);flex-shrink:0}
.sc-pool-label{font-size:12px;font-weight:600;color:var(--g-prac);flex:1}
.sc-pool-time{font-size:12px;font-weight:600;color:var(--g-prac)}

/* FLIGHT ROWS within practice */
.sc-flights{padding:0 14px 8px;border-top:1px solid var(--bd)}
.sc-flight{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.sc-flight:last-child{border-bottom:none}
.sc-flight-bar{width:4px;height:28px;border-radius:2px;flex-shrink:0}
.sc-flight-name{flex:1;font-size:12px;font-weight:500;color:var(--tx)}
.sc-flight-time{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-flight-dur{font-size:11px;color:var(--tx3)}

/* EVENT ROWS — always visible on card */
.sc-events{padding:2px 0 6px}
.sc-ev{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--bd);cursor:grab;transition:background .1s}
.sc-ev:hover{background:var(--surf2)}
.sc-ev.dragging{opacity:.4}
.ev-drag{color:var(--tx3);font-size:13px;flex-shrink:0;opacity:.45;cursor:grab}
.ev-drag:hover{opacity:.8}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-sub{font-size:10px;color:var(--tx3);margin-top:1px}
/* Inline editable inputs right on the card */
.ev-inp{width:48px;font-size:12px;padding:4px 5px;border-radius:5px;border:1px solid var(--bd2);text-align:center;background:var(--surf);color:var(--tx);font-weight:500}
.ev-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(23,31,105,.1)}
.ev-inp-label{font-size:10px;color:var(--tx3);white-space:nowrap}
.ev-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
.ev-badge.prelim{background:#DCFCE7;border:1px solid #BBF7D0;color:#15803D}
.ev-badge.final{background:#FEE2E2;border:1px solid #FECACA;color:#B91C1C}
.ev-badge.qualifier{background:#DBEAFE;border:1px solid #BFDBFE;color:#1D4ED8}
.ev-badge.semifinal{background:#EDE9FE;border:1px solid #C4B5FD;color:#6D28D9}
.ev-badge.split{background:var(--g-split-bg);border:1px solid var(--g-split-bd);color:var(--g-split-tx)}
.ev-split-btn{height:22px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:700;border:1px solid var(--bd2);background:transparent;color:var(--tx3);transition:.1s;white-space:nowrap}
.ev-split-btn:hover:not(.on){background:var(--bg)}
.ev-split-btn.on{background:var(--g-split-bg);border-color:var(--g-split-bd);color:var(--g-split-tx)}
.ev-split-btn.rec{border-color:#FDE68A;color:#92400E}
.ev-time{font-size:11px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:110px;text-align:right}
.ev-remove{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--tx3);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev-remove:hover{background:#FEE2E2;color:var(--red)}

/* Card footer — buffer + add event */
.sc-foot{display:flex;align-items:center;gap:6px;padding:7px 14px;border-top:1px solid var(--bd);background:var(--surf2)}
.sc-buf-label{font-size:10px;color:var(--tx3);flex-shrink:0}
.buf-chips{display:flex;gap:3px}
.buf-chip{height:20px;padding:0 7px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid var(--bd2);background:transparent;color:var(--tx3)}
.buf-chip:hover{background:var(--bg)}
.buf-chip.on{background:var(--g-prac);border-color:var(--g-prac);color:#fff}
.sc-foot-spacer{flex:1}
.sc-add-ev{height:24px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--navy-mid);background:var(--navy-soft);color:var(--navy)}
.sc-add-ev:hover{background:var(--navy-mid)}
.sc-warn{display:flex;align-items:center;gap:7px;padding:6px 14px;background:#FFFBEB;border-top:1px solid #FDE68A}
.sc-warn-dot{width:6px;height:6px;border-radius:50%;background:#D97706;flex-shrink:0}
.sc-warn-text{font-size:11px;color:#92400E;flex:1}
.sc-warn-ack{font-size:10px;color:#92400E;text-decoration:underline;border:none;background:transparent}

/* Add block row */
.add-row{display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .2s;margin:2px 0}
.tl-body:hover .add-row,.add-row:hover{opacity:1}
.add-row-line{flex:1;height:1px;background:var(--bd)}
.add-row-btn{height:24px;padding:0 12px;border-radius:12px;font-size:11px;font-weight:600;border:1px dashed var(--bd3);background:var(--surf);color:var(--tx2);white-space:nowrap;transition:.12s}
.add-row-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* RIGHT EDIT PANEL — slides in from right */
.edit-panel{width:0;flex-shrink:0;overflow:hidden;border-left:1px solid var(--bd);background:var(--surf);transition:width .22s;display:flex;flex-direction:column}
.edit-panel.open{width:320px}
.ep-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.ep-title{font-size:15px;font-weight:700;color:var(--tx)}
.ep-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.ep-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:16px;display:flex;align-items:center;justify-content:center}
.ep-close:hover{background:var(--bg)}
.ep-body{flex:1;overflow-y:auto;padding:14px 16px}
.ep-body::-webkit-scrollbar{width:4px}
.ep-body::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:2px}
.ep-foot{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--bd);flex-shrink:0}

/* ENTRIES PANEL — slides in from right, replaces edit panel */
.entries-panel{width:0;flex-shrink:0;overflow:hidden;border-left:1px solid var(--bd);background:var(--surf);transition:width .22s;display:flex;flex-direction:column}
.entries-panel.open{width:520px}
.enp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.enp-title{font-size:15px;font-weight:700}
.enp-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:16px;display:flex;align-items:center;justify-content:center}
.enp-close:hover{background:var(--bg)}
.enp-day-bar{display:flex;gap:3px;padding:8px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;flex-wrap:nowrap}
.enp-day-bar::-webkit-scrollbar{display:none}
.enp-day-btn{height:26px;padding:0 10px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid var(--bd2);background:transparent;color:var(--tx2);white-space:nowrap;flex-shrink:0}
.enp-day-btn:hover{background:var(--bg)}
.enp-day-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.enp-body{flex:1;overflow-y:auto}
.enp-body::-webkit-scrollbar{width:4px}
.enp-body::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:2px}
.enp-sess-head{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2}
.enp-sess-head.comp-hd{background:var(--navy)}
.enp-sess-head.final-hd{background:var(--red)}
.enp-sess-label{font-size:12px;font-weight:700;color:#fff;flex:1}
.enp-sess-time{font-size:11px;color:rgba(255,255,255,.65)}
.enp-sess-chevron{font-size:12px;color:rgba(255,255,255,.65);transition:transform .2s}
.enp-sess-chevron.open{transform:rotate(180deg)}
.enp-table{width:100%;border-collapse:collapse}
.enp-table th{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;padding:7px 12px;text-align:left;border-bottom:1px solid var(--bd);background:var(--surf2);position:sticky;top:38px;z-index:1}
.enp-table td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.enp-table tr:last-child td{border-bottom:none}
.enp-table tr:hover td{background:var(--surf2)}
.enp-ev-name{font-size:12px;font-weight:500;color:var(--tx);min-width:160px}
.enp-inp{width:52px;font-size:13px;padding:5px 6px;border-radius:6px;border:1.5px solid var(--bd2);text-align:center;background:var(--surf);color:var(--tx);font-weight:500;transition:border-color .12s}
.enp-inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,31,105,.1)}
.enp-inp.final-inp{border-color:var(--red);color:var(--red);font-weight:700}
.enp-inp.filled{border-color:var(--navy);background:#EEF3FD}
.enp-split{height:26px;padding:0 9px;border-radius:6px;font-size:10px;font-weight:700;border:1.5px solid var(--bd2);background:transparent;color:var(--tx3);transition:.12s;white-space:nowrap}
.enp-split:hover:not(.on){background:var(--bg);border-color:var(--bd3)}
.enp-split.on{background:var(--g-split-bg);border-color:var(--g-split-bd);color:var(--g-split-tx)}
.enp-split.rec{border-color:#FDE68A;color:#92400E}
.enp-ev-time{font-size:11px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.enp-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--surf2)}
.enp-foot-info{font-size:11px;color:var(--tx3)}
.enp-finals-btn{height:28px;padding:0 12px;border-radius:7px;font-size:11px;font-weight:700;border:none;background:var(--red);color:#fff}
.enp-finals-btn:hover{background:#CC1530}

/* FORM FIELDS (edit panel) */
.fg{margin-bottom:14px}
.fl{font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--surf);color:var(--tx)}
.fi:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,31,105,.08)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:7px;font-size:11px;font-weight:500;border:1px solid var(--bd2);background:transparent;color:var(--tx2)}
.chip:hover{background:var(--bg)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on-g{background:var(--g-prac);border-color:var(--g-prac);color:#fff}
.chip.on-r{background:var(--red);border-color:var(--red);color:#fff}
.fdiv{height:1px;background:var(--bd);margin:12px 0}
.fsec{font-size:11px;font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fsec::after{content:'';flex:1;height:1px;background:var(--bd)}
/* Edit panel event table */
.ep-ev-table{width:100%;border-collapse:collapse;font-size:12px}
.ep-ev-table th{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;background:var(--surf2)}
.ep-ev-table td{padding:6px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
.ep-ev-table tr:last-child td{border-bottom:none}
.ep-ev-table tr:hover td{background:var(--surf2)}
.ep-inp{width:46px;font-size:11px;padding:3px 4px;border-radius:4px;border:1px solid var(--bd2);text-align:center}
.ep-inp:focus{outline:none;border-color:var(--navy)}
/* Flights editor */
.flight-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd)}
.flight-row:last-child{border-bottom:none}
.flight-bar{width:4px;height:28px;border-radius:2px;flex-shrink:0}
.flight-name-inp{flex:1;font-size:12px;padding:4px 7px;border-radius:5px;border:1px solid var(--bd2);background:var(--surf);color:var(--tx)}
.flight-name-inp:focus{outline:none;border-color:var(--navy)}
.flight-dur-inp{width:44px;font-size:12px;padding:4px 5px;border-radius:5px;border:1px solid var(--bd2);text-align:center;background:var(--surf);color:var(--tx)}
.flight-dur-inp:focus{outline:none;border-color:var(--navy)}
.flight-time-lbl{font-size:10px;color:var(--tx3);white-space:nowrap;min-width:100px;text-align:right}
.flight-rm{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--tx3);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flight-rm:hover{background:#FEE2E2;color:var(--red)}
.add-flight-btn{margin-top:6px;width:100%;padding:5px;border-radius:6px;border:1px dashed var(--bd3);background:transparent;font-size:11px;color:var(--tx3);display:flex;align-items:center;justify-content:center;gap:4px}
.add-flight-btn:hover{background:var(--bg);color:var(--tx2)}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surf);border-radius:var(--r-xl);width:500px;max-width:100%;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:var(--sh-lg)}
.modal-lg{width:680px}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--surf);z-index:1;border-radius:var(--r-xl) var(--r-xl) 0 0}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:transparent;font-size:15px;color:var(--tx3);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:12px 20px;border-top:1px solid var(--bd)}
/* Event picker */
.ev-search-inp{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--surf);color:var(--tx);margin-bottom:10px}
.ev-search-inp:focus{outline:none;border-color:var(--navy)}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:260px;overflow-y:auto;margin-bottom:12px}
.ev-grid::-webkit-scrollbar{width:3px}
.ev-grid::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:2px}
.ev-pick-card{padding:8px 10px;border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:.1s}
.ev-pick-card:hover{background:var(--surf2);border-color:var(--bd2)}
.ev-pick-card.sel{border-color:var(--navy);background:#EEF3FD}
.epc-name{font-size:12px;font-weight:600;color:var(--tx)}
.epc-meta{font-size:10px;color:var(--tx3);margin-top:1px}
.epc-status{font-size:9px;padding:1px 5px;border-radius:4px;margin-top:3px;display:inline-block}
.epc-status.avail{background:#DCFCE7;color:#15803D}
.epc-status.used{background:#DBEAFE;color:#1D4ED8}
.round-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.round-btn{height:28px;padding:0 12px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--bd2);background:transparent;color:var(--tx2)}
.round-btn:hover{background:var(--bg)}
.round-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.round-btn.used{opacity:.4;cursor:not-allowed}
/* Library */
.lib-folder-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.lib-ftab{height:28px;padding:0 12px;border-radius:14px;font-size:12px;font-weight:500;border:1px solid var(--bd2);background:transparent;color:var(--tx2);white-space:nowrap;transition:.12s}
.lib-ftab:hover{background:var(--bg)}
.lib-ftab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.lib-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lib-card{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-lg);border:1px solid var(--bd);background:var(--surf);transition:.1s}
.lib-card:hover{border-color:var(--bd2);background:var(--surf2)}
.lib-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--surf2);border:1px solid var(--bd)}
.lib-card-info{flex:1;min-width:0}
.lib-card-name{font-size:13px;font-weight:600;color:var(--tx)}
.lib-card-meta{font-size:11px;color:var(--tx3);margin-top:1px}
.lib-card-acts{display:flex;gap:4px;flex-shrink:0}
.lib-act{height:24px;padding:0 9px;border-radius:5px;font-size:11px;font-weight:600;border:1px solid var(--bd2);background:transparent;color:var(--tx2)}
.lib-act:hover{background:var(--bg)}
.lib-act.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.lib-sec-lbl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin:12px 0 6px}
/* Generate */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.aud-card{padding:10px 12px;border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:.1s}
.aud-card:hover{border-color:var(--bd2);background:var(--surf2)}
.aud-card.sel{border-color:var(--navy);background:#EEF3FD}
.aud-name{font-size:12px;font-weight:600}
.aud-desc{font-size:10px;color:var(--tx3);margin-top:2px}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px;color:var(--tx2)}
.tog-row:last-child{border-bottom:none}
.tog{position:relative;width:32px;height:17px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:var(--bd3);border-radius:8px;transition:.2s}
.tog-sl::before{content:'';position:absolute;width:13px;height:13px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl{background:var(--navy)}
.tog input:checked+.tog-sl::before{transform:translateX(15px)}
/* Print preview */
.pp{background:white;border-radius:var(--r-lg);padding:22px 26px;font-family:'Inter',sans-serif;max-height:360px;overflow-y:auto}
.pp-hd{border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:12px;display:flex;align-items:flex-start;justify-content:space-between}
.pp-org{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px}
.pp-meet{font-size:17px;font-weight:700;color:var(--navy);margin:2px 0}
.pp-venue{font-size:11px;color:var(--gray)}
.pp-logo{height:38px;width:auto}
.pp-day-hd{background:var(--navy);color:#fff;padding:4px 9px;border-radius:4px;font-size:11px;font-weight:700;margin:10px 0 5px}
.pp-sess{padding:4px 0 5px;border-bottom:1px solid #eee}
.pp-sess:last-child{border-bottom:none}
.pp-sess-t{font-size:11px;font-weight:700;color:var(--navy)}
.pp-wu{font-size:10px;color:#888;margin-bottom:2px}
.pp-ev{font-size:11px;color:#333;padding:1px 0;display:flex;align-items:center;gap:5px}
.pp-ev-b{font-size:9px;padding:1px 4px;border-radius:3px;background:#EEF3FD;color:#171F69}
.pp-ft{border-top:1px solid #eee;padding-top:7px;margin-top:10px;font-size:10px;color:#888;display:flex;justify-content:space-between}

/* BTN */
.btn{height:34px;padding:0 16px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid var(--bd2);background:var(--surf);color:var(--tx);font-family:inherit}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-p:hover{background:#111750}
.btn-d{background:var(--red);color:#fff;border-color:var(--red)}
.btn-d:hover{background:#CC1530}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:6px}
.btn-gh{background:transparent;border-color:transparent;color:var(--tx2)}
.btn-gh:hover{background:var(--bg);border-color:var(--bd)}

/* EMPTY */
.empty{padding:40px 20px;text-align:center}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.35}
.empty-title{font-size:14px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.empty-sub{font-size:12px;color:var(--tx3)}

/* TOAST */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(6px);background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font-size:12px;font-weight:500;z-index:1000;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>

  try{await nq(`INSERT INTO schedule_builder.schedules(id,name,meet_type,year,publish_status,data,updated_at)VALUES($1,$2,$3,$4,$5,$6::jsonb,now())ON CONFLICT(id)DO UPDATE SET name=EXCLUDED.name,meet_type=EXCLUDED.meet_type,publish_status=EXCLUDED.publish_status,data=EXCLUDED.data,updated_at=now()`,[id,name||S.meet.name,S.meet.meetType,parseInt(S.meet.days[0]?.date)||2026,S.publishStatus||'draft',JSON.stringify(S)]);lastSynced=new Date().toISOString();sync.ok=true;sync.err=null;saveS();setSyncDot('ok');toast('Saved to cloud ✓');startSync();}
  catch(e){sync.err=e.message;setSyncDot('error');toast('Cloud save failed — saved locally');}
}
async function loadNeonLib(){try{const r=await nq(`SELECT id,name,meet_type,publish_status,updated_at FROM schedule_builder.schedules ORDER BY updated_at DESC LIMIT 50`);return(r.rows||[]).map(row=>({id:row[0],name:row[1],meetType:row[2],publishStatus:row[3],savedAt:row[4],fromNeon:true}));}catch{return[]}}
async function loadFromNeon(id,opts={}){
  try{const r=await nq(`SELECT data,updated_at FROM schedule_builder.schedules WHERE id=$1`,[id]);const rows=r.rows||[];if(!rows.length)return null;
    const loaded=typeof rows[0][0]==='string'?JSON.parse(rows[0][0]):rows[0][0];
    S=loaded;S.currentLibraryId=id;saveS();lastSynced=new Date(rows[0][1]).toISOString();
    if(!opts.silent){UI.modal=null;initUI();render();toast('Schedule loaded');}else render();return loaded;}
  catch(e){if(!opts.silent)toast('Could not load');return null}
}
let presT=null,pollT=null;
function startSync(){
  clearInterval(presT);clearInterval(pollT);
  presT=setInterval(()=>S.currentLibraryId&&nq(`INSERT INTO schedule_builder.presence(editor_id,schedule_id,updated_at)VALUES($1,$2,now())ON CONFLICT(editor_id)DO UPDATE SET schedule_id=EXCLUDED.schedule_id,updated_at=now()`,[EDITOR_ID,S.currentLibraryId]).catch(()=>{}),8000);
  pollT=setInterval(async()=>{if(!S.currentLibraryId)return;try{const r=await nq(`SELECT updated_at FROM schedule_builder.schedules WHERE id=$1`,[S.currentLibraryId]);if(r.rows?.length&&lastSynced&&new Date(r.rows[0][0]).toISOString()>lastSynced)await loadFromNeon(S.currentLibraryId,{silent:true});sync.ok=true;setSyncDot('ok');}catch(e){sync.ok=false;setSyncDot('error')}},8000);

// ── TIMING ────────────────────────────────────────────────────────────
function calcEvDur(ev){
  if(Number(ev.customDurationMinutes||0)>0)return{evMin:Number(ev.customDurationMinutes),rawMin:Number(ev.customDurationMinutes)};
  const divers=Math.max(0,Number(ev.numberOfDivers||0));
  const dives=Math.max(0,Number(ev.numberOfDives||ev.defaultDives||0));
  const spd=Math.max(0,Number(ev.secondsPerDive||ev.defaultSpd||35));
  const raw=(divers*dives*spd)/60;
  const split=Boolean(ev.manualSplit)&&!isPlatform(ev.apparatus);
  const panels=split?Number(ev.numberOfPanelChanges||0)*Number(ev.minutesPerPanelChange||2.5):0;
  return{evMin:(split?raw/2:raw)+panels,rawMin:raw};
}
function calcFlightTimes(sess){
  if(!sess.flights?.length)return[];
  let cur=Number(sess.warmupStartMinutes||0);
  return sess.flights.map(f=>{const dur=Number(f.durationMinutes||30);const s=cur;cur+=dur;return{...f,startMinutes:s,endMinutes:cur}});
}
function calcSessTiming(sess){
  if(sess.isPractice){
    const ft=calcFlightTimes(sess);
    let dur;
    if(ft.length){const last=ft[ft.length-1];dur=last.endMinutes-Number(sess.warmupStartMinutes);}
    else dur=Number(sess.events[0]?.customDurationMinutes||90);
    const s=Number(sess.warmupStartMinutes);
    return{warmupStartMinutes:s,warmupEndMinutes:s,eventStartMinutes:s,sessionEndMinutes:s+dur,competitiveEnd:s+dur,events:[],flightTimes:ft};
  }
  const wu=Number(sess.warmupStartMinutes);
  const wuEnd=wu+Number(sess.warmupMinutes||55);
  const intro=Number(sess.introMinutes||0);
  const first=ru(wuEnd+intro,Number(sess.rounding||5));
  const cursors={};const tevs=[];
  (sess.events||[]).forEach(ev=>{
    const lane=lk(ev.apparatus);
    const cur=cursors[lane]??first;
    const dur=calcEvDur(ev);
    tevs.push({...ev,eventStartMinutes:cur,eventEndMinutes:cur+dur.evMin,evMin:dur.evMin,rawMin:dur.rawMin});
    cursors[lane]=ru(cur+dur.evMin,Number(sess.rounding||5));
  });
  const compEnd=tevs.reduce((m,e)=>Math.max(m,e.eventEndMinutes),first);
  const awards=sess.awardsEnabled?15:0;
  return{warmupStartMinutes:wu,warmupEndMinutes:wuEnd,eventStartMinutes:first,competitiveEnd:compEnd,sessionEndMinutes:compEnd+awards,events:tevs,flightTimes:[]};
}
function allTimed(){return S.meet.days.flatMap(day=>S.sessions.filter(s=>s.dayId===day.id).sort((a,b)=>Number(a.warmupStartMinutes)-Number(b.warmupStartMinutes)).map(s=>({...s,timing:calcSessTiming(s)})))}
function sessForDay(dayId){return S.sessions.filter(s=>s.dayId===dayId).sort((a,b)=>Number(a.warmupStartMinutes)-Number(b.warmupStartMinutes))}
function timedForDay(dayId){return allTimed().filter(s=>s.dayId===dayId)}
function getSessNum(sess,timed){if(sess.isPractice)return null;let n=1;for(const s of timed){if(s.isPractice)continue;if(s.id===sess.id)return n;n++;}return n}
function buildWarnings(dayId){
  const sessions=timedForDay(dayId).filter(s=>!s.isPractice);const warns=[];
  for(let i=0;i<sessions.length-1;i++){const a=sessions[i],b=sessions[i+1];if(a.timing.sessionEndMinutes>b.timing.warmupStartMinutes){warns.push({key:`ov-${a.id}-${b.id}`,sessId:a.id,msg:`Session ends at ${f12(a.timing.sessionEndMinutes)} but next warm-up starts ${f12(b.timing.warmupStartMinutes)}`});}}
  return warns.filter(w=>!(S.acknowledgedWarnings||[]).includes(w.key));
}

// ── EVENT CATALOG ─────────────────────────────────────────────────────
function buildCatalog(meetType){
  const def=MEET_TYPES[meetType]||MEET_TYPES.custom;const evs=[];
  for(const grp of(def.groups||[])){for(const gender of['Girls','Boys']){for(const app of['1m','3m']){const nm=`${grp} ${gender} ${al(app)}`;const t=EV_TIMING[nm]||{};evs.push({id:`${grp}-${gender}-${app}`.toLowerCase().replace(/\s+/g,'-'),level:grp,gender,apparatus:app,style:'Individual',defaultDives:t.dives||6,defaultSpd:t.spd||35,rounds:def.rounds||['Qualifier']});}if(def.plat){const nm=`${grp} ${gender} Platform`;const t=EV_TIMING[nm]||{};evs.push({id:`${grp}-${gender}-platform`.toLowerCase().replace(/\s+/g,'-'),level:grp,gender,apparatus:'Platform',style:'Individual',defaultDives:t.dives||6,defaultSpd:t.spd||45,rounds:def.rounds||['Qualifier']});}}}
  if(def.senior){for(const gender of['Women','Men']){for(const app of['1m','3m','10m']){evs.push({id:`senior-${gender}-${app}`.toLowerCase(),level:'Senior',gender,apparatus:app,style:'Individual',defaultDives:gender==='Women'?5:6,defaultSpd:isPlatform(app)?38:32,rounds:def.rounds||['Qualifier']});}}}
  return evs;
}

function addFlight(sessId){upd(s=>{const sess=s.sessions.find(x=>x.id===sessId);if(!sess)return;if(!sess.flights)sess.flights=[];const colors=['#171F69','#009AC7','#E31937','#16A34A','#D97706','#7C3AED'];sess.flights.push({id:uid(),name:`Flight ${sess.flights.length+1}`,durationMinutes:45,color:colors[sess.flights.length%colors.length]});const tot=sess.flights.reduce((s,f)=>s+Number(f.durationMinutes||0),0);if(sess.events[0])sess.events[0].customDurationMinutes=tot})}
function updFlight(sessId,fid,field,value){upd(s=>{const sess=s.sessions.find(x=>x.id===sessId);if(!sess?.flights)return;const f=sess.flights.find(x=>x.id===fid);if(!f)return;f[field]=field==='durationMinutes'?Number(value):value;const tot=sess.flights.reduce((s,f)=>s+Number(f.durationMinutes||0),0);if(sess.events[0])sess.events[0].customDurationMinutes=tot||90})}
function removeFlight(sessId,fid){upd(s=>{const sess=s.sessions.find(x=>x.id===sessId);if(!sess?.flights)return;sess.flights=sess.flights.filter(f=>f.id!==fid);const tot=sess.flights.reduce((s,f)=>s+Number(f.durationMinutes||0),0);if(sess.events[0])sess.events[0].customDurationMinutes=tot||90})}
function addEvToSess(sessId,presetId,round){const cat=buildCatalog(S.meet.meetType);const p=cat.find(e=>e.id===presetId);if(!p)return;const isFinal=round==='Final';const ev={id:uid(),level:p.level,gender:p.gender,apparatus:p.apparatus,style:p.style,round,defaultDives:p.defaultDives,numberOfDivers:isFinal?12:0,numberOfDives:p.defaultDives,secondsPerDive:p.defaultSpd,defaultSpd:p.defaultSpd,manualSplit:false,numberOfPanelChanges:0,minutesPerPanelChange:2.5,customDurationMinutes:0,notes:''};upd(s=>{const sess=s.sessions.find(x=>x.id===sessId);if(sess)sess.events.push(ev)})}

function renderCard(sess,timed,warns){
  const t=sess.timing;const isPrac=sess.isPractice;
  const isEditing=UI.editSessId===sess.id;
  const n=getSessNum(sess,timed);
  const hasFinals=!isPrac&&sess.events.some(e=>e.round==='Final');
  const hasPrelims=!isPrac&&sess.events.some(e=>e.round==='Prelim');
  const warn=warns?.find(w=>w.sessId===sess.id);
  const buf=Number(sess.bufferMinutes||0);

  // Badge
  let badgeClass='comp',badgeTxt=`Session ${n}`;
  if(isPrac&&sess.title==='Open Training'){badgeClass='training';badgeTxt='Open Training';}
  else if(isPrac){badgeClass='prac';badgeTxt=sess.title||'Open Practice';}
  else if(hasFinals){badgeClass='final';badgeTxt='Finals';}
  else if(hasPrelims){badgeClass='prelim';badgeTxt='Prelims';}

  // Card type class
  const cardClass=isPrac?(sess.title==='Open Training'?'training':'prac'):hasFinals?'finals':'comp';
  // Sub-line
  const sub=isPrac?(sess.flights?.length?`${sess.flights.length} flights · ${fdur(t.sessionEndMinutes-t.warmupStartMinutes)}`:`${fdur(t.sessionEndMinutes-t.warmupStartMinutes)} open pool`):
    `${sess.events.length} event${sess.events.length!==1?'s':''}${sess.events.some(e=>e.manualSplit&&!isPlatform(e.apparatus))?' · includes splits':''}`;

  // Buffer chips
  const bufChips=[0,5,10,15].map(v=>`<button class="buf-chip ${buf===v?'on':''}" onclick="event.stopPropagation();setBuffer('${sess.id}',${v})">${v===0?'None':v+'m'}</button>`).join('');

  return`<div class="sc ${cardClass} ${isEditing?'editing':''}" id="sc-${sess.id}">
    <div class="sc-hd" onclick="openEdit('${sess.id}')">
      <span class="sc-badge ${badgeClass}">${esc(badgeTxt)}</span>
      <div class="sc-title">
        <div class="sc-title-name">${isPrac?esc(sess.title||'Open Practice'):`Session ${n}`}</div>
        <div class="sc-title-sub">${esc(sub)}</div>
      </div>
      <div class="sc-time-block">
        <div class="sc-time-main">${f12(t.warmupStartMinutes)}</div>
        <div class="sc-time-range">–${f12(t.sessionEndMinutes)} · ${fdur(t.sessionEndMinutes-t.warmupStartMinutes)}</div>
      </div>
      <button class="sc-edit-btn" onclick="event.stopPropagation();openEdit('${sess.id}')" title="Edit">✎</button>
    </div>

    ${!isPrac?`<div class="sc-wu">

// ── DRAG & DROP ───────────────────────────────────────────────────────
function bindDrag(){
  document.querySelectorAll('[data-ev][draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',`${el.dataset.sess}::${el.dataset.ev}`);el.classList.add('dragging')});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{e.preventDefault();el.style.outline='2px solid var(--navy)'});
    el.addEventListener('dragleave',()=>el.style.outline='');
    el.addEventListener('drop',e=>{
      e.preventDefault();el.style.outline='';
      const[fromSess,fromEv]=e.dataTransfer.getData('text/plain').split('::');
      const toEv=el.dataset.ev,toSess=el.dataset.sess;
      if(fromSess!==toSess||fromEv===toEv)return;
      upd(s=>{const sess=s.sessions.find(x=>x.id===fromSess);if(!sess)return;const fi=sess.events.findIndex(e=>e.id===fromEv),ti=sess.events.findIndex(e=>e.id===toEv);if(fi<0||ti<0)return;const[m]=sess.events.splice(fi,1);sess.events.splice(ti,0,m)});
    });
  });
}

    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-p" ${!sel||!selRound?'disabled':''} onclick="addEvToSess('${UI.pickerSessId}','${UI.pickerPreset}','${selRound}');closeModal()">Add ${esc(selRound||'event')}</button></div>
  </div>`;
}

function renderLibraryModal(){
  const local=JSON.parse(localStorage.getItem(LK)||'[]');
  const byId={};BUILTIN_SCHEDULES.forEach(x=>byId[x.id]=x);
  if(!UI.libFolder)UI.libFolder='Regionals & Zones';
  const folderTabs=Object.keys(LIB_FOLDERS).map(name=>`<button class="lib-ftab ${UI.libFolder===name?'active':''}" onclick="UI.libFolder=this.dataset.f;render()" data-f="${esc(name)}">${LIB_FOLDERS[name].icon} ${name}</button>`).join('');
  const cfg=LIB_FOLDERS[UI.libFolder]||Object.values(LIB_FOLDERS)[0];
  const seen=new Set();const items=(cfg.ids||[]).map(id=>byId[id]).filter(x=>x&&!seen.has(x.id)&&seen.add(x.id));
  return`<div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-hd"><span class="modal-title">Schedule library</span><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="lib-folder-tabs">${folderTabs}</div>
      ${items.length?`<div class="lib-list">${items.map(item=>{const sc=item.schedule;const comp=sc.sessions.filter(s=>!s.isPractice).length;return`<div class="lib-card"><div class="lib-card-icon">${cfg.icon}</div><div class="lib-card-info"><div class="lib-card-name">${esc(item.name)}</div><div class="lib-card-meta">${sc.meet.days.length} days · ${comp} comp sessions</div></div><div class="lib-card-acts"><button class="lib-act p" onclick="loadBuiltin('${item.id}')">Load</button></div></div>`}).join('')}</div>`:`<div class="empty"><div class="empty-title">No templates in this folder</div></div>`}
      ${ui_neonLib_section(local)}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Close</button><button class="btn btn-p" onclick="saveSchedule()">Save to cloud</button></div>
  </div>`;
}
function ui_neonLib_section(local){
  let out='';
  if(UI.neonLibLoading)out+=`<div style="font-size:12px;color:var(--tx3);padding:10px 0">Loading cloud schedules…</div>`;
  if(UI.neonLib.length){out+=`<div class="lib-sec-lbl">Cloud saves</div><div class="lib-list">${UI.neonLib.map(item=>`<div class="lib-card"><div class="lib-card-icon">☁</div><div class="lib-card-info"><div class="lib-card-name">${esc(item.name)}</div><div class="lib-card-meta">${item.publishStatus||'draft'} · ${item.savedAt?new Date(item.savedAt).toLocaleDateString():''}</div></div><div class="lib-card-acts"><button class="lib-act p" onclick="loadFromNeon('${item.id}')">Load</button></div></div>`).join('')}</div>`;}
  if(local.length){out+=`<div class="lib-sec-lbl">Local saves</div><div class="lib-list">${local.map((item,i)=>`<div class="lib-card"><div class="lib-card-icon">💾</div><div class="lib-card-info"><div class="lib-card-name">${esc(item.name)}</div><div class="lib-card-meta">Local · ${new Date(item.savedAt).toLocaleDateString()}</div></div><div class="lib-card-acts"><button class="lib-act p" onclick="(()=>{const lib=JSON.parse(localStorage.getItem('${LK}')||'[]');S=JSON.parse(JSON.stringify(lib[${i}]?.schedule||{}));saveS();UI.modal=null;initUI();render()})()">Load</button></div></div>`).join('')}</div>`;}
  return out;
}

  const aud=UI.genAud;const cfg={...AUD[aud]};
  return`<div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-hd"><span class="modal-title">Generate output</span><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="aud-grid">${Object.entries(AUD).map(([k,c])=>`<div class="aud-card ${aud===k?'sel':''}" onclick="UI.genAud='${k}';render()"><div class="aud-name">${c.l}</div></div>`).join('')}</div>
      <div style="margin-bottom:14px">
        <div class="tog-row">Show warm-up times <label class="tog"><input type="checkbox" ${cfg.showWU?'checked':''} onchange="AUD['${aud}'].showWU=this.checked;render()"><span class="tog-sl"></span></label></div>
        <div class="tog-row">Show event start/end times <label class="tog"><input type="checkbox" ${cfg.showTimes?'checked':''} onchange="AUD['${aud}'].showTimes=this.checked;render()"><span class="tog-sl"></span></label></div>
        <div class="tog-row">Show sec/dive detail <label class="tog"><input type="checkbox" ${cfg.showSec?'checked':''} onchange="AUD['${aud}'].showSec=this.checked;render()"><span class="tog-sl"></span></label></div>
      </div>
      <div style="font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Preview</div>

function renderPP(timed,cfg){
  if(!S.meet.days.length||!timed.length)return`<div class="pp"><p style="text-align:center;color:var(--tx3);font-size:12px;padding:16px">No schedule to preview</p></div>`;
  return`<div class="pp" id="printPreview">
    <div class="pp-hd"><div><div class="pp-org">USA Diving</div><div class="pp-meet">${esc(S.meet.name)}</div><div class="pp-venue">${esc(S.meet.venue)}${S.meet.city?' · '+esc(S.meet.city):''}</div></div><img class="pp-logo" src="../shared/images/logo-color-horizontal.png" alt="USA Diving"/></div>
    ${S.meet.days.map(day=>{
      const ds=timed.filter(s=>s.dayId===day.id);const comp=ds.filter(s=>!s.isPractice);const prac=ds.filter(s=>s.isPractice);
      if(!ds.length)return'';
      return`<div><div class="pp-day-hd">${fullDate(day.date)}</div>
        ${prac.map(s=>`<div style="font-size:11px;color:var(--g-prac);padding:2px 0">🏊 ${esc(s.title||'Open Practice')} · ${f12(s.timing.eventStartMinutes)}–${f12(s.timing.sessionEndMinutes)}</div>`).join('')}
        ${comp.map(sess=>{const t=sess.timing;const n=getSessNum(sess,timed);return`<div class="pp-sess"><div class="pp-sess-t">Session ${n} — ${f12(t.eventStartMinutes)}</div>${cfg.showWU?`<div class="pp-wu">Warm-up ${f12(t.warmupStartMinutes)}–${f12(t.warmupEndMinutes)}</div>`:''}<div>${(t.events||[]).map(ev=>`<div class="pp-ev">${esc(evName(ev))}${ev.round&&ev.round!=='Custom Block'?`<span class="pp-ev-b">${esc(ev.round)}</span>`:''}${ev.manualSplit&&!isPlatform(ev.apparatus)?`<span class="pp-ev-b" style="background:#FFFBEB;color:#92400E">Split</span>`:''}${cfg.showTimes?`<span style="margin-left:auto;font-size:10px;color:#888">${f12(ev.eventStartMinutes)}–${f12(ev.eventEndMinutes)}</span>`:''}</div>`).join('')}</div></div>`;}).join('')}
      </div>`;
    }).join('')}
    <div class="pp-ft"><span>USA Diving · ${esc(S.meet.name)}</span><span>Subject to change · ${new Date().toLocaleDateString()}</span></div>
  </div>`;
}

// ── EXPORTS ───────────────────────────────────────────────────────────
function splitPanelRot(ev){const rots={sb:{Girls:{'Group A':{pA:'Rounds 1,2,3,6,7',pB:'Rounds 4,5,8,9'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}},Boys:{'Group A':{pA:'Rounds 1,2,3,7,8',pB:'Rounds 4,5,6,9,10'},'Group B':{pA:'Rounds 1,2,3,6,7',pB:'Rounds 4,5,8,9'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}}},plat:{Girls:{'Group A':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group C':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}},Boys:{'Group A':{pA:'Rounds 1,2,5,6,7',pB:'Rounds 3,4,8,9'},'Group B':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7,8'},'Group C':{pA:'Rounds 1,2,5,6',pB:'Rounds 3,4,7'},'Group D':{pA:'Rounds 1,2,6',pB:'Rounds 3,4,5'}}}};const type=isPlatform(ev.apparatus)?'plat':'sb';const r=rots[type]?.[ev.gender]?.[ev.level];return r?`Panel A: ${r.pA} | Panel B: ${r.pB}`:'Review manually'}

function exportOpsTimeline(){
  const timed=allTimed();
  const N='#171F69',R='#E31937',C='#009AC7',LB='#D6EBF8',PK='#FFF0F4',W='#FFFFFF',G='#F0F2F6';
  const th=(t,x='')=>`<th style="background:${N};color:${W};border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center;${x}">${t}</th>`;
  const td=(t,x='')=>`<td style="border:1px solid #888;padding:4px 6px;font-size:11px;text-align:center;${x}">${esc(String(t??''))}</td>`;
  const tdL=(t,x='')=>`<td style="border:1px solid #888;padding:4px 6px;font-size:11px;text-align:left;${x}">${esc(String(t??''))}</td>`;
  let rows='';
  S.meet.days.forEach(day=>{
    const ds=timed.filter(s=>s.dayId===day.id).sort((a,b)=>a.warmupStartMinutes-b.warmupStartMinutes);
    if(!ds.length)return;
    rows+=`<tr><td colspan="16" style="background:${R};color:${W};font-weight:700;font-size:12px;text-align:center;border:1px solid #000;padding:5px;text-transform:uppercase">${fullDate(day.date)}</td></tr>`;
    ds.forEach((sess,si)=>{
      const t=sess.timing;const n=getSessNum(sess,timed);const bg=si%2===0?LB:PK;
      const label=sess.isPractice?(sess.title||'Open Practice'):`Session ${n}`;
      rows+=`<tr><td colspan="16" style="background:${N};color:${W};font-weight:700;font-size:12px;text-align:left;border:1px solid #000;padding:5px 8px">${esc(label)}</td></tr>`;
      if(sess.isPractice){const ev=sess.events[0]||{};rows+=`<tr style="background:${bg}">${td('')}${td('Practice')}${tdL(ev.customLabel||label)}${td('')}${td('')}${td('')}${td('')}${td('')}${td(fd1(ev.customDurationMinutes||0))}${td(f12(t.eventStartMinutes))}${td(f12(t.sessionEndMinutes))}${td('')}${td('')}${td('')}${td(f12(t.eventStartMinutes),`font-weight:700;background:${C};color:${W}`)}${td(f12(t.sessionEndMinutes),`font-weight:700;background:${C};color:${W}`)}</tr>`;return;}
      const intro=Number(sess.introMinutes||0);
      if(intro>0)rows+=`<tr style="background:${bg}">${td('')}${td('Intro')}${tdL('Introductions')}${td('')}${td('')}${td('')}${td('')}${td('')}${td(fd1(intro))}${td('')}${td('')}${td(sess.warmupMinutes||0)}${td(f12(t.warmupStartMinutes))}${td(f12(t.warmupEndMinutes))}${td(f12(t.warmupStartMinutes-intro),`background:${C};color:${W}`)}${td(f12(t.warmupStartMinutes),`background:${C};color:${W}`)}</tr>`;
      (t.events||[]).forEach(ev=>{const dur=calcEvDur(ev);const split=ev.manualSplit&&!isPlatform(ev.apparatus);const rBg=ev.round==='Final'?'#FEF2F2':ev.round==='Prelim'?'#F0FDF4':'#EEF3FD';rows+=`<tr style="background:${bg}">${td('')}${td(ev.round||'',`background:${rBg};font-weight:700;font-size:10px`)}${tdL(evName(ev)+(split?' (Split)':''))}${td(split?'Split':'')}${tdL(split?splitPanelRot(ev):'')}${td(ev.numberOfDives||ev.defaultDives||0,`background:${G};font-weight:700`)}${td(ev.numberOfDivers||0,`background:${G};font-weight:700`)}${td(ev.secondsPerDive||ev.defaultSpd||0,`background:${G};font-weight:700`)}${td(fd1(dur.evMin))}${td('')}${td('')}${td(sess.warmupMinutes||0,'font-weight:700')}${td(f12(t.warmupStartMinutes),'font-weight:700')}${td(f12(t.warmupEndMinutes),'font-weight:700')}${td(f12(ev.eventStartMinutes),`font-weight:700;background:${C};color:${W}`)}${td(f12(ev.eventEndMinutes),`font-weight:700;background:${C};color:${W}`)}</tr>`});
    });
  });
  const html=`<html><head><meta charset="UTF-8"><style>body{font-family:Arial;font-size:11px}table{border-collapse:collapse;width:100%}</style></head><body><div style="display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:3px solid ${N};margin-bottom:12px"><img src="../shared/images/logo-color-horizontal.png" style="height:40px"/><div><div style="font-size:18px;font-weight:700;color:${N}">${esc(S.meet.name)}</div><div style="font-size:12px;color:#666">Operations Timeline</div></div></div><table><thead><tr>${th('Day/Session')}${th('Round')}${th('Event','text-align:left')}${th('Format')}${th('Panel Rotation','text-align:left')}${th('# Dives',`background:${C}`)}${th('# Divers',`background:${C}`)}${th('Sec/Dive',`background:${C}`)}${th('Event Min')}${th('Prac Start')}${th('Prac End')}${th('WU Min')}${th('WU Start')}${th('WU End')}${th('Ev Start',`background:${R}`)}${th('Ev End',`background:${R}`)}</tr></thead><tbody>${rows}</tbody></table><div style="margin-top:12px;font-size:10px;color:#888;border-top:1px solid #ddd;padding-top:8px">USA Diving · ${esc(S.meet.name)} · ${new Date().toLocaleDateString()}</div></body></html>`;
  dl(html,'application/vnd.ms-excel',`${S.meet.name.replace(/[^a-z0-9]/gi,'-')}-ops-timeline.xls`);
  toast('Operations timeline downloaded');
}

function exportExcel(){
  const timed=allTimed();
  let html=`<html><head><meta charset="UTF-8"><style>body{font-family:Arial;font-size:11pt}table{border-collapse:collapse;width:100%}th{background:#171F69;color:white;padding:6px 10px;text-align:left}td{padding:5px 10px;border-bottom:1px solid #ddd}.dh td{background:#E8ECFF;font-weight:bold;color:#171F69}.sh td{background:#F5F6FA;font-weight:bold}</style></head><body><h2 style="color:#171F69">${esc(S.meet.name)}</h2><table><thead><tr><th>Day</th><th>Session</th><th>Event</th><th>Round</th><th>Divers</th><th>Dives</th><th>Sec/dive</th><th>Split</th><th>Warm-up</th><th>Start</th><th>End</th></tr></thead><tbody>`;
  S.meet.days.forEach(day=>{const ds=timed.filter(s=>s.dayId===day.id).sort((a,b)=>a.warmupStartMinutes-b.warmupStartMinutes);if(!ds.length)return;html+=`<tr class="dh"><td colspan="11">${fullDate(day.date)}</td></tr>`;ds.forEach(sess=>{const t=sess.timing;const n=getSessNum(sess,timed);const lbl=sess.isPractice?(sess.title||'Practice'):`Session ${n}`;html+=`<tr class="sh"><td></td><td colspan="10">${esc(lbl)} · ${f12(t.warmupStartMinutes)}–${f12(t.sessionEndMinutes)}</td></tr>`;(t.events||[]).forEach(ev=>{const dur=calcEvDur(ev);html+=`<tr><td>${fullDate(day.date)}</td><td>${esc(lbl)}</td><td>${esc(evName(ev))}</td><td>${esc(ev.round||'')}</td><td>${ev.numberOfDivers||0}</td><td>${ev.numberOfDives||ev.defaultDives||0}</td><td>${ev.secondsPerDive||ev.defaultSpd||35}</td><td>${ev.manualSplit&&!isPlatform(ev.apparatus)?'Yes':''}</td><td>${f12(t.warmupStartMinutes)}</td><td>${f12(ev.eventStartMinutes)}</td><td>${f12(ev.eventEndMinutes)}</td></tr>`});});});
  html+='</tbody></table></body></html>';
  dl(html,'application/vnd.ms-excel',`${S.meet.name.replace(/[^a-z0-9]/gi,'-')}-schedule.xls`);
  toast('Excel downloaded');
}

function dl(html,type,name){const blob=new Blob([html],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}

// Print
const ps=document.createElement('style');ps.textContent='@media print{body *{visibility:hidden}#printPreview,#printPreview *{visibility:visible}#printPreview{position:absolute;left:0;top:0;width:100%}.modal-bg{position:absolute;background:white;display:block}.modal{width:100%;max-width:none;max-height:none;box-shadow:none;border:none}.pp{max-height:none;padding:0}}';document.head.appendChild(ps);

// ── BOOT ──────────────────────────────────────────────────────────────
if(S.currentLibraryId)startSync();
render();
</script>
