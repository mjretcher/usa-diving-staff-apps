<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athlete Evaluation — USA Diving Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../shared/design.css?v=202607132128" />
  <link rel="stylesheet" href="../shared/usad-overlays.css?v=20260628" />
  <link rel="stylesheet" href="styles.css?v=202608050" />
</head>
<body>

<header class="app-topbar ae-topbar">
  <a class="topbar-brand" href="../" aria-label="USA Diving Staff Apps home">
    <img src="../shared/images/logo-white-horizontal.png" alt="USA Diving" class="topbar-logo" />
  </a>
  <div class="topbar-divider"></div>
  <div class="topbar-identity">
    <div class="topbar-eyebrow">High Performance</div>
    <div class="topbar-title">Athlete Evaluation</div>
  </div>
  <nav class="hp-view-switch" aria-label="High Performance views">
    <a class="hp-view-tab" href="../criteria-simulator/">Standards Studio</a>
    <a class="hp-view-tab active" href="./" aria-current="page">Athlete Evaluation</a>
    <a class="hp-view-tab" href="../matchup-lab/">Matchup Lab</a>
  </nav>
  <div class="topbar-spacer"></div>
  <span id="aeFreshness" class="ae-freshness" hidden></span>
</header>

<!-- ── Athlete context bar: search + view tabs ─────────────── -->
<div class="ae-ctxbar">
  <div class="ae-search">
    <input type="search" id="aeSearchInput" class="ae-search-input" placeholder="Search any athlete — US or international…" autocomplete="off"/>
    <div id="aeSearchResults" class="ae-search-results" hidden></div>
  </div>
  <div id="aeAthleteChip" class="ae-athlete-chip"></div>
  <div id="aeExport" class="ae-export" hidden>
    <button class="ae-exp-btn" onclick="AEApp.report()" title="Full evaluation report, sized to print or save as PDF">Report</button>
    <button class="ae-exp-btn" onclick="AEApp.excel()" title="Formatted Excel workbook — summary, dive groups, dive by dive, every dive, meet history">Excel</button>
  </div>
  <nav id="aeTabs" class="ae-tabs" aria-label="Evaluation views"></nav>
</div>

<div class="hp-workspace ae-workspace" id="workspace">

<div id="view-field"><div id="fieldRoot"></div></div>

<div id="view-la28" class="ae-view" hidden></div>

<div id="view-passport" class="ae-view" hidden></div>
<div id="view-listlab"  class="ae-view" hidden></div>
<div id="view-pressure" class="ae-view" hidden></div>
<div id="view-gap"      class="ae-view" hidden></div>
<div id="view-podium"   class="ae-view" hidden></div>
<div id="view-groups"   class="ae-view" hidden></div>
<div id="view-value"    class="ae-view" hidden></div>
<div id="view-race"     class="ae-view" hidden></div>
<div id="view-medaltrack" class="ae-view" hidden></div>

</div><!-- /hp-workspace -->

<script src="../data/config.js?v=202607262115"></script>

<script src="ae-charts.js?v=202608050"></script>

<script src="ae-groups.js?v=202608050"></script>
<script src="ae-rules.js?v=202608050"></script>
<script src="ae-value.js?v=202608050"></script>
<script src="ae-gap.js?v=202608050"></script>
<script src="ae-report.js?v=202608050"></script>
<script src="app.js?v=202608050"></script>

</body>
</html>
