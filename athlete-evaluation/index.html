<header class="app-topbar">
  <a class="topbar-brand" href="../" aria-label="USA Diving Staff Apps home">
    <img src="../shared/images/logo-white-horizontal.png" alt="USA Diving" class="topbar-logo" />
  </a>
  <div class="topbar-divider"></div>

    <div class="topbar-eyebrow">High Performance</div>

  </nav>
  <div class="topbar-spacer"></div>

    <span id="aeFreshness" class="topbar-pill topbar-source" data-source="neon" hidden></span>

<div class="hp-below">
<nav class="hp-mobile-switch" aria-label="High Performance apps">

</nav>

<!-- Context bar: who you are looking at, and where -->
<div class="hp-ctxbar ae-ctxbar">
  <div class="ae-search">
    <input type="search" id="aeSearchInput" class="ae-search-input" placeholder="Search athletes or meets…" autocomplete="off"/>
    <div id="aeSearchResults" class="ae-search-results" hidden></div>
  </div>
  <div id="aeAthleteChip" class="ae-athlete-chip"></div>
  <div id="aeExport" class="ae-export" hidden>
    <button class="btn btn-sm" onclick="AEApp.report()" title="Full evaluation report, sized to print or save as PDF">Report</button>
    <button class="btn btn-sm" onclick="AEApp.excel()" title="Formatted Excel workbook — summary, dive groups, dive by dive, every dive, meet history">Excel</button>
  </div>
  <div class="hp-ctx-grow"></div>
  <nav id="aeSections" class="hp-tabs ae-secrow" aria-label="Evaluation sections"></nav>
</div>

<div class="hp-workspace ae-workspace hp-main" id="workspace">
<nav id="aeTabs" class="hp-pills ae-subrow" aria-label="Evaluation views"></nav>


<div id="view-field"><div id="fieldRoot"></div></div>

<div id="view-la28" class="ae-view" hidden></div>

<div id="view-passport" class="ae-view" hidden></div>
