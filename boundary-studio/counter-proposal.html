<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior Circuit Counter-Proposal · Boundary Studio · USA Diving</title>
<link rel="icon" type="image/svg+xml" href="../shared/images/diver-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--nav:#0a0e38;--navy:#171f69;--blue-900:#0d1040;--blue-600:#1e2d8a;--pool:#009ac7;--sky:#8fc3ea;--red:#e31937;
  --bg:#eaecf5;--surface:#fff;--surface-2:#f6f7fb;--line:#dde1ee;--ink:#141a3c;--muted:#5b6385;
  --gA:#171f69;--gB:#009ac7;--gC:#7c5cc4;--gD:#e3872f;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px;margin:0}
.top{background:var(--nav);color:#d4dcf5;padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:sticky;top:0;z-index:5}
.top a{color:#a8d4f0;text-decoration:none;font-weight:600;font-size:13px}
.top h1{font-size:22px;color:#fff;font-weight:700;margin-right:auto}
.draft{background:var(--red);color:#fff;font:700 11px Inter;padding:3px 8px;border-radius:999px;letter-spacing:.6px}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:#d4dcf5;font:700 13px Inter;padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#a8d4f0;color:var(--nav)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 70px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 2px rgba(10,14,56,.04)}
.card h2{font-size:24px;color:var(--navy);margin-bottom:4px}
.lede{color:var(--muted);margin:0 0 14px;max-width:880px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:800 28px "Barlow Condensed",Inter;color:var(--navy);line-height:1.1}
.kpi span{color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto}
svg text{font-family:Inter,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 13px Inter;padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:110px repeat(3,minmax(200px,1fr));gap:6px;min-width:760px}
.grid .h{font:700 12px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 6px}
.grid .d{background:var(--surface-2);border-radius:8px;padding:8px;font-size:12.5px}
.grid .d b{display:block;font:700 15px "Barlow Condensed";color:var(--navy)}
.cell{background:var(--surface-2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:44px}
.chip{border-radius:7px;padding:5px 8px;color:#fff;font-size:12px;line-height:1.3}
.chip small{opacity:.85;display:block}
.chip.ghost{background:#fff !important;color:var(--ink);border:1.5px dashed #9aa3c7}
.bars .row{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bars .track{background:var(--surface-2);border-radius:6px;height:16px;position:relative;overflow:hidden}
.bars .fill{height:100%;border-radius:6px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:12px}
.ctrl label{font-weight:600;font-size:12.5px;display:flex;justify-content:space-between}
.ctrl input{width:100%}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--surface-2)}
summary{font-weight:700;cursor:pointer;color:var(--navy)}
details p{margin:8px 0 2px}
.tag{display:inline-block;font:700 10.5px Inter;padding:2px 7px;border-radius:999px;background:#fdecef;color:var(--red);margin-left:6px;vertical-align:1px}
.ok{color:#15803d;font-weight:700}.bad{color:var(--red);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
footer{max-width:1180px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:12px}
@media print{.top{position:static}.seg,.tabs,.ctrl{display:none}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">&larr; Boundary Studio</a>
  <h1>Junior Circuit Counter-Proposal <span class="draft">DRAFT · FOR CCE/CAC DISCUSSION</span></h1>
  <div class="seg" role="group" aria-label="Model">
    <button data-model="12-6-1" aria-pressed="true">12 → 6 → 1</button>
    <button data-model="10-5-1" aria-pressed="false">10 → 5 → 1</button>
  </div>
</header>
<main id="app"><div class="card">Loading…</div></main>
<footer id="foot"></footer>
<script src="cp-engine.js"></script>
<script>
'use strict';
const COL={A:'var(--gA)',B:'var(--gB)',C:'var(--gC)',D:'var(--gD)'};
const HEX={A:'#171f69',B:'#009ac7',C:'#7c5cc4',D:'#e3872f'};
const GROUPS=['A Girls','A Boys','B Girls','B Boys','C Girls','C Boys','D Girls','D Boys'];
let DATA,MODEL='12-6-1',STAGE='Junior Nationals';
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('counter-proposal-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render();})
  .catch(e=>{$('#app').innerHTML='<div class="card">Could not load counter-proposal-data.json: '+esc(e.message)+'</div>';});
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{MODEL=b.dataset.model;
  document.querySelectorAll('[data-model]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});

function render(){
  const m=DATA.models[MODEL],t=m.totals;
  const s1=m.stop1.map(x=>x.entries),s2=m.stop2.map(x=>x.entries);
  const reach=Object.values(m.reach);
  $('#app').innerHTML=`
  <section class="card">
    <h2>${m.meets.Regionals} Regionals → ${m.meets.Zones} Zones → Junior Nationals</h2>
    <p class="lede">Three stops, proportional qualification at every stop, and a Junior Nationals built around a one-event-per-day schedule that finishes Group C/D and every Open event early. Everything below is projected athlete by athlete from real 2026 results.</p>
    <div class="kpis">
      <div class="kpi"><b>${fmt(t.nats)}</b><span>Junior Nationals qualifiers<br>+ up to ${t.openSpots} Open-earned prelim spots</span></div>
      <div class="kpi"><b>${Math.min(...s1)}–${Math.max(...s1)}</b><span>entries per Regional (${fmt(t.stop1)} total, Groups A–D)</span></div>
      <div class="kpi"><b>${Math.min(...s2)}–${Math.max(...s2)}</b><span>entries per Zone (${fmt(t.stop2)} total)</span></div>
      <div class="kpi"><b>${Math.min(...reach).toFixed(0)}–${Math.max(...reach).toFixed(0)}%</b><span>of eligible members reach Nationals, by age group &amp; gender</span></div>
      <div class="kpi"><b>8 days</b><span>Nationals competition + 2 training · Mission Viejo · Jul 26–Aug 8 window</span></div>
      <div class="kpi"><b>Day 4</b><span>last day of Group C/D competition at Nationals</span></div>
    </div>
  </section>
  <section class="card"><h2>Qualification pathway</h2>
    <p class="lede">Line widths are proportional to athlete-entries. Solid paths qualify; the dashed path is the Junior Nationals Open "last chance."</p>
    <div class="scroll">${pathwaySVG(m)}</div>
    <div class="legend"><span><i style="background:${HEX.A}"></i>Groups A/B</span><span><i style="background:${HEX.C}"></i>Groups C/D</span><span><i style="background:#c3c9e0"></i>Open entry / other routes</span></div>
  </section>
  <section class="card"><h2>Every athlete's journey</h2><p class="lede">What each age group dives at each stop.</p>${journey()}</section>
  <section class="card"><h2>Who gets to Nationals</h2>
    <p class="lede">Share of eligible competition members in each age group and gender who reach Junior Nationals. Under flat "top N" quotas a Group D boy was about three times as likely as a Group A girl to qualify; proportional spots even that out, limited only by the per-round caps in the largest events.</p>
    <div class="bars" id="reach"></div>
    <div class="legend"><span><i style="background:#c3c9e0"></i>2025 rules</span><span><i style="background:var(--sky)"></i>2026 as run</span><span><i style="background:var(--navy)"></i>Counter-proposal (${MODEL})</span></div>
  </section>
  <section class="two">
    <div class="card"><h2>Regional sizes</h2><p class="lede">Entries per first-stop meet (Groups A–D required).</p><div class="bars">${sizeBars(m.stop1,'#1e2d8a')}</div></div>
    <div class="card"><h2>Zone sizes</h2><p class="lede">Entries per Zone, including platform open entry.</p><div class="bars">${sizeBars(m.stop2,'#009ac7')}</div></div>
  </section>
  <section class="card"><h2>Junior Nationals round sizes</h2>
    <p class="lede">Prelims include the 2 Open-earned spots. Limits: prelims 50 springboard (25 per board) / 38 platform; semifinals 36 springboard (split) / 24 platform; finals 12 U.S. + up to 2 foreign + 2 dual.</p>
    <div class="scroll">${eventTable(m)}</div></section>
  <section class="card"><h2>Stage template schedules</h2>
    <p class="lede">Built day by day under the rules: one event per age group and gender per day (two rounds of the same event allowed); 3m and platform never on consecutive days at Nationals, and separated as much as a 3-day meet allows at Regionals and Zones.</p>
    <div class="tabs">${['Regionals','Zones','Junior Nationals'].map(s=>`<button data-stage="${s}" aria-pressed="${s===STAGE}">${s}</button>`).join('')}</div>
    <p class="note" id="schedNote"></p><div class="scroll"><div class="grid" id="grid"></div></div>
    <div class="legend">${['A','B','C','D'].map(g=>`<span><i style="background:${HEX[g]}"></i>Group ${g}</span>`).join('')}<span><i style="background:#fff;border:1.5px dashed #9aa3c7"></i>Junior Nationals Open</span></div>
  </section>
  <section class="card"><h2>2027 season placeholders</h2>
    <p class="lede">Stop 1 and Stop 2 each run over two weekends, per the Season Calendar (updated Sep 21). The Junior Nationals window is confirmed by Mission Viejo (Jul 26–Aug 8). Zones end four weeks before Nationals training begins.</p>
    <div class="scroll">${calendarSVG()}</div></section>
  <section class="card"><h2>What if?</h2>
    <p class="lede">Adjust the rules and the projection recomputes live, using the same engine and measured rates as the figures above. The defaults reproduce the published figures exactly; other settings are estimates within about 1–2% of the full athlete-level model.</p>
    <div class="ctrl">
      ${slider('p1','Regionals → Zones share',40,80,Math.round(m.engine.p1*100),'%')}
      ${slider('p2','Zones → Nationals share',35,75,Math.round(m.engine.p2*100),'%')}
      ${slider('dir','Direct semifinal seats per Zone (A/B)',1,3,m.engine.direct,'')}
      ${slider('csb','Prelim limit — springboard (before Open spots)',40,48,m.engine.capSB,'')}
      ${slider('cpl','Prelim limit — platform (before Open spots)',28,36,m.engine.capPL,'')}
    </div>
    <div class="kpis" id="whatif"></div></section>
  <section class="card"><h2>How it compares</h2><div class="scroll">${compareTable()}</div></section>
  <section class="card"><h2>The rules, stop by stop</h2><div class="scroll">${rulesTable(m)}</div></section>
  <section class="card"><h2>Frequently asked questions</h2>${faq()}</section>
  <section class="card"><h2>Method &amp; validation</h2>${method()}</section>`;
  $('#foot').textContent='Generated '+DATA.generated+' · Boundary Studio counter-proposal report · Draft for committee discussion; not a published rule.';
  drawReach(null);
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{STAGE=b.dataset.stage;
    document.querySelectorAll('[data-stage]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawGrid();});
  drawGrid();
  ['p1','p2','dir','csb','cpl'].forEach(id=>$('#'+id).oninput=whatIf); whatIf();
}

/* ---------- pathway diagram ---------- */
function pathwaySVG(m){
  const t=m.totals,W=1100,H=470,k=v=>Math.max(2,v/40);
  const node=(x,y,w,h,title,sub,fill)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}"/>
    <text x="${x+w/2}" y="${y+h/2-6}" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">${esc(title)}</text>
    <text x="${x+w/2}" y="${y+h/2+14}" text-anchor="middle" fill="#fff" opacity=".85" font-size="12">${esc(sub)}</text></g>`;
  const flow=(x1,y1,x2,y2,v,color,label,dash)=>{const mx=(x1+x2)/2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="${k(v)}" ${dash?'stroke-dasharray="7 6"':''}/>
    <text x="${mx}" y="${(y1+y2)/2-k(v)/2-5}" text-anchor="middle" font-size="11.5" fill="#141a3c" font-weight="600">${label}</text>`;};
  const plat=t.stop2-Math.round(t.advanced*DATA.models[MODEL].engine.take12);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:900px" role="img" aria-label="Qualification pathway diagram">
  ${flow(190,170,420,150,t.advanced,HEX.A,fmt(t.advanced)+' advance · 65% of each springboard event (+ score threshold)')}
  ${flow(190,280,420,250,plat,'#9aa3c7','Platform: open entry at Zones ('+fmt(plat)+')')}
  ${flow(610,150,820,70,t.abDirect,HEX.A,'A/B · Zone final places 1–2 + prequalified/HPS → '+fmt(t.abDirect))}
  ${flow(610,200,820,175,t.abPrelims-t.openSpots,HEX.A,'A/B · 55% share → prelims ('+fmt(t.abPrelims-t.openSpots)+')')}
  ${flow(610,260,820,330,t.cdPrelims,HEX.C,'C/D · 55% share → prelims ('+fmt(t.cdPrelims)+')')}
  ${flow(600,420,820,205,t.openSpots*8,'#9aa3c7','Junior Nationals Open (~'+t.openEntries+' entries) · top 2 per event → prelims ('+t.openSpots+')',true)}
  ${node(20,130,170,190,m.meets.Regionals+' Regionals',fmt(t.stop1)+' entries · Groups A–D','#1e2d8a')}
  ${node(420,120,190,180,m.meets.Zones+' Zones',fmt(t.stop2)+' entries','#009ac7')}
  ${node(420,395,180,50,'Nationals Open','qualifiers only · days 1–5','#7d86ad')}
  <g transform="translate(820,30)">
    <rect width="265" height="410" rx="14" fill="#0d1040"/>
    <text x="132" y="28" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">Junior Nationals</text>
    <text x="132" y="46" text-anchor="middle" fill="#a8d4f0" font-size="11.5">${fmt(t.nats)} qualifiers + Open-earned spots</text>
    <rect x="14" y="62" width="237" height="42" rx="8" fill="#171f69"/><text x="26" y="80" fill="#fff" font-size="12" font-weight="700">A/B SEMIFINAL · 36 sb / 24 plat</text><text x="26" y="96" fill="#a8d4f0" font-size="11">direct seats + top prelim finishers</text>
    <rect x="14" y="140" width="237" height="42" rx="8" fill="#171f69"/><text x="26" y="158" fill="#fff" font-size="12" font-weight="700">A/B PRELIMS · ≤50 sb / ≤38 plat</text><text x="26" y="174" fill="#a8d4f0" font-size="11">incl. 2 Open spots · YMCA champions</text>
    <path d="M132,140 L132,106" stroke="#a8d4f0" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="14" y="222" width="237" height="42" rx="8" fill="#1e2d8a"/><text x="26" y="240" fill="#fff" font-size="12" font-weight="700">A/B FINAL · 12 U.S. (+≤4)</text><text x="26" y="256" fill="#a8d4f0" font-size="11">semifinal scores carry forward</text>
    <path d="M60,104 C0,150 0,200 40,222" stroke="#a8d4f0" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <rect x="14" y="300" width="237" height="42" rx="8" fill="#5a3fa6"/><text x="26" y="318" fill="#fff" font-size="12" font-weight="700">C/D PRELIMS · ≤50 sb / ≤38 plat</text><text x="26" y="334" fill="#e3dbff" font-size="11">all finished by Day 4</text>
    <rect x="14" y="356" width="237" height="36" rx="8" fill="#7c5cc4"/><text x="26" y="378" fill="#fff" font-size="12" font-weight="700">C/D FINAL · 12 U.S. (+≤4)</text>
    <path d="M132,342 L132,356" stroke="#e3dbff" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a8d4f0"/></marker></defs>
  </svg>`;
}
function journey(){
  const step=(t,s,c)=>`<div style="flex:1;min-width:150px;background:${c};color:#fff;border-radius:10px;padding:10px 12px"><b style="font:800 15px 'Barlow Condensed'">${t}</b><div style="font-size:12px;opacity:.9">${s}</div></div>`;
  const arrow='<div style="align-self:center;color:#9aa3c7;font-size:20px">→</div>';
  return `<div style="display:grid;gap:12px">
  <div><div class="note" style="font-weight:700;color:var(--navy);margin-bottom:6px">Groups A &amp; B (14–18)</div><div style="display:flex;gap:8px;flex-wrap:wrap">
   ${step('Regionals','1m &amp; 3m qualify (one list) · platform non-qualifying ($45)',HEX.A)}${arrow}
   ${step('Zones','Prelims + final, same day · platform open entry','#1e2d8a')}${arrow}
   ${step('Junior Nationals','Prelims → semifinal (next day) → final','#0d1040')}</div></div>
  <div><div class="note" style="font-weight:700;color:#5a3fa6;margin-bottom:6px">Groups C &amp; D (13 and under)</div><div style="display:flex;gap:8px;flex-wrap:wrap">
   ${step('Regionals','Required · all events one list',HEX.C)}${arrow}
   ${step('Zones','One list per event','#6a4bb8')}${arrow}
   ${step('Junior Nationals','Prelims + final, same day · done by Day 4','#5a3fa6')}</div></div>
  <div><div class="note" style="font-weight:700;color:var(--muted);margin-bottom:6px">Qualified in one event but not another?</div><div style="display:flex;gap:8px;flex-wrap:wrap">
   ${step('Junior Nationals Open','Senior-length list (5 W / 6 M) in an event you did not qualify for','#7d86ad')}${arrow}
   ${step('Top 2 per Open event','Earn a spot in that event\u2019s prelims','#5b6385')}</div></div></div>`;
}
function drawReach(override){
  const m=DATA.models[MODEL],B=DATA.baselines,R=override||m.reach;
  $('#reach').innerHTML=GROUPS.map(g=>{
    const bar=(v,c)=>`<div class="track" style="height:10px;margin:2px 0"><div class="fill" style="width:${Math.min(100,v*100/60)}%;background:${c}"></div></div>`;
    return `<div class="row"><div><b>${g}</b><div class="note">${B.eligible[g]} eligible</div></div>
      <div>${bar(B.reach2025[g],'#c3c9e0')}${bar(B.reach2026[g],'var(--sky)')}${bar(R[g],'var(--navy)')}</div>
      <div style="text-align:right;font-weight:800;color:var(--navy)">${R[g].toFixed(0)}%<div class="note" style="font-weight:400">was ${B.reach2025[g].toFixed(0)}%</div></div></div>`;}).join('');
}
function sizeBars(list,c){const mx=Math.max(...list.map(x=>x.entries));
  return list.map(x=>`<div class="row"><div>${esc(x.name)}</div><div class="track"><div class="fill" style="width:${100*x.entries/mx}%;background:${c}"></div></div><div class="n" style="text-align:right;font-weight:700">${x.entries}</div></div>`).join('');}
function eventTable(m){
  const cap=(v,lim)=>`<div style="display:flex;align-items:center;gap:6px"><div class="track" style="width:70px;height:8px;background:#eef0f7;border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.min(100,100*v/lim)}%;background:${v>=lim?'#e31937':'#009ac7'}"></div></div><span>${v}</span></div>`;
  return `<table><thead><tr><th>Event</th><th class="n">Regionals</th><th class="n">Zones</th><th>Prelims (vs limit)</th><th class="n">Direct to semi</th><th class="n">Semifinal</th><th class="n">Final</th></tr></thead><tbody>
  ${m.events.map(e=>`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${HEX[e.group[0]]};margin-right:6px"></span>${esc(e.ev)}</td>
   <td class="n">${e.stop1}</td><td class="n">${e.stop2}</td><td>${cap(e.prelimShown,e.board==='Platform'?38:50)}</td>
   <td class="n">${e.ab?e.direct:'—'}</td><td class="n">${e.ab?e.semi:'—'}</td><td class="n">12 U.S.</td></tr>`).join('')}</tbody></table>
   <p class="note">Red bars are events filled to the limit; declines roll down so they stay full. Direct-to-semi = 2 per Zone plus prequalified/HPS athletes.</p>`;
}
function drawGrid(){
  const m=DATA.models[MODEL],days=m.schedules[STAGE];$('#schedNote').textContent=m.scheduleNotes[STAGE];
  const lanes=['1-Meter','3-Meter','Platform'];
  let h='<div class="h">Day</div>'+lanes.map(l=>`<div class="h">${l}</div>`).join('');
  days.forEach(d=>{
    const dt=new Date(d.date+'T12:00:00');
    h+=`<div class="d"><b>Day ${d.day}</b>${dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}<div class="note">ends ~${d.ends}</div></div>`;
    lanes.forEach(l=>{const evs=d.events.filter(e=>e.lane===l);
      h+=`<div class="cell">${evs.map(e=>{const g=e.group[0],open=e.round==='Open';
        return `<div class="chip${open?' ghost':''}" style="background:${HEX[g]}">${esc(e.group)} · ${esc(open?'OPEN':e.round)}<small>${e.divers} divers</small></div>`;}).join('')}</div>`;});
  });
  $('#grid').innerHTML=h;
}
function calendarSVG(){
  const s=new Date('2027-04-01T00:00:00'),e=new Date('2027-08-16T00:00:00'),W=1100,L=250,span=(e-s)/864e5,x=d=>L+(new Date(d+'T00:00:00')-s)/864e5/span*(W-L-10);
  const C={regional:'#1e2d8a',zone:'#009ac7',natwin:'#a8d4f0',nat:'#e31937',other:'#c3c9e0'};
  let y=34,rows='';
  DATA.calendar.forEach(c=>{const x1=x(c.start),x2=Math.max(x(c.end)+4,x1+4);
    rows+=`<text x="${L-8}" y="${y+11}" text-anchor="end" font-size="11.5" fill="#141a3c">${esc(c.label)}</text><rect x="${x1}" y="${y}" width="${x2-x1}" height="14" rx="4" fill="${C[c.kind]}"/>`;y+=22;});
  let ticks='';for(let d=new Date(s);d<e;d.setDate(d.getDate()+1)){if(d.getDate()===1){const xx=x(d.toISOString().slice(0,10));
    ticks+=`<line x1="${xx}" x2="${xx}" y1="18" y2="${y}" stroke="#dde1ee"/><text x="${xx+4}" y="14" font-size="11.5" font-weight="700" fill="#5b6385">${d.toLocaleDateString('en-US',{month:'long'})}</text>`;}}
  return `<svg viewBox="0 0 ${W} ${y+6}" width="100%" style="min-width:880px" role="img" aria-label="2027 calendar">${ticks}${rows}</svg>`;
}
function slider(id,label,min,max,val,unit){return `<div><label for="${id}">${label}<span id="${id}v">${val}${unit}</span></label><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" data-unit="${unit}"></div>`;}
function whatIf(){
  const m=DATA.models[MODEL],B=DATA.baselines;['p1','p2','dir','csb','cpl'].forEach(id=>$('#'+id+'v').textContent=$('#'+id).value+$('#'+id).dataset.unit);
  const r=CPEngine.project(m.engine,{p1:$('#p1').value/100,p2:$('#p2').value/100,direct:+$('#dir').value,capSB:+$('#csb').value,capPL:+$('#cpl').value});
  const rch=res=>{const grp={};for(const k in res.events){const g=k.split(' ').slice(1,3).join(' ');grp[g]=(grp[g]||0)+res.events[k].direct+res.events[k].prelim;}
    const o={};GROUPS.forEach(g=>o[g]=100*(grp[g]||0)/B.eventsPerAthlete[g]/B.eligible[g]);return o;};
  if(!m._rcal){const d=rch(CPEngine.project(m.engine,{}));m._rcal={};GROUPS.forEach(g=>m._rcal[g]=m.reach[g]/d[g]);}
  const raw=rch(r),reach={};GROUPS.forEach(g=>reach[g]=raw[g]*m._rcal[g]);
  const capped=Object.values(r.events).filter(e=>e.capped).length;
  $('#whatif').innerHTML=`<div class="kpi"><b>${fmt(r.stop2)}</b><span>Zone entries</span></div>
    <div class="kpi"><b>${fmt(r.nats)}</b><span>Nationals qualifiers (+24 Open spots)</span></div>
    <div class="kpi"><b>${Math.min(...Object.values(reach)).toFixed(0)}–${Math.max(...Object.values(reach)).toFixed(0)}%</b><span>reach range across groups</span></div>
    <div class="kpi"><b>${capped} of 24</b><span>events at their prelim limit</span></div>`;
  drawReach(reach);
}
function compareTable(){return `<table><thead><tr><th>System</th><th class="n">Junior Nationals entries</th><th>Second stop</th><th>Notes</th></tr></thead><tbody>
  ${DATA.comparison.map(c=>`<tr${c.name.includes(MODEL.replace(/-/g,'→'))?' style="background:#eef6fb;font-weight:600"':''}><td>${esc(c.name)}</td><td class="n">${fmt(c.nats)}</td><td>${esc(c.stop2)}</td><td class="note">${esc(c.note)}</td></tr>`).join('')}</tbody></table>
  <p class="note">2025 and 2026 are actual paid entries; the proposals are projections on the same 2026 athlete base. The counter-proposal lands inside the 900–1,000 target while holding every round within its limit.</p>`;}
function rulesTable(m){return `<table><thead><tr><th>Stop</th><th>Who</th><th>Format</th><th>How athletes advance</th></tr></thead><tbody>
<tr><td><b>Regionals</b><br><span class="note">${m.meets.Regionals} meets · 2 weekends (May 13–16, 20–23)</span></td><td>Groups A–D required. Region of choice (current rule retained).</td><td>One list per event; one event per group per day. Platform, synchro, mixed team non-qualifying ($45). Host-optional Open events.</td><td>65% of eligible entries in each springboard event, count published at the entry deadline (half rounds up; fields of 3 or fewer all advance; ties at the cut advance). Plus anyone at or above the cross-meet average last-qualifying score. Late entries/scratches do not change the count.</td></tr>
<tr><td><b>Zones</b><br><span class="note">${m.meets.Zones} meets · 2 weekends (Jun 17–20, 24–27)</span></td><td>Regional qualifiers; platform open entry (Art. 305 retained).</td><td>A/B: prelims + final (12) the same day. C/D: one list. No springboard event over 50. Host-optional Zone Open events.</td><td>A/B: final places 1–2 → Nationals semifinal; the rest of the Zone's 55% share → Nationals prelims. C/D: 55% share → Nationals prelims. Capped events split spots across Zones in proportion to field size.</td></tr>
<tr><td><b>Junior Nationals</b><br><span class="note">Mission Viejo · 8 days</span></td><td>Zone qualifiers; prequalified/HPS (→ semifinal); YMCA champions (1 per event/gender → prelims); Open winners (2 per event → prelims).</td><td>A/B: prelims (≤50/≤38) → semifinal next day (36 split / 24) → final (12 U.S. + ≤2 foreign + ≤2 dual; scores carry forward). C/D: prelims + final same day, done by Day 4. Junior synchro 14–18 finals only.</td><td>Non-displacing athletes (foreign, dual declared for another country) advance through finals without taking a U.S. spot but count toward round limits. Declines roll down to the next eligible U.S. athlete until the next athlete is below the cross-Zone threshold or the decline deadline passes.</td></tr>
</tbody></table>`;}
function faq(){const Q=[
['How do I qualify from Regionals to Zones?','In each springboard event at each Regional, 65% of eligible entries advance. Groups A–D must compete at Regionals. Platform, synchro and mixed team are non-qualifying at Regionals.'],
['When will I know how many advance from my event?','The count is set at the entry deadline and published immediately. Late entries, scratches and no-shows do not change it.'],
['Can I still choose my Region?','Yes — the current rule stays. Because every Regional advances the same share of its field, choosing a smaller meet does not improve your odds. Your Zone is determined by the Regional you enter.'],
['What if my event is small, or there is a tie at the cutoff?','Everyone in an event of 3 or fewer advances. Everyone tied at the cutoff advances.'],
['Is there another way to qualify if my meet was unusually strong?','Yes. Anyone scoring at or above the average last-qualifying score for that event across all meets also advances.'],
['How do I qualify for Nationals from Zones?','Groups A/B: the top 2 in each Zone final go straight to the Nationals semifinal; the rest of that Zone\u2019s share goes to Nationals prelims. Groups C/D: a share of each Zone event goes to Nationals prelims. Round limits: prelims 50 springboard / 38 platform; semifinals 36 springboard / 24 platform.'],
['What if I qualify but cannot attend?','Your spot passes to the next eligible U.S. athlete from your Zone. Roll-down stops when the next athlete\u2019s score is below that event\u2019s cross-Zone qualifying threshold, or at the published decline deadline. Declining one event does not affect your other events.','Decline deadline date'],
['Can foreign athletes compete?','Yes. They can advance through every stop, including finals, but never take a U.S. athlete\u2019s spot. They count toward round limits. Finals are the top 12 U.S. divers plus at most 2 foreign athletes.'],
['How are dual citizens treated?','Declared for another country: treated like a foreign athlete. Declared for the U.S.: a U.S. athlete. Finals include at most 2 dual citizens declared for another country.','Full dual-citizen wording'],
['What about prequalified, HPS and YMCA athletes?','Prequalified and HPS athletes in Groups A/B go directly to the Nationals semifinal, within its limit. YMCA champions go directly to Nationals prelims, one per event per gender, within the prelim limit.'],
['What is the Junior Nationals Open?','A non-qualifying event in the first days of Nationals with a senior-length list (5 dives women, 6 men), for athletes who qualified for Nationals in at least one event, in an event they did not qualify for. The top 2 in each Open event earn a spot in that event\u2019s prelims.'],
['How do junior synchro and mixed team work?','Both are non-qualifying events at Regionals and Zones. At Nationals, junior synchro (14–18) is finals only, and both partners must have qualified for Nationals in at least one individual event.'],
['What about platform?','Non-qualifying at Regionals ($45). Entry at Zones stays open, as today. Qualification to Nationals comes from Zones.'],
['Why can\u2019t more Group A girls qualify?','About 443 Group A girls are eligible and there are three events, each with a round limit that keeps the meet workable. Their odds still rise from about 17% to about 20–22%.'],
['Why do Group C/D athletes leave Nationals early?','Every C/D event and every Open event finishes in the first days, so the pool is free for Group A/B competition and flighted training in the second half — the practice-time and safety problem that started this review.'],
['What about military dependents and Alaska/Hawaii athletes?','The current provisions remain.','Each needs a new landing stop (they previously pointed to E/W/C)']];
return Q.map(q=>`<details><summary>${esc(q[0])}${q[2]?'<span class="tag">POLICY TO WRITE</span>':''}</summary><p>${esc(q[1])}</p>${q[2]?`<p class="note">Open item: ${esc(q[2])}.</p>`:''}</details>`).join('');}
function method(){const c=DATA.checks;return `
<p><b>Data.</b> Real 2026 Regional and Zone results (athlete by athlete, with HPS/foreign/dual flags from the roster file). Groups C/D who dove only Zones in 2026 are placed at their club\u2019s Regional, since they are now required there. Attendance: 96.4% of 2026 Regional qualifiers attended Zones; 83.7% Nationals attendance (2021–2025 measured). No behavior change is assumed.</p>
<p><b>Maps.</b> 12→6→1 uses the published 12-Region map and current Zone pairings. 10→5→1 is a working map that merges Regions 4+9 and 7+8 (Zones: 1+2, 3+6, 5+7/8, 4/9+11, 10+12); totals barely depend on the lines, per-meet sizes do. Final lines will be drawn in Boundary Studio.</p>
<p><b>Schedules.</b> Solved as a scheduling problem at 2025 planning pace (30 s/dive springboard, 36 s platform), with 1m, 3m and platform running concurrently and the Open on the auxiliary 1m boards (Mission Viejo: 4×1m, 2×3m, 5/7.5/10m). Counting Open events toward the 3m/platform rest rule, 8 Nationals days works when Opens may run through Day 5 and one A/B semifinal falls two days after its prelims; a 9-day version keeps every semifinal the next day.</p>
<p><b>Not included.</b> Financials (held internally by the National Office), Zone Open events, and final Region lines.</p>
<table><thead><tr><th>Automated check</th><th>Result</th></tr></thead><tbody>${c.map(x=>`<tr><td>${esc(x.check)}${x.detail?`<div class="note">${esc(x.detail)}</div>`:''}</td><td class="${x.pass?'ok':'bad'}">${x.pass?'Pass':'Fail'}</td></tr>`).join('')}</tbody></table>`;}
