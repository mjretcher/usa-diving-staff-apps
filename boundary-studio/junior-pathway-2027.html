<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 Junior Circuit — Scenario Report · Boundary Studio · USA Diving</title>
<link rel="icon" type="image/svg+xml" href="../shared/images/diver-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--nav:#0a0e38;--navy:#171f69;--blue-900:#0d1040;--blue-600:#1e2d8a;--pool:#009ac7;--sky:#8fc3ea;--red:#e31937;
  --bg:#eaecf5;--surface:#fff;--surface-2:#f6f7fb;--line:#dde1ee;--ink:#141a3c;--muted:#5b6385;
  --gA:#171f69;--gB:#009ac7;--gC:#7c5cc4;--gD:#e3872f;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px;margin:0}
.top{background:var(--nav);color:#d4dcf5;padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:sticky;top:0;z-index:5}
.top a{color:#a8d4f0;text-decoration:none;font-weight:600;font-size:13px}
.top h1{font-size:22px;color:#fff;font-weight:700;margin-right:auto}
.draft{background:var(--red);color:#fff;font:700 11px Inter;padding:3px 8px;border-radius:999px;letter-spacing:.6px}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:#d4dcf5;font:700 13px Inter;padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#a8d4f0;color:var(--nav)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 70px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 2px rgba(10,14,56,.04)}
.card h2{font-size:24px;color:var(--navy);margin-bottom:4px}
.lede{color:var(--muted);margin:0 0 14px;max-width:880px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:800 28px "Barlow Condensed",Inter;color:var(--navy);line-height:1.1}
.kpi span{color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto}
svg text{font-family:Inter,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 13px Inter;padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:110px repeat(3,minmax(200px,1fr));gap:6px;min-width:760px}
.grid .h{font:700 12px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 6px}
.grid .d{background:var(--surface-2);border-radius:8px;padding:8px;font-size:12.5px}
.grid .d b{display:block;font:700 15px "Barlow Condensed";color:var(--navy)}
.cell{background:var(--surface-2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:44px}
.chip{border-radius:7px;padding:5px 8px;color:#fff;font-size:12px;line-height:1.3}
.chip small{opacity:.85;display:block}
.chip.ghost{background:#fff !important;color:var(--ink);border:1.5px dashed #9aa3c7}
.bars .row{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bars .track{background:var(--surface-2);border-radius:6px;height:16px;position:relative;overflow:hidden}
.bars .fill{height:100%;border-radius:6px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:12px}
.ctrl label{font-weight:600;font-size:12.5px;display:flex;justify-content:space-between}
.ctrl input{width:100%}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--surface-2)}
summary{font-weight:700;cursor:pointer;color:var(--navy)}
details p{margin:8px 0 2px}
.tag{display:inline-block;font:700 10.5px Inter;padding:2px 7px;border-radius:999px;background:#fdecef;color:var(--red);margin-left:6px;vertical-align:1px}
.ok{color:#15803d;font-weight:700}.bad{color:var(--red);font-weight:700}
.note{font-size:12.5px;color:var(--muted)}
footer{max-width:1180px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:12px}
@media print{.top{position:static}.seg,.tabs,.ctrl{display:none}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
.tbl-scen th:not(:first-child),.tbl-scen td:not(:first-child){text-align:right}
.pill{display:inline-block;font:700 10.5px Inter;padding:2px 8px;border-radius:999px;background:#eef1fa;color:var(--navy);margin-left:6px}
.pill.sub{background:#fff4e6;color:#9a5b12}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">&larr; Boundary Studio</a>
  <h1>2027 Junior Circuit — Scenario Report <span class="draft">DRAFT · FOR CCE/CAC DISCUSSION</span></h1>
  <div class="seg" role="group" aria-label="Proportional qualification scenario">
    <button data-model="bs-pathway27-12-6-1" aria-pressed="true">12-6-1 PQ</button>
    <button data-model="bs-pathway27-10-5-1" aria-pressed="false">10-5-1 PQ</button>
  </div>
</header>
<main id="app"><div class="card">Loading…</div></main>
<footer id="foot"></footer>
<script>
'use strict';
const HEX={A:'#171f69',B:'#009ac7',C:'#7c5cc4',D:'#e3872f'};
const GROUPS=['A Girls','A Boys','B Girls','B Boys','C Girls','C Boys','D Girls','D Boys'];
const SC_COL=['#171f69','#009ac7','#b45309','#7c3aed'];
let DATA,SID='bs-pathway27-12-6-1',STAGE='Junior Nationals';
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const usd=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('junior-pathway-2027-data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render();})
  .catch(e=>{$('#app').innerHTML='<div class="card">Could not load junior-pathway-2027-data.json: '+esc(e.message)+'</div>';});
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{SID=b.dataset.model;
  document.querySelectorAll('[data-model]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
const S=()=>DATA.scenarios.find(s=>s.id===SID);
const range=(arr)=>arr.length?`${fmt(Math.min(...arr))}–${fmt(Math.max(...arr))}`:'—';
const stopSizes=(s,i)=>{const t=s.tiers[i];return range(s.meets.filter(m=>m.tier===t.level).map(m=>m.entries));};
const reachRange=s=>{const v=Object.values(s.reach);return v.length?`${Math.min(...v).toFixed(0)}–${Math.max(...v).toFixed(0)}%`:'—';};

function render(){
  const s=S(),f=s.flow;
  $('#app').innerHTML=`
  <section class="card">
    <h2>Four scenarios under review</h2>
    <p class="lede">The CCE Submission, the USA Diving National Office Submission, and two proportional-qualification scenarios built new in Boundary Studio. Every figure is a projection from real 2026 entries, run through Boundary Studio's own engine on the same basis: entry fees only, $25 per entry to hosts, DiveMeets fees passed through. None of this changes any stored scenario or any real competition data.</p>
    <div class="scroll">${glance()}</div>
    <div style="margin-top:14px;border:1px solid var(--line);border-left:4px solid var(--pool);border-radius:10px;padding:12px 16px;background:var(--surface-2)">
      <b style="color:var(--navy)">Assumptions behind every figure</b>
      <ul style="margin:6px 0 0 18px;padding:0">${DATA.assumptions.map(a=>`<li style="margin:3px 0">${esc(a)}</li>`).join('')}</ul></div>
    <p class="note">${DATA.scenarios.find(x=>x.id==='bs-msix7ibe-nij21').atStandardFees?`The National Office Submission is stored with its own fees ($90 first stop, $135 Junior Nationals). At the published 2026 fee card it projects ${usd(DATA.scenarios.find(x=>x.id==='bs-msix7ibe-nij21').atStandardFees.grossEntryIncome)} gross and ${usd(DATA.scenarios.find(x=>x.id==='bs-msix7ibe-nij21').atStandardFees.usaDivingKeeps)} to USA Diving.`:''}</p>
  </section>
  <section class="card"><h2>Entry revenue by stop</h2>
    <p class="lede">Where each scenario's entry income goes: DiveMeets fees, host share, and USA Diving's share. No expenses are modeled, matching every other Boundary Studio scenario.</p>
    ${revenueBars()}
    <div class="legend"><span><i style="background:#9aa3c7"></i>DiveMeets fees</span><span><i style="background:#009ac7"></i>To hosts</span><span><i style="background:#171f69"></i>USA Diving keeps</span></div>
    ${firstStopNote(s)}
  </section>
  <section class="card"><h2>Membership sensitivity</h2>
    <p class="lede">Competition membership has been declining. Every scenario re-projected through Boundary Studio's engine with 5% and 10% fewer participants at every stop.</p>
    <div class="scroll">${sensTable()}</div>
    <p class="note">Proportional qualification shrinks with participation at every stop, so the qualifying bar stays steady and the Junior Nationals field adjusts. Fixed "top N" places send nearly the same number to the final stop from a smaller field, which keeps its size but lowers the bar. The first stop falls slightly less than the nominal cut in all four scenarios because entries are counted in whole divers per event per meet.</p>
  </section>
  <section class="card"><h2>Who reaches Junior Nationals</h2>
    <p class="lede">Unique athletes at Junior Nationals as a share of eligible 2026 competition members in each age group and gender.</p>
    <div class="bars" id="reach"></div>
    <div class="legend">${DATA.scenarios.map((x,i)=>`<span><i style="background:${SC_COL[i]}"></i>${esc(x.label)}</span>`).join('')}<span><i style="background:#c3c9e0"></i>2025 rules (reference)</span></div>
  </section>
  <section class="card"><h2>${esc(s.label)} — qualification pathway</h2>
    <p class="lede">Line widths are proportional to entries. Solid paths qualify; the dashed path is the Junior Nationals Open. Counts are Boundary Studio's projection.</p>
    <div class="scroll">${pathwaySVG(s)}</div>
    <div class="legend"><span><i style="background:${HEX.A}"></i>Groups A/B</span><span><i style="background:${HEX.C}"></i>Groups C/D</span><span><i style="background:#c3c9e0"></i>Platform open entry / Open</span></div>
  </section>
  <section class="card"><h2>Every athlete's journey (proportional scenarios)</h2>${journey()}</section>
  <section class="two">
    <div class="card"><h2>${esc(s.tiers[0].level)} sizes</h2><p class="lede">Entries per first-stop meet (${esc(s.label)}).</p><div class="bars">${sizeBars(s,0,'#1e2d8a')}</div></div>
    <div class="card"><h2>${esc(s.tiers[1].level)} sizes</h2><p class="lede">Entries per second-stop meet, platform open entry included.</p><div class="bars">${sizeBars(s,1,'#009ac7')}</div></div>
  </section>
  <section class="card"><h2>${esc(s.label)} — revenue by meet</h2><div class="scroll">${meetTable(s)}</div></section>
  <section class="card"><h2>${esc(s.label)} — Junior Nationals round sizes</h2>
    <p class="lede">Prelims include 2 Open-earned spots per A/B event. Limits: prelims 50 springboard (25 per board) / 38 platform; semifinals fill to 36 springboard (split) / 24 platform; finals 12 U.S. + up to 2 foreign + 2 dual.</p>
    <div class="scroll">${eventTable(s)}</div></section>
  <section class="card"><h2>${esc(s.label)} — stage template schedules</h2>
    <p class="lede">One event per age group and gender per day (two rounds of the same event allowed); 3m and platform never on consecutive days at Nationals, and separated as much as a 3-day meet allows at Regionals and Zones. Field sizes are Boundary Studio's projection for the largest meet at each stop.</p>
    <div class="tabs">${['Regionals','Zones','Junior Nationals'].map(x=>`<button data-stage="${x}" aria-pressed="${x===STAGE}">${x}</button>`).join('')}</div>
    <p class="note" id="schedNote"></p><div class="scroll"><div class="grid" id="grid"></div></div>
    <div class="legend">${['A','B','C','D'].map(g=>`<span><i style="background:${HEX[g]}"></i>Group ${g}</span>`).join('')}<span><i style="background:#fff;border:1.5px dashed #9aa3c7"></i>Junior Nationals Open</span></div>
  </section>
  <section class="card"><h2>2027 season placeholders</h2>
    <p class="lede">Stop 1 and Stop 2 each run over two weekends, per the Season Calendar (updated Sep 21). The Junior Nationals window is confirmed by Mission Viejo (Jul 26–Aug 8).</p>
    <div class="scroll">${calendarSVG()}</div></section>
  <section class="card"><h2>Proportional qualification — the rules, stop by stop</h2><div class="scroll">${rulesTable(s)}</div></section>
  <section class="card"><h2>Rulebook changes the proportional scenarios would require</h2><div class="scroll">${ruleChanges()}</div></section>
  <section class="card"><h2>Frequently asked questions (proportional scenarios)</h2>${faq()}</section>
  <section class="card"><h2>Method &amp; validation</h2>${method()}</section>`;
  $('#foot').textContent='Generated '+DATA.generated+' · '+DATA.engine+' · Draft scenarios for committee discussion; not a published rule.';
  drawReach();
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{STAGE=b.dataset.stage;document.querySelectorAll('[data-stage]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawGrid();});
  drawGrid();
}
function firstStopNote(s){
  const sub=DATA.scenarios.find(x=>x.kind==='sub'), g90=s.firstStopAt90, gSub=sub.tiers[0].gross, gPQ=s.tiers[0].gross, eDiff=sub.tiers[0].entries-s.tiers[0].entries;
  return `<p class="note" style="margin-top:10px"><b>Reading the first stop:</b> the 9-Zone submissions count ${fmt(sub.tiers[0].entries)} first-stop entries, platform included (platform qualifies there), priced as Zones at $90 each: ${usd(gSub)}. The proportional scenarios count ${fmt(s.tiers[0].entries)}: platform is non-qualifying at Regionals, so only real 2026 Regionals platform entries are counted. They price the stop as Regionals ($85 for A/B springboard; $45 for Groups C/D and platform, including the proposed reduced C/D fee): ${usd(gPQ)}. Of the ${usd(gSub-gPQ)} difference, ${usd(gSub-g90)} is the ${fmt(eDiff)} fewer platform entries and ${usd(g90-gPQ)} is the fee card.</p>`;}
function sensTable(){
  const sc=DATA.scenarios,SE=DATA.sensitivity;
  const cell=(s,k)=>{if(k==='1.00'){const t=s.tiers;return {n:t[t.length-1].entries,g:s.gross,u:s.usad,f:t[0].entries};}const x=SE[k][s.id];return {n:x.entries[x.entries.length-1],g:x.gross,u:x.usad,f:x.entries[0]};};
  return `<table class="tbl-scen"><thead><tr><th>Scenario</th><th>Participation</th><th>First stop</th><th>Junior Nationals</th><th>Gross</th><th>USA Diving keeps</th></tr></thead><tbody>
  ${sc.map((s,i)=>['1.00','0.95','0.90'].map((k,j)=>{const c=cell(s,k),b=cell(s,'1.00');
    return `<tr${j===0?' style="border-top:2px solid var(--line)"':''}><td>${j===0?`<b style="color:${SC_COL[i]}">${esc(s.label)}</b>`:''}</td><td style="text-align:left">${k==='1.00'?'2026 level':k==='0.95'?'−5%':'−10%'}</td>
      <td>${fmt(c.f)}</td><td>${fmt(c.n)}${j?` <span class="note">(${(100*(c.n/b.n-1)).toFixed(1)}%)</span>`:''}</td><td>${usd(c.g)}</td><td>${usd(c.u)}${j?` <span class="note">(${usd(c.u-b.u)})</span>`:''}</td></tr>`;}).join('')).join('')}</tbody></table>`;}
function glance(){
  const sc=DATA.scenarios,R=DATA.references;
  const row=(lab,fn,cls='')=>`<tr${cls}><td>${lab}</td>${sc.map(fn).join('')}${R.map(r=>`<td class="note">${r._cell?r._cell(lab):''}</td>`).join('')}</tr>`;
  return `<table class="tbl-scen"><thead><tr><th>Projected</th>${sc.map((s,i)=>`<th><span style="color:${SC_COL[i]}">${esc(s.label)}</span><span class="pill ${s.kind==='sub'?'sub':''}">${s.kind==='sub'?'submission':'new scenario'}</span></th>`).join('')}</tr></thead><tbody>
   <tr><td>Structure</td>${sc.map(s=>`<td>${s.tiers.map(t=>t.meets).join(' → ')}</td>`).join('')}</tr>
   <tr><td>Stops</td>${sc.map(s=>`<td class="note">${s.tiers.map(t=>esc(t.level)).join(' → ')}</td>`).join('')}</tr>
   <tr><td>First-stop meet size</td>${sc.map(s=>`<td>${stopSizes(s,0)}</td>`).join('')}</tr>
   <tr><td>Second-stop meet size</td>${sc.map(s=>`<td>${stopSizes(s,1)}</td>`).join('')}</tr>
   <tr><td><b>Junior Nationals entries</b></td>${sc.map(s=>`<td><b>${fmt(s.tiers[s.tiers.length-1].entries)}</b></td>`).join('')}</tr>
   <tr><td>Reach, by age group &amp; gender</td>${sc.map(s=>`<td>${reachRange(s)}</td>`).join('')}</tr>
   <tr><td>Gross entry income</td>${sc.map(s=>`<td>${usd(s.gross)}</td>`).join('')}</tr>
   <tr><td>DiveMeets fees</td>${sc.map(s=>`<td>${usd(s.dm)}</td>`).join('')}</tr>
   <tr><td>To hosts</td>${sc.map(s=>`<td>${usd(s.hosts)}</td>`).join('')}</tr>
   <tr><td><b>USA Diving keeps</b></td>${sc.map(s=>`<td><b>${usd(s.usad)}</b></td>`).join('')}</tr>
  </tbody></table>
  <p class="note" style="margin-top:8px">For reference: ${R.map(r=>`<b>${esc(r.label)}</b> — ${r.tiers.map(t=>fmt(t.entries)).join(' → ')} entries, Junior Nationals ${fmt(r.tiers[r.tiers.length-1].entries)}, ${usd(r.gross)} gross, ${usd(r.usad)} kept (${esc(r.basis)})`).join('; ')}.</p>`;
}
function revenueBars(){
  const sc=DATA.scenarios,mx=Math.max(...sc.map(s=>Math.max(...s.tiers.map(t=>t.gross))));
  return sc.map((s,i)=>`<div style="margin:12px 0 4px;font-weight:700;color:${SC_COL[i]}">${esc(s.label)} <span class="note" style="font-weight:400">· ${usd(s.gross)} gross · ${usd(s.usad)} to USA Diving</span></div>`+
    s.tiers.map(t=>`<div class="bars"><div class="row" style="grid-template-columns:170px 1fr 90px"><div>${esc(t.level)} <span class="note">(${t.meets} ${t.meets===1?'meet':'meets'}, ${fmt(t.entries)})</span></div>
      <div class="stack" style="width:${100*t.gross/mx}%" title="DiveMeets ${usd(t.dm)} · hosts ${usd(t.hosts)} · USA Diving ${usd(t.usad)}">
        <span style="width:${100*t.dm/t.gross}%;background:#9aa3c7"></span><span style="width:${100*t.hosts/t.gross}%;background:#009ac7"></span><span style="width:${100*t.usad/t.gross}%;background:#171f69"></span></div>
      <div style="text-align:right;font-weight:700">${usd(t.gross)}</div></div></div>`).join('')).join('');
}
function drawReach(){
  const sc=DATA.scenarios,ref=DATA.references[0];
  $('#reach').innerHTML=GROUPS.map(g=>{
    const bar=(v,c)=>`<div class="track" style="height:9px;margin:2px 0"><div class="fill" style="width:${Math.min(100,(v||0)*100/60)}%;background:${c}"></div></div>`;
    return `<div class="row" style="grid-template-columns:110px 1fr 150px"><div><b>${g}</b></div>
      <div>${sc.map((s,i)=>bar(s.reach[g],SC_COL[i])).join('')}${bar(ref.reach[g],'#c3c9e0')}</div>
      <div class="note" style="text-align:right">${sc.map(s=>(s.reach[g]||0).toFixed(0)+'%').join(' · ')}<br>2025: ${(ref.reach[g]||0).toFixed(0)}%</div></div>`;}).join('');
}
function sizeBars(s,i,c){const t=s.tiers[i],list=s.meets.filter(m=>m.tier===t.level),mx=Math.max(...list.map(x=>x.entries));
  return list.map(x=>`<div class="row"><div>${esc(x.stop)}</div><div class="track"><div class="fill" style="width:${100*x.entries/mx}%;background:${c}"></div></div><div style="text-align:right;font-weight:700">${fmt(x.entries)}</div></div>`).join('');}
function meetTable(s){return `<table><thead><tr><th>Stop</th><th>Meet</th><th class="n">Entries</th><th class="n">Fee per event</th><th class="n">Gross</th><th class="n">DiveMeets</th><th class="n">To host</th><th class="n">USA Diving</th></tr></thead><tbody>

function faq(){const Q=[
['How do I qualify from Regionals to Zones?','In each springboard event at each Regional, 65% of eligible entries advance. Groups A–D must compete at Regionals. Platform, synchro and mixed team are non-qualifying at Regionals.'],
['When will I know how many advance from my event?','The count is set at the entry deadline and published immediately. Late entries, scratches and no-shows do not change it.'],
['Can I still choose my Region?','Yes — the current rule stays. Because every Regional advances the same share of its field, choosing a smaller meet does not improve your odds. Your Zone is determined by the Regional you enter.'],
['What if my event is small, or there is a tie at the cutoff?','Everyone in an event of 3 or fewer advances. Everyone tied at the cutoff advances.'],
['Is there another way to qualify if my meet was unusually strong?','Yes. Anyone scoring at or above the average last-qualifying score for that event across all meets also advances.'],
['How do I qualify for Nationals from Zones?','Groups A/B: the top 2 in each Zone final go straight to the Nationals semifinal; the rest of that Zone\u2019s share goes to Nationals prelims. Groups C/D: a share of each Zone event goes to Nationals prelims. Round limits: prelims 50 springboard / 38 platform; semifinals 36 springboard / 24 platform.'],
['What if I qualify but cannot attend?','Decline in DiveMeets by the published decline deadline (proposed: 11:59 PM ET seven days after the last meet of that stop). Each declined spot is offered to the next eligible U.S. athlete from the same meet and event, in finishing order, if that athlete scored at or above the event\u2019s cross-meet qualifying threshold. Offers must be accepted within 48 hours; roll-downs end at the next stop\u2019s entry deadline. Declining one event does not affect your other events.','Confirm the decline deadline and 48-hour acceptance window'],
['Can foreign athletes compete?','Proposed (amending Article 102): non-U.S. citizens residing and training in the U.S. and registered with USA Diving may compete at Regionals, Zones and Junior Nationals and advance through every round, but never take a qualifying spot from a U.S. citizen. They count toward round size limits. A final is the top 12 U.S. divers plus the two highest-ranked non-U.S. citizens, if any.','Medals at Junior Nationals (Article 102 currently withholds medals at Region/Zone level)'],
['How are dual citizens treated?','Proposed (junior version of Article 201.5): a dual citizen who has declared sport nationality for another country and competed for it is non-displacing at every stop \u2014 advances without taking a U.S. qualifying spot and counts toward round size limits. A final includes at most the two highest-ranked such athletes beyond the 12 U.S. finalists. Status follows World Aquatics rules for changing sport nationality (currently one year after the change). A dual citizen who has not declared another nationality is a U.S. athlete.'],
['What about prequalified, HPS and YMCA athletes?','Prequalified and HPS athletes in Groups A/B go directly to the Nationals semifinal, within its limit. YMCA champions go directly to Nationals prelims, one per event per gender, within the prelim limit.'],
['What is the Junior Nationals Open?','A non-qualifying event in the first days of Nationals with a senior-length list (5 dives women, 6 men), for athletes who qualified for Nationals in at least one event, in an event they did not qualify for. The top 2 in each Open event earn a spot in that event\u2019s prelims.'],
['How do junior synchro and mixed team work?','Both are non-qualifying events at Regionals and Zones. At Nationals, junior synchro (14–18) is finals only, and both partners must have qualified for Nationals in at least one individual event.'],

<p><b>Engine.</b> Every scenario figure on this page comes from Boundary Studio's own projection and Money calculation (the same code the app and the MCP finance tool use), run on real 2026 entries. The two proportional scenarios use Boundary Studio's native proportional qualification (route share %, round limits with roll-down, fill-to) added for this review; the change was verified to leave every existing scenario's projection exactly as before.</p>
<p><b>Basis.</b> See “Assumptions behind every figure” at the top. For the proportional scenarios, Boundary Studio seeds springboard at the first stop from every event entered at 2026 Regionals or Zones (every age group competes at the first stop), and platform from real 2026 Regionals platform entries; real 2026 Zones platform entries join the second stop by open entry, placed by club county. Entries are counted in whole divers per event per meet. Participation is held at 2026 levels, with a membership sensitivity at −5% and −10%.</p>
<p><b>Maps.</b> 12-6-1 uses the published 12-Region map and current Zone pairings. 10-5-1 is a working map merging Regions 4+9 and 7+8 (Zones 1+2, 3+6, 5+7/8, 4/9+11, 10+12); final lines to be drawn in Boundary Studio.</p>

<p><b>CCE Submission note.</b> Its levels carry explicit “counts as” stages (Zones, E/W/C, Nationals), set by the repository’s level-stage workflow on Sep 24. That is what its projection uses.</p>
