<style>
:root{--navy:#171F69;--ink:#0f1633;--red:#E31937;--pool:#009AC7;--sky:#8FC3EA;--paper:#fff;--bg:#f3f5fa;--line:#dfe3ee;--muted:#5a6480;--soft:#f6f8fc;

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}

h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;margin:0;line-height:1.08;color:var(--navy)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#dbe3f7;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 22px}

.seg-l{font-size:12px;color:#aab6da}
main{max-width:1120px;margin:0 auto;padding:0 18px 60px}
.hero{padding:40px 4px 26px}

.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;margin:14px 0 12px;letter-spacing:-.2px}

@media (max-width:860px){.path{grid-template-columns:1fr}}

.faqgrp{font:700 12px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.open li{margin:6px 0}
details.app{border-top:1px solid var(--line);padding:10px 0}
details.app summary{cursor:pointer;font:700 17px "Barlow Condensed",Inter;color:var(--navy)}
.sx-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:4px 0 16px}
.sx-seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.sx-seg button{background:none;border:0;color:var(--muted);font:700 13px Inter;padding:6px 13px;border-radius:7px;cursor:pointer}
.sx-seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sx-stops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px 0 8px}
@media (max-width:860px){.sx-stops{grid-template-columns:1fr}}
.sx-stop{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft)}
.sx-stop .k{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--pool)}

.sx-two .real em{color:#8a93b0}
h3.sx-h{font-size:21px;margin:26px 0 4px}
td.sub{color:var(--muted);font-size:12.5px}
.mb{display:grid;grid-template-columns:1fr 38px;gap:6px;align-items:center;min-width:120px}
.mb .t{height:7px;background:#eef1f7;border-radius:4px;overflow:hidden}
.mb .f{height:100%;border-radius:4px}
.mb .v{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);text-align:right}
.dpos{color:#1d7a45}.dneg{color:#b4232f}
.sx-pick{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:6px 0 14px;font-size:13px;color:var(--muted)}
.sx-pick select{font:600 13.5px Inter;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.sx-flow{display:grid;grid-template-columns:minmax(0,1.25fr) 26px minmax(0,1fr) 26px minmax(0,1fr);gap:8px;align-items:stretch}
@media (max-width:860px){.sx-flow{grid-template-columns:1fr}.sx-flow .ar{transform:rotate(90deg);justify-self:center}}
.sx-col{display:flex;flex-direction:column;gap:8px}
.sx-col .h{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--pool)}
.sx-box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.sx-box .t{font:700 16px "Barlow Condensed",Inter;color:var(--navy);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sx-box .t span{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted)}
.sx-box .l{font-size:13px;margin:3px 0 0;display:flex;justify-content:space-between;gap:10px}
.sx-box .l b{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--navy)}
.sx-box .l.r b{color:#5a6480}.sx-box .l.r{color:var(--muted)}
.sx-box.hl{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.sx-flow .ar{align-self:center;justify-self:center;font:700 20px Inter;color:var(--navy)}
.sx-say{background:#eef7fc;border-left:4px solid var(--pool);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0 0;font-size:14px;color:#2c3656}
.mx{font-size:12.5px}
.mx th,.mx td{padding:5px 7px;white-space:nowrap}
.mx td:first-child{min-width:150px;position:sticky;left:0;background:#fff;z-index:1}
.mx th:first-child{position:sticky;left:0;z-index:2}
.mx td.n{font-family:"JetBrains Mono",monospace;font-size:12px}
.mx td.n i{font-style:normal;color:#9aa2bb;font-size:11px;margin-left:4px}
.mx td.z{color:#c3c8d6}
.mx tr.gh td{background:var(--soft);font:700 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.mx tr.st td{font-weight:700;color:var(--navy);border-bottom:2px solid var(--line)}
.mx tr.tot td{font-weight:800;color:var(--navy);background:#eef2fa;border-top:2px solid var(--navy)}
.mx th.tt,.mx td.tt{background:#f1f4fb;border-left:2px solid var(--line)}
.mx .up{color:#1d7a45}.mx .dn{color:#b4232f}
.sx-dl{font:700 12.5px Inter;color:var(--navy);background:#e7ecf8;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
footer{max-width:1120px;margin:0 auto;padding:6px 22px 40px;color:var(--muted);font-size:12px}
@media print{.top{position:static}.seg,.seg-l{display:none}body{background:#fff}.card{break-inside:avoid;border-color:#ccd3e2}details.faq{break-inside:avoid}}
</style>

<body>
<header class="top">
  <a href="index.html">&larr; Boundary Studio</a>
  <span class="t">2027 Junior Circuit · Proportional Qualification</span>
  <span class="seg-l">Map layout</span>
  <div class="seg" role="group" aria-label="Map layout">
    <button data-model="bs-pathway27-12-6-1" aria-pressed="true">12 Regions · 6 Zones</button>
    <button data-model="bs-pathway27-10-5-1" aria-pressed="false">10 Regions · 5 Zones</button>
  </div>
</header>
<script src="pq-visuals.js?v=20260929a"></script>
<main id="app"><div class="card">Loading…</div></main>
<footer id="foot"></footer>
<script>
'use strict';
const GROUPS=['A Girls','A Boys','B Girls','B Boys','C Girls','C Boys','D Girls','D Boys'];
const SC_COL={'bs-pathway27-12-6-1':'#171F69','bs-pathway27-10-5-1':'#009AC7','bs-msg2vatz-5q86m':'#b45309','bs-msix7ibe-nij21':'#6b4fbb'};
let DATA,MAPS,SID='bs-pathway27-12-6-1';
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const usd=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tint(hex,t){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,m=c=>Math.round(c+(255-c)*t);return `rgb(${m(r)},${m(g)},${m(b)})`;}

Promise.all([
  fetch('junior-pathway-2027-data.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('report data HTTP '+r.status);return r.json();}),
  fetch('junior-pathway-2027-maps.json?v=202609251230').then(r=>{if(!r.ok)throw new Error('map data HTTP '+r.status);return r.json();}),
  fetch('junior-pathway-2027-visuals.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('visuals data HTTP '+r.status);return r.json();}),
  fetch('junior-pathway-2027-seasons.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('seasons data HTTP '+r.status);return r.json();})
]).then(([d,m,v,se])=>{DATA=d;MAPS=m;VIS=v;SEAS=se;render();})
 .catch(e=>{$('#app').innerHTML='<div class="card">Could not load the report data: '+esc(e.message)+'</div>';});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{SID=b.dataset.model;
  document.querySelectorAll('[data-model]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});

let VIS=null,SEAS=null,SX={yr:'2025',cell:null,zone:null,stop:0,view:'both'};
const scen=id=>DATA.scenarios.find(s=>s.id===id);
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const lastTier=s=>s.tiers[s.tiers.length-1];
const meetsAt=(s,lvl)=>(s.meets||[]).filter(m=>m.tier===lvl);

/* ---------- the idea in one picture ----------
   Real 2026 fields, Group A Girls 1-meter: Region 11 had 20 divers and Region 12
   had 50 (core.event_results, 2026 Regionals, distinct divers). Today: top 15 at
   each. Proportional: 65% of each field, rounded to the nearest diver -- the
   engine's rule, routing.js floor(share x size + 0.5). */
const EX={event:'Group A Girls 1-meter',small:{name:'Region 11',n:20},large:{name:'Region 12',n:50},topN:15,share:0.65};
const adv=n=>Math.min(n,Math.floor(EX.share*n+0.5));
function dots(n,k,x0,y0,cols,col){let s='';for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols);
  s+=`<circle cx="${x0+c*14}" cy="${y0+r*14}" r="5.3" fill="${i<k?col:'#dbe0ea'}"/>`;}return s;}
function explainer(){
  const W=980,H=300,sN=EX.small.n,lN=EX.large.n,t1=Math.min(EX.topN,sN),t2=Math.min(EX.topN,lN),p1=adv(sN),p2=adv(lN);
  const blk=(x,y,title,n,k,col)=>`<text x="${x}" y="${y}" font-size="13.5" font-weight="700" fill="#0f1633">${title}</text>
    <text x="${x}" y="${y+17}" font-size="12" fill="#5a6480">${n} divers in the event</text>
    ${dots(n,k,x+6,y+36,10,col)}
    <text x="${x}" y="${y+128}" font-family="Barlow Condensed,Inter,sans-serif" font-size="34" font-weight="800" fill="${col}">${k}</text>
    <text x="${x+(k>9?46:26)}" y="${y+126}" font-size="12.5" fill="#0f1633"><tspan font-weight="700">advance</tspan> · ${Math.round(k/n*100)}% of the field</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A fixed top ${EX.topN} against the same ${Math.round(EX.share*100)} percent at every meet">
   <rect x="0" y="0" width="${W/2-8}" height="${H}" rx="14" fill="#f6f8fc"/><rect x="${W/2+8}" y="0" width="${W/2-8}" height="${H}" rx="14" fill="#eef7fc"/>
   <text x="24" y="38" font-family="Barlow Condensed,Inter,sans-serif" font-size="25" font-weight="800" fill="#171F69">Today: a fixed number advances</text>
   <text x="24" y="58" font-size="12.5" fill="#5a6480">Top ${EX.topN} at every Regional, whatever its size</text>
   ${blk(24,94,EX.small.name,sN,t1,'#171F69')}${blk(254,94,EX.large.name,lN,t2,'#171F69')}
   <text x="24" y="${H-22}" font-size="13.5" fill="#0f1633"><tspan font-weight="700">Different odds:</tspan> ${Math.round(t1/sN*100)}% in one Region, ${Math.round(t2/lN*100)}% in the other.</text>
   <text x="${W/2+32}" y="38" font-family="Barlow Condensed,Inter,sans-serif" font-size="25" font-weight="800" fill="#00708f">Proportional: same share everywhere</text>
   <text x="${W/2+32}" y="58" font-size="12.5" fill="#5a6480">${Math.round(EX.share*100)}% of each event’s field at every Regional</text>
   ${blk(W/2+32,94,EX.small.name,sN,p1,'#009AC7')}${blk(W/2+262,94,EX.large.name,lN,p2,'#009AC7')}
   <text x="${W/2+32}" y="${H-22}" font-size="13.5" fill="#0f1633"><tspan font-weight="700">Same odds:</tspan> about ${Math.round(EX.share*100)}% in every Region.</text>
  </svg>`;
}

/* ---------- map: Boundary Studio style (white county lines), Zones outlined ---------- */
function mapSVG(){
  const S=MAPS.scenarios[SID],A=S.assign;
  const base=f=>{const ri=A[f];return (ri==null||ri<0)?'#eef0f4':S.regions[ri].color;};
  let h='<g>'+MAPS.counties.map(c=>{const b=base(c.f);return `<path d="${c.d}" fill="${c.a?b:tint(b,.74)}" stroke="#fff" stroke-width=".3"/>`;}).join('')+'</g>';
  h+='<g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round">'+S.regions.map(r=>`<path d="${r.outline}"/>`).join('')+'</g>';
  h+='<g fill="none" stroke="#171F69" stroke-opacity=".9" stroke-width="2" stroke-linejoin="round">'+S.zones.map(z=>`<path d="${z.outline}"/>`).join('')+'</g>';
  h+=S.zones.map(z=>{const w=z.name.length*7.2+22;return `<g transform="translate(${z.label})"><rect x="${-w/2}" y="-11" width="${w}" height="21" rx="10.5" fill="#171F69"/><text text-anchor="middle" y="4" font-size="11.5" font-weight="700" fill="#fff" font-family="Inter,sans-serif">${esc(z.name)}</text></g>`;}).join('');
  return `<svg viewBox="${MAPS.viewBox}" role="img" aria-label="Regions coloured, Zone boundaries outlined in navy">${h}</svg>`;
}
function zoneList(s){
  const S=MAPS.scenarios[SID];
  const reg=Object.fromEntries(meetsAt(s,s.tiers[0].level).map(m=>[m.stop,m.entries]));
  const zon=Object.fromEntries(meetsAt(s,s.tiers[1].level).map(m=>[m.stop,m.entries]));
  return S.zones.map(z=>`<div class="zone"><h3>${esc(z.name)}<span>${fmt(zon[z.name])} at Zones</span></h3><ul>${
    z.regions.map(ri=>{const r=S.regions[ri];return `<li><i style="background:${r.color}"></i>${esc(r.name)}<span>${fmt(reg[r.name])}</span></li>`;}).join('')}</ul></div>`).join('');
}

/* ---------- athlete path ---------- */
function pathHTML(s){
  const f=s.flow,t=s.tiers;
  return `<div class="path">
   <div class="stop"><div class="k">Stop 1 · ${t[0].meets} meets</div><h3>Regionals</h3><div class="big">${fmt(t[0].entries)} <small>event entries</small></div>

function compareTable(){
  const sc=DATA.scenarios,R=DATA.references,all=[...sc,...R];
  const range=(s,i)=>{if(!s.tiers[i])return '—';const v=meetsAt(s,s.tiers[i].level).map(m=>m.entries);return v.length?fmt(Math.min(...v))+'–'+fmt(Math.max(...v)):'—';};
  const reachR=s=>{const v=GROUPS.map(g=>s.reach&&s.reach[g]).filter(x=>x!=null);return v.length?Math.round(Math.min(...v))+'–'+Math.round(Math.max(...v))+'%':'—';};
  const head=`<tr><th></th>${sc.map(s=>`<th class="n"><span style="color:${SC_COL[s.id]}">${esc(s.label)}</span><br><span class="pill ${s.kind==='sub'?'sub':''}">${s.kind==='sub'?'submission':'concept'}</span></th>`).join('')}${R.map(r=>`<th class="n">${esc(r.label)}<br><span class="pill ref">actual / model</span></th>`).join('')}</tr>`;
  const row=(lab,fn,cls='')=>`<tr class="${cls}"><td>${lab}</td>${all.map(x=>`<td class="n">${fn(x)}</td>`).join('')}</tr>`;
  return `<table>${head}
   ${row('Stops',x=>x.tiers.map(t=>esc(t.level)).join(' → '))}
   ${row('First stop',x=>fmt(x.tiers[0].entries))}
   ${row('Second stop',x=>fmt(x.tiers[1]&&x.tiers[1].entries))}

   ${row('Share reaching Nationals, by age group &amp; gender',x=>reachR(x))}
  </table>`;
}
function reachBars(){

function matrixHTML(Y){
  const D=mxData(Y),M=D.meets,cells=EVT_ORDER.filter(c=>M.some(m=>(m.p&&m.p[c])||(m.a&&m.a[c])));
  const tot=(o,f)=>o?Object.entries(o).reduce((t,[c,v])=>t+(f(c)?v:0),0):0;
  const row=(lab,f,cls)=>{const ps=M.map(m=>tot(m.p,f)),as=M.map(m=>tot(m.a,f));const P=ps.reduce((x,y)=>x+y,0),A=as.reduce((x,y)=>x+y,0);
    const cell=(p,a,x='')=>{const h=mxCell(p,a);return `<td class="n ${x}${h===''?' z':''}">${h===''?'·':h}</td>`;};
    return `<tr class="${cls||''}"><td>${lab}</td>${M.map((m,i)=>cell(ps[i],as[i])).join('')}${cell(P,A,'tt')}</tr>`;};
  let body='';
  ['A','B','C','D'].forEach(a=>{
    const cs=cells.filter(c=>c[0]===a);if(!cs.length)return;
    body+=`<tr class="gh"><td colspan="${M.length+2}">${AGE_L[a]}</td></tr>`;
    cs.forEach(c=>{body+=row(`${GEN_L[c[1]]} ${BRD_L[c[2]]}`,x=>x===c);});
    body+=row(`${AGE_L[a]} total`,x=>x[0]===a,'st');
  });
  body+=row('All events',()=>true,'tot');
  const head=`<tr><th>Event</th>${M.map(m=>`<th class="n" title="${esc(m.sub)}">${esc(m.name)}</th>`).join('')}<th class="n tt">${D.jn?'Junior Nationals':'All meets'}</th></tr>`;
  return `<table class="mx">${head}${body}</table>`;
}
function matrixCSV(){
  const sc=SEAS.scenarios[SID],out=[['scenario','season','stop','meet','age group','gender','board','proportional entries',`as run (same counties)`]];
  Object.entries(sc.years).forEach(([yr,Y])=>{
    const add=(stop,meet,p,a)=>EVT_ORDER.forEach(c=>{const pv=(p&&p[c])||0,av=(a&&a[c])||0;if(pv||av)out.push([sc.name,yr,stop,meet,AGE_L[c[0]],GEN_L[c[1]],BRD_L[c[2]],pv,av]);});
    Y.regions.forEach(r=>add('Regionals',r.name,r.first,r.actual.Regionals));
    Y.zones.forEach(z=>add('Zones',z.name,z.field,z.actual.Zones));
    Y.zones.forEach(z=>add('Junior Nationals','from '+z.name,z.toJN,z.actual.Nationals));
  });
  const csv=out.map(r=>r.map(v=>/[",]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),l=document.createElement('a');
  l.href=u;l.download=`${SID}-every-meet-every-event.csv`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function mxControls(){

    <div class="sx-seg">${vw.map(([k,l])=>`<button data-mxv="${k}" aria-pressed="${k===SX.view}">${l}</button>`).join('')}</div>
    <button class="sx-dl" id="mxCsv">Download every meet (CSV)</button></div>`;
}
function mxNote(){
  const v=SX.view,real=SX.stop===0?'Regionals':SX.stop===1?'Zones':'Junior Nationals';
  const key=v==='both'?`Each cell: proportional <span style="color:#9aa2bb">/ ${SX.yr} as run</span>.`:v==='diff'?`Proportional minus ${SX.yr} as run.`:'';
  const stopTxt=SX.stop===2?`Junior Nationals is one meet; each column is what each Zone sends to it, and the last column is the whole meet.`:`One column per meet.`;
  return `<p class="note" style="margin:0 0 6px">${stopTxt} ${key} “As run” counts divers from the same counties at ${SX.yr} ${real}${SX.stop===0?' (the real 2025 Regional lines were different; these divers are regrouped by the proposed map)':''}. A dot means no entries.</p>`;
}

function sxPickHTML(Y){
  const cells=Y.cells.filter(c=>Y.zones.some(z=>(z.field[c]||0)>0));
  return `<label>Event <select id="sxCell">${cells.map(c=>`<option value="${c}" ${c===SX.cell?'selected':''}>${esc(cellName(c))}</option>`).join('')}</select></label>
    <label>Zone <select id="sxZone">${Y.zones.map((z,i)=>`<option value="${i}" ${i===SX.zone?'selected':''}>${esc(z.name)}</option>`).join('')}</select></label>`;
}
function sxFlowHTML(Y){
  const c=SX.cell,z=Y.zones[SX.zone],regs=Y.regions.filter(r=>r.zone===z.name),plat=c[2]==='P',cd=/^[CD]/.test(c);
  const v=(o)=>o?(o[c]||0):0;
  const zField=v(z.field),zOpen=v(z.open),toJN=v(z.toJN),semi=Math.round(v(z.semi)),realZ=v(z.actual.Zones),realJ=v(z.actual.Nationals);
  const rBoxes=regs.map(r=>{const f=v(r.first),sp=r.spots?(r.spots[c]||0):0,to=v(r.toZone);
    return `<div class="sx-box"><div class="t">${esc(r.name)}<span>${fmt(f)} divers</span></div>
      ${plat?`<div class="l"><span>Platform here is non-qualifying</span><b>—</b></div>`
        :`<div class="l"><span>${f<=3?'Field of 3 or fewer: all advance':'65% of the field, plus score threshold'}</span><b>${fmt(Math.round(sp))} places</b></div>
          <div class="l"><span>Expected at the Zone (take-up)</span><b>${fmt(to)}</b></div>`}
      <div class="l r"><span>${SX.yr} real: at Regionals → at Zones</span><b>${fmt(v(r.actual.Regionals))} → ${fmt(v(r.actual.Zones))}</b></div></div>`;}).join('');
  const zBox=`<div class="sx-box hl"><div class="t">${esc(z.name)}<span>${fmt(zField)} divers</span></div>
      ${plat?`<div class="l"><span>Platform by open entry</span><b>${fmt(zOpen)}</b></div>`:`<div class="l"><span>From its Regionals</span><b>${fmt(zField-zOpen)}</b></div>`}
      <div class="l"><span>${cd?'55% of the field':'Top 2, then rest of 55%'}</span><b>${fmt(toJN)} go on</b></div>
      <div class="l r"><span>${SX.yr} real at Zones</span><b>${fmt(realZ)}</b></div></div>`;
  const jBox=`<div class="sx-box"><div class="t">Junior Nationals<span>from ${esc(z.name)}</span></div>
      ${cd?`<div class="l"><span>Prelims and final, same day</span><b>${fmt(toJN)}</b></div>`
        :`<div class="l"><span>Straight to the semifinal</span><b>${fmt(Math.min(semi,toJN))}</b></div><div class="l"><span>Into prelims</span><b>${fmt(Math.max(0,toJN-Math.min(semi,toJN)))}</b></div>`}
      <div class="l r"><span>${SX.yr} real at Nationals</span><b>${fmt(realJ)}</b></div></div>`;
  const nR=regs.reduce((a,r)=>a+v(r.first),0),nRealR=regs.reduce((a,r)=>a+v(r.actual.Regionals),0);
  const say=plat
    ? `In ${SX.yr}, ${fmt(realZ)} ${esc(cellName(c))} divers from these counties dove at Zones and ${fmt(realJ)} reached Nationals. Under the proportional rule platform skips Regionals: all ${fmt(zOpen)} enter ${esc(z.name)} directly, and ${fmt(toJN)} go on to Junior Nationals.`
    : `In ${SX.yr}, ${fmt(nRealR)} divers from these counties entered ${esc(cellName(c))} at Regionals, ${fmt(realZ)} dove it at Zones and ${fmt(realJ)} at Junior Nationals. With the same divers, the proportional rule would give ${fmt(nR)} at Regionals, ${fmt(zField)} at ${esc(z.name)} and ${fmt(toJN)} at Junior Nationals${toJN===realJ?', the same as really happened':toJN>realJ?`, ${fmt(toJN-realJ)} more than really went`:`, ${fmt(realJ-toJN)} fewer than really went`}.`;
  return `<div class="sx-flow"><div class="sx-col"><div class="h">Regionals</div>${rBoxes}</div><div class="ar">→</div>
    <div class="sx-col"><div class="h">Zone</div>${zBox}</div><div class="ar">→</div><div class="sx-col"><div class="h">Junior Nationals</div>${jBox}</div></div>
    <div class="sx-say">${say}</div>`;
}
function sxWire(){
  const sc=SEAS.scenarios[SID];if(!sc)return;const Y=sc.years[SX.yr];
  if(SX.zone==null||SX.zone>=Y.zones.length){let b=0;Y.zones.forEach((z,i)=>{if(sumC(z.field)>sumC(Y.zones[b].field))b=i;});SX.zone=b;}

  mxWire();
  $('#sxPick').innerHTML=sxPickHTML(Y);$('#sxFlow').innerHTML=sxFlowHTML(Y);
  $('#sxCell').onchange=e=>{SX.cell=e.target.value;$('#sxFlow').innerHTML=sxFlowHTML(Y);};

}

function checks(){
  const bad=[];
  DATA.scenarios.forEach(s=>{
    const sumMeets=s.meets.reduce((a,m)=>a+m.entries,0),sumTiers=s.tiers.reduce((a,t)=>a+t.entries,0);
    if(Math.abs(sumMeets-sumTiers)>0.5) bad.push(`${s.label}: meets add to ${sumMeets}, stops to ${sumTiers}`);
    const g=s.meets.reduce((a,m)=>a+m.gross,0);
    if(Math.abs(g-s.gross)>1) bad.push(`${s.label}: meet income adds to ${g}, total ${s.gross}`);
    if(Math.abs(s.gross-s.dm-s.hosts-s.usad)>1) bad.push(`${s.label}: collected is not DiveMeets + hosts + USA Diving`);
    if(s.flow&&Math.abs(s.flow.natsEntries-lastTier(s).entries)>0.5) bad.push(`${s.label}: pathway Nationals ${s.flow.natsEntries} vs ${lastTier(s).entries}`);
    if(s.flow&&Math.abs(s.flow.stop1-s.tiers[0].entries)>0.5) bad.push(`${s.label}: pathway first stop ${s.flow.stop1} vs ${s.tiers[0].entries}`);
  });
  Object.entries(SEAS.scenarios).forEach(([id,x])=>{const s=scen(id),y=x.years['2026'];if(!s||!y)return;
    [['first stop',y.totals.first,s.tiers[0].entries],['Zones',y.totals.zones,s.tiers[1].entries],['Junior Nationals',y.totals.jn,lastTier(s).entries]].forEach(([l,a,b])=>{if(Math.abs(a-b)>0.5)bad.push(`${s.label}: seasons ${l} ${a} vs report ${b}`);});
    Object.values(x.years).forEach(Y=>{const r=Y.regions.reduce((a,q)=>a+sumC(q.first),0),z=Y.zones.reduce((a,q)=>a+sumC(q.field),0),j=Y.zones.reduce((a,q)=>a+sumC(q.toJN),0);
      if(r!==Y.totals.first||z!==Y.totals.zones||j!==Y.totals.jn)bad.push(`${x.name}: seasons tables do not add up`);});});
  Object.entries(MAPS.scenarios).forEach(([id,S])=>{const s=scen(id);if(!s){bad.push(`map for ${id} has no projection`);return;}
    if(S.regions.length!==s.tiers[0].meets) bad.push(`${s.label}: map has ${S.regions.length} Regions, projection ${s.tiers[0].meets}`);
    if(S.zones.length!==s.tiers[1].meets) bad.push(`${s.label}: map has ${S.zones.length} Zones, projection ${s.tiers[1].meets}`);
    const regMeets=meetsAt(s,s.tiers[0].level).map(m=>m.stop).sort().join('|'),mapRegs=S.regions.map(r=>r.name).sort().join('|');
    if(regMeets!==mapRegs) bad.push(`${s.label}: map Regions do not match the projection's Regionals`);});
  return bad;
}

    <p class="note">${fmtN(VIS.strip2025.events)} Zone events, ${fmtN(VIS.strip2025.field)} divers-in-events. ${fmtN(VIS.strip2025.actual)} reached 2025 Junior Nationals; 55% of every field would have sent ${fmtN(VIS.strip2025.rule)} before round limits and take-up. Group A girls sent about a third from every Zone; many Group C/D boys events sent everyone.</p>
  </section>

  <section class="card"><span class="num">04</span><h2>Run against real seasons, stop by stop</h2>
    <p class="lede">The same divers who really competed, run through this proposal on this map. For each stop, each Region and each Zone, the proportional result sits next to what really happened to divers from the same counties.</p>

  <section class="card"><span class="num">09</span><h2>Entry income</h2>
