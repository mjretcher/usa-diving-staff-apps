<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USA Diving Membership Analytics</title>
<link rel="icon" type="image/svg+xml" href="../shared/images/diver-mark.svg">
<link rel="apple-touch-icon" href="../shared/images/diver-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/usad-overlays.css?v=202607202300">
<style>
:root{--navy:#171F69;--red:#E31937;--pool:#009AC7;--sky:#8FC3EA;--bg:#eef3f9;--ink:#13213a;--muted:#667085;--line:#d8e0ec;--green:#15803d;
--display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--ui:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
button,input,select{font:inherit}button{cursor:pointer}
.top{background:linear-gradient(135deg,var(--navy),#0c1349);border-bottom:6px solid var(--red);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.brand-logo img{height:46px;width:auto;display:block}
.brand-title{border-left:1px solid rgba(255,255,255,.22);padding-left:16px}
.top h1{margin:0;font-family:var(--display);font-size:40px;line-height:.9;letter-spacing:.045em;text-transform:uppercase}
@media(max-width:640px){.top{padding:14px 18px}.brand-logo img{height:34px}.brand-title{padding-left:12px}.top h1{font-size:28px}}
.top p{margin:6px 0 0;color:#cfe3ff;font-size:13px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.top-meta{text-align:right;color:#b8c7e7;font-size:11px}
a.hub-link{color:#8fc3ea;font-weight:700;font-size:12px;text-decoration:none}
a.hub-link:hover{color:#fff}
.wrap{max-width:1560px;margin:0 auto;padding:20px}
.view-tabs{display:flex;gap:9px;margin:0 0 16px;flex-wrap:wrap}
.tab{border:1px solid #cdd6e4;background:#fff;color:var(--navy);border-radius:999px;padding:10px 20px;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(16,24,40,.04)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.view{display:none}.view.active{display:block}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.loading{padding:60px;text-align:center;color:var(--muted);font-weight:600}

/* KPI band — SafeSport-poster style big stats */
.kpi-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px 15px;box-shadow:0 8px 22px rgba(16,24,40,.06);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--navy)}
.kpi.red::before{background:var(--red)}.kpi.pool::before{background:var(--pool)}.kpi.sky::before{background:var(--sky)}
.kpi .big{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;color:var(--navy);letter-spacing:.01em}
.kpi .chip{display:inline-block;margin-top:7px;background:var(--red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:3px 9px}
.kpi .chip.navy{background:var(--navy)}.kpi .chip.pool{background:var(--pool)}
.kpi .sub{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.35}
.delta{font-family:var(--mono);font-weight:600;font-size:12px}
.delta.down{color:var(--red)}.delta.up{color:var(--green)}.delta.flat{color:var(--muted)}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 22px rgba(16,24,40,.06);margin-bottom:16px;overflow:hidden}
.card-h{padding:14px 18px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h2{margin:0;font-family:var(--display);font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:12px 18px 18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid-2{grid-template-columns:1fr}}

.seg{display:inline-flex;border:1px solid #cdd6e4;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--navy);padding:7px 14px;font-weight:700;font-size:12px}
.seg button.on{background:var(--navy);color:#fff}
.controls-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.controls-row label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#536176}
input.search{border:1px solid #c8d2e0;border-radius:9px;padding:8px 11px;min-width:220px}
select.sel{border:1px solid #c8d2e0;border-radius:9px;padding:8px 11px;background:#fff}

table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #eef2f7;text-align:left;padding:8px 9px;font-size:12.5px;vertical-align:middle}
th{background:#f8fafc;color:var(--navy);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:nowrap}
th .arr{color:var(--pool)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px}
tr:hover td{background:#f7fafd}
.bar-cell{display:flex;align-items:center;gap:8px}
.mini-bar{height:9px;border-radius:5px;background:var(--pool);min-width:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.pill.navy{background:#e8eef9;color:var(--navy)}.pill.red{background:#fdeaee;color:var(--red)}.pill.green{background:#e7f4ec;color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:baseline}
.callout{border:1px solid #cfe3f4;background:#f2f9fd;border-left:5px solid var(--pool);border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.5;margin:10px 0}
.callout.warn{border-color:#f3d9b0;background:#fdf7ec;border-left-color:#b45309}
.chart-wrap{width:100%;overflow-x:auto}
.foot{padding:0 18px 14px;font-size:11px;color:var(--muted)}

/* --- Membership Map poster board --- */
.map-board{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 26px rgba(16,24,40,.06);overflow:hidden}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 26px 6px}
.map-head .wordmark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;color:var(--navy);line-height:.9;text-transform:uppercase}
.map-head .wordmark span{display:block;color:var(--red);font-size:15px;letter-spacing:.14em;font-weight:600}
.map-title{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.09em;color:#c3cddc;text-transform:uppercase;text-align:center;flex:1}
.map-body{display:grid;grid-template-columns:1fr 250px;gap:10px;padding:4px 22px 6px;align-items:center}
@media(max-width:900px){.map-body{grid-template-columns:1fr}}
.map-svg-wrap{width:100%}
.map-svg-wrap svg{width:100%;height:auto;display:block}
.st{stroke:#fff;stroke-width:1;transition:opacity .12s;cursor:pointer}
.st:hover{opacity:.82}
.pin{cursor:pointer}
.big-stats{display:flex;flex-direction:column;gap:26px;align-items:flex-start;padding:10px 0}
.big-stat .n{font-family:var(--display);font-weight:800;font-size:88px;line-height:.85;color:var(--navy)}
.big-stat .lbl{display:inline-block;margin-top:6px;background:var(--red);color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:4px 12px;box-shadow:0 2px 0 #b7122b}
.big-stat .lbl.navy{background:var(--navy);box-shadow:0 2px 0 #0c1349}
.big-stat .under{margin-top:5px;height:2px;width:180px;background:#d8e0ec}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;padding:2px 26px 8px;font-size:12px;color:var(--muted);align-items:center}
.map-foot{border-top:2px solid #d8e0ec;margin:6px 26px 0;padding:10px 0 18px}
.map-foot .stamp{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--navy);text-transform:uppercase;border-bottom:2px solid #c3cddc;display:inline-block;padding-bottom:2px;margin-bottom:10px}
.club-cols{column-count:5;column-gap:26px;font-size:11.5px;color:#3d4a63}
@media(max-width:1100px){.club-cols{column-count:3}}
@media(max-width:700px){.club-cols{column-count:2}}
.club-cols div{break-inside:avoid;padding:2px 0}
.club-cols b{font-family:var(--mono);font-size:10.5px;color:var(--pool)}

/* --- Boundary Studio --- */
.bs-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(430px,1fr);gap:14px;align-items:start}
@media(max-width:1200px){.bs-layout{grid-template-columns:1fr}}
.bcty{stroke:#fff;stroke-width:.35;cursor:pointer}
.bcty:hover{stroke:#171F69;stroke-width:1}
.bs-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bs-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bs-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:5px 12px;font-weight:700;font-size:12px;color:var(--ink)}
.bs-chip .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.bs-chip.on{border-color:var(--c);background:var(--c);color:#fff}
.bs-chip.on .dot{background:#fff}
.bs-chip.eraser.on{border-color:#94a3b8;background:#64748b;color:#fff}
.bs-chip.add{border-style:dashed;color:var(--muted)}
.bs-chip:disabled{opacity:.4;cursor:default}
.bs-table th,.bs-table td{padding:6px 7px;font-size:12px}
.bs-table tbody tr{cursor:pointer}
.bs-table tr.sel td{background:#eef6fb}
.bs-table tr.unrow td{color:var(--muted)}
.bs-table .sw{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:7px;vertical-align:-2px}
.bs-drill{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdff}
.bs-drill-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.bs-drill-h .sw{display:inline-block;width:13px;height:13px;border-radius:4px}
.bs-zips{display:flex;flex-wrap:wrap;gap:5px;max-height:220px;overflow:auto}
.bs-zip{border:1px solid #d8e0ec;border-radius:6px;background:#fff;padding:2px 7px;font-family:var(--mono);font-size:11px;color:var(--ink)}
.bs-zip b{color:var(--navy)}
.tooltip-fixed{position:fixed;z-index:1000;display:none;max-width:320px;background:#07194f;color:#fff;border-radius:10px;box-shadow:0 12px 36px rgba(2,6,23,.28);padding:9px 11px;font-size:12px;line-height:1.4;pointer-events:none}

.sw-multi{width:9px !important;height:13px;border-radius:3px !important;margin-right:2px !important}
.bs-tiers{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fbfdff;font-size:12px}
.bs-tiers summary{cursor:pointer;font-weight:700;color:var(--navy)}
.bs-tier-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:700px){.bs-tier-grid{grid-template-columns:1fr}}
.bs-tier-h{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.bs-tier-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.bs-tier-row .sel{margin-left:auto;padding:2px 6px;font-size:11.5px}
.bs-tier-row .sw{display:inline-block;width:12px;height:12px;border-radius:4px}
.bs-mini{padding:2px 8px !important;font-size:10.5px !important}
.bs-legend{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.bs-lg-head{font-size:11px;color:var(--muted);margin-bottom:8px}
.bs-lg-head b{color:var(--navy);font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;margin-right:2px}
.bs-lg-hint{color:var(--muted)}
.bs-lg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:8px}
.bs-lg-card{text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:#fff;padding:8px 11px;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 10px rgba(16,24,40,.05);cursor:pointer;font:inherit;transition:transform .08s,box-shadow .08s}
.bs-lg-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,24,40,.10)}
.bs-lg-card.sel{background:#eef6fb;border-color:var(--c);outline:2px solid var(--c);outline-offset:-1px}
.bs-lg-card.un{border-left-color:#cbd5e1;cursor:default;box-shadow:none}
.bs-lg-card.un:hover{transform:none;box-shadow:none}
.bs-lg-nm{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink)}
.bs-lg-sw{width:11px;height:11px;border-radius:3px;background:var(--c);flex-shrink:0;display:inline-block}
.bs-lg-big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--navy)}
.bs-lg-sub{font-size:10.5px;color:var(--muted)}
.bs-lg-cards.age{grid-template-columns:repeat(auto-fit,minmax(174px,1fr))}
.bs-lg-athlbl{font-family:var(--ui);font-size:10.5px;font-weight:600;color:var(--muted)}
.bs-age-key{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:9px;font-size:10.5px;color:var(--muted)}
.bs-age-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bs-age-key b{font-family:var(--display);color:var(--ink);margin-right:2px}
.bs-age-key .k-lbl{opacity:.8}
.ag-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:5px;background:#eef1f6}
.ag-bar span{display:block;min-width:0}
.ag-nums{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.ag-n b{font-family:var(--display);font-weight:800;margin-right:3px}
/* Boundary Studio — naming, tier depth, advancement scenarios */
.bs-modeseg{margin-bottom:10px}
.bs-stepseg{margin:8px 0 10px;flex-wrap:wrap}
.bs-lvl{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.bs-namebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.bs-namebar .bs-tier-row{gap:6px;margin-right:4px}
.bs-name-in{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:600 12px var(--ui);color:var(--ink);background:#fff;min-width:104px;flex:1}
.bs-name-in:focus{outline:2px solid var(--pool);outline-offset:-1px;border-color:var(--pool)}
.bs-adv-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;font-size:12px}
.bs-adv-head b{color:var(--navy)}
.bs-fill{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.bs-adv-grid{width:100%;border-collapse:collapse;margin-bottom:6px}
.bs-adv-grid th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:4px 6px;text-align:left;border-bottom:1px solid var(--line)}
.bs-adv-grid th.num{text-align:center}
.bs-adv-grid td{padding:2px 6px;font-size:12px;border-bottom:1px solid #eef1f6}
.bs-adv-grid td.num{text-align:center}
.bs-adv-grid .ag-cell{font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--navy);vertical-align:middle;border-right:1px solid var(--line)}
.bs-adv-grid .gn-cell{color:var(--muted);font-size:11.5px;white-space:nowrap}
.bs-adv-in{width:52px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:700 12px var(--mono);color:var(--navy);text-align:center;background:#fff}
.bs-adv-in:focus{outline:2px solid var(--pool);outline-offset:-1px;border-color:var(--pool)}
.bs-direct{margin:8px 0 4px;border:1px dashed var(--line);border-radius:9px;padding:7px 10px;background:#fbfdff}
.bs-direct summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--navy)}
.bs-pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin:12px 0 10px}
.bs-pipe-card{border:1px solid var(--line);border-left:5px solid var(--pool);border-radius:10px;background:#fff;padding:8px 11px;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 10px rgba(16,24,40,.05)}
.bs-pipe-card.final{border-left-color:var(--navy);background:#f6f9fd}
.bs-pipe-nm{font-size:11px;font-weight:700;color:var(--ink);line-height:1.25}
.bs-pipe-big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--navy)}
.bs-pipe-dir{font-size:10.5px;color:var(--pool);font-weight:700}
.bs-evrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.bs-evh{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.06em;color:var(--muted);min-width:84px}
.bs-ev b{font-family:var(--display);font-size:15px;color:var(--navy);margin-right:3px}
.bs-balhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 7px;font-size:12px;border-top:1px solid var(--line);padding-top:12px}
.bs-balhead b{color:var(--navy);font-family:var(--display);font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.bs-spread{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.bs-spread.ok{background:#e7f6ec;color:#15803d}
.bs-spread.over{background:#fff4e5;color:#b45309}
.bs-spread.under{background:#fdeaec;color:#b3122b}
.bs-bar{display:block;width:70px;height:8px;border-radius:4px;background:#eef1f6;overflow:hidden}
.bs-bar i{display:block;height:100%;border-radius:4px}
.bs-table td.ok{color:#15803d;font-weight:700}
.bs-table td.over{color:#b45309;font-weight:700}
.bs-table td.under{color:#b3122b;font-weight:700}
.bs-seedrow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.bs-seedrow .note{flex:1;min-width:220px}
.bs-mergebar{margin:-4px 0 12px}
.bs-mergebar .sel{max-width:150px}
.bs-mergebar .note{flex:1;min-width:200px}
.bs-swbtn{border:1px solid rgba(0,0,0,.15);padding:0;cursor:pointer;flex-shrink:0}
.bs-x{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;width:22px;height:22px;line-height:1;font-size:15px;font-weight:700;flex-shrink:0;cursor:pointer}
.bs-x:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.bs-x:disabled{opacity:.3;cursor:default}
.bs-pal{display:flex;flex-wrap:wrap;gap:4px;padding:5px 0 7px 20px}
.bs-pal-c{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.bs-pal-c:hover{outline:2px solid var(--pool);outline-offset:1px}
.bs-cmp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.bs-src{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 3px 2px 0;font-size:10.5px;color:var(--muted);background:#fff}
.bs-src b{font-family:var(--mono);color:var(--navy)}

/* --- Types & Clubs --- */
.tc-table td.indent1{padding-left:26px}
.tc-table td.indent2{padding-left:46px;color:#3d4a63}
.tc-table tr.grand td{background:#eef3fa;font-weight:800;border-top:2px solid #c8d4e6}
.tc-table tr.sub td{font-weight:700;background:#f7fafd}
.clubs-wrap{max-height:560px;overflow:auto}
.clubs-table th{position:sticky;top:0;background:#fff;cursor:pointer;user-select:none}
.clubs-table th .arr{color:var(--pool);font-size:10px}
.clubs-table th .agdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
