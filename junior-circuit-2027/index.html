<style>

.sx-dl{font:700 12.5px Inter;color:var(--navy);background:#e7ecf8;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}

.fair-tip{background:#eef7fc;border-left:4px solid var(--pool);border-radius:0 10px 10px 0;padding:9px 13px;margin:10px 0 0;font-size:14px;color:#2c3656;min-height:22px}
.fair-ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin:8px 0 0;font-size:13px}

</style>

<body>
<header class="top">
  <a href="../boundary-studio/index.html" id="backStudio" hidden>&larr; Boundary Studio</a>
  <span class="t">2027 Junior Circuit · Proportional Qualification</span>
  <span class="seg-l">Map layout</span>
  <div class="seg" role="group" aria-label="Map layout">
    <button data-model="bs-pathway27-12-6-1" aria-pressed="true">12 Regions · 6 Zones</button>
    <button data-model="bs-pathway27-10-5-1" aria-pressed="false">10 Regions · 5 Zones</button>
  </div>
</header>
<script src="../boundary-studio/pq-visuals.js?v=20261001a"></script>
<main id="app"><div class="card">Loading…</div></main>
<footer id="foot"></footer>
<script>
/* Shared committee link: this page lives at /junior-circuit-2027/ and reads the
   same data files Boundary Studio builds, so it is always current. */
const D='../boundary-studio/';
/* Options no longer under consideration: kept in the stored data (and in
   Boundary Studio) but left out of this committee report. */
const RETIRED=new Set(['bs-msix7ibe-nij21']); // USA Diving National Office Submission (earlier, fixed places)
function withoutRetired(d){
  d.scenarios=(d.scenarios||[]).filter(s=>!RETIRED.has(s.id));
  Object.values(d.sensitivity||{}).forEach(f=>RETIRED.forEach(id=>delete f[id]));
  const n=d.scenarios.length;
  d.assumptions=(d.assumptions||[]).map(a=>a.replace('First stop, 9-Zone submissions:','First stop, CCE Submission (9 Zones):').replace('These scenarios are shown','It is shown').replace('all four scenarios','all '+(n===3?'three':n)+' scenarios'));
  d.engineChecks=(d.engineChecks||[]).map(c=>Object.assign({},c,{detail:String(c.detail||'').replace(/;\s*National Office \$[\d,]+ \/ \$[\d,]+/,'').replace('All four scenarios','All scenarios')}));
  d.checks=(d.checks||[]).filter(c=>!/nij21|National Office/.test(JSON.stringify(c)));
  return d;
}
if(new URLSearchParams(location.search).get('from')==='studio'){const b=document.getElementById('backStudio');if(b)b.hidden=false;}

'use strict';
const GROUPS=['A Girls','A Boys','B Girls','B Boys','C Girls','C Boys','D Girls','D Boys'];
const SC_COL={'bs-pathway27-12-6-1':'#171F69','bs-pathway27-10-5-1':'#009AC7','bs-msg2vatz-5q86m':'#b45309','bs-msix7ibe-nij21':'#6b4fbb'};
let DATA,MAPS,SID='bs-pathway27-12-6-1';
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const usd=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tint(hex,t){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,m=c=>Math.round(c+(255-c)*t);return `rgb(${m(r)},${m(g)},${m(b)})`;}

Promise.all([
  fetch(D+'junior-pathway-2027-data.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('report data HTTP '+r.status);return r.json();}),
  fetch(D+'junior-pathway-2027-maps.json?v=202609251230').then(r=>{if(!r.ok)throw new Error('map data HTTP '+r.status);return r.json();}),
  fetch(D+'junior-pathway-2027-visuals.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('visuals data HTTP '+r.status);return r.json();}),
  fetch(D+'junior-pathway-2027-seasons.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('seasons data HTTP '+r.status);return r.json();}),
  fetch(D+'junior-pathway-2027-open.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('open data HTTP '+r.status);return r.json();}),
  fetch(D+'junior-pathway-2027-fees.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('fee data HTTP '+r.status);return r.json();})
]).then(([d,m,v,se,op,fe])=>{OPEN=op;FEES=fe;DATA=withoutRetired(d);MAPS=m;VIS=v;SEAS=se;
  if(VIS&&VIS.pathway)VIS.pathway=VIS.pathway.filter(r=>!RETIRED.has(r.id));render();})
 .catch(e=>{$('#app').innerHTML='<div class="card">Could not load the report data: '+esc(e.message)+'</div>';});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{SID=b.dataset.model;
  document.querySelectorAll('[data-model]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});

let VIS=null,OPEN=null,FEES=null,SEAS=null,SX={yr:'2025',cell:null,zone:null,stop:0,view:'both'};
const scen=id=>DATA.scenarios.find(s=>s.id===id);
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const lastTier=s=>s.tiers[s.tiers.length-1];
const meetsAt=(s,lvl)=>(s.meets||[]).filter(m=>m.tier===lvl);

/* ---------- the idea in one picture ----------
   Real 2026 fields, Group A Girls 1-meter: Region 11 had 20 divers and Region 12
   had 50 (core.event_results, 2026 Regionals, distinct divers). Today: top 15 at
   each. Proportional: 65% of each field, rounded to the nearest diver -- the
   engine's rule, routing.js floor(share x size + 0.5). */
const EX={event:'Group A Girls 1-meter',small:{name:'Region 11',n:20},large:{name:'Region 12',n:50},topN:15,share:0.65};
const adv=n=>Math.min(n,Math.floor(EX.share*n+0.5));
function dots(n,k,x0,y0,cols,col){let s='';for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols);
  s+=`<circle cx="${x0+c*14}" cy="${y0+r*14}" r="5.3" fill="${i<k?col:'#dbe0ea'}"/>`;}return s;}
function explainer(){
  const W=980,H=300,sN=EX.small.n,lN=EX.large.n,t1=Math.min(EX.topN,sN),t2=Math.min(EX.topN,lN),p1=adv(sN),p2=adv(lN);
  const blk=(x,y,title,n,k,col)=>`<text x="${x}" y="${y}" font-size="13.5" font-weight="700" fill="#0f1633">${title}</text>
    <text x="${x}" y="${y+17}" font-size="12" fill="#5a6480">${n} divers in the event</text>
    ${dots(n,k,x+6,y+36,10,col)}
    <text x="${x}" y="${y+128}" font-family="Barlow Condensed,Inter,sans-serif" font-size="34" font-weight="800" fill="${col}">${k}</text>
    <text x="${x+(k>9?46:26)}" y="${y+126}" font-size="12.5" fill="#0f1633"><tspan font-weight="700">advance</tspan> · ${Math.round(k/n*100)}% of the field</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A fixed top ${EX.topN} against the same ${Math.round(EX.share*100)} percent at every meet">
   <rect x="0" y="0" width="${W/2-8}" height="${H}" rx="14" fill="#f6f8fc"/><rect x="${W/2+8}" y="0" width="${W/2-8}" height="${H}" rx="14" fill="#eef7fc"/>
   <text x="24" y="38" font-family="Barlow Condensed,Inter,sans-serif" font-size="25" font-weight="800" fill="#171F69">Today: a fixed number advances</text>
   <text x="24" y="58" font-size="12.5" fill="#5a6480">Top ${EX.topN} at every Regional, whatever its size</text>
   ${blk(24,94,EX.small.name,sN,t1,'#171F69')}${blk(254,94,EX.large.name,lN,t2,'#171F69')}

function fairHeat(id){
  const F=FAIR[id],st=F.st,meets=[...new Set(F.P.map(p=>p.m))].sort((a,b)=>isNaN(a)||isNaN(b)?String(a).localeCompare(b):a-b),share=Math.round(st.share*100);

  const dshade=d=>d>=3?['#1d7a45','#fff']:d>0?['#cfe9d9','#0f4a2a']:d===0?['#f1f2f6','#5a6480']:d>-3?['#f6d5d7','#7a1d24']:['#b4232f','#fff'];
  let h=`<table class="heat"><tr><th>Event</th>${meets.map(m=>`<th class="n">${esc(st.meetLabel[0])}${esc(m)}</th>`).join('')}</tr>`;
  st.rows.forEach((r,ri)=>{const by={};F.P.filter(p=>p.ri===ri).forEach(p=>by[p.m]=p);
    h+=`<tr><td>${esc(r.event.replace(/ 1M$/,' 1 m').replace(/ 3M$/,' 3 m').replace(/ Platform$/,' platform'))}</td>`+meets.map(m=>{const p=by[m];if(!p)return '<td></td>';
      if(F.heat==='pct'){const v=Math.round(100*p.went/p.n),[bg,fg]=shade(v);return `<td style="background:${bg};color:${fg}" title="${p.n} divers, ${p.went} went">${v}</td>`;}
      const d=p.rule-p.went,[bg,fg]=dshade(d);return `<td style="background:${bg};color:${fg}" title="${p.n} divers: ${p.went} went, ${p.rule} at ${share}%">${d>0?'+':d<0?'−':''}${Math.abs(d)||'0'}</td>`;}).join('')+'</tr>';});
  const key=F.heat==='pct'?`Each cell: share of the field that went (%).`:`Each cell: places at ${share}% minus divers who really went. Green: more would go; red: fewer${st.meetLabel==='Region'?' (before the score threshold)':''}.`;

}

function matrixHTML(Y){
  const D=mxData(Y),M=D.meets,cells=EVT_ORDER.filter(c=>M.some(m=>(m.p&&m.p[c])||(m.a&&m.a[c])));
  const tot=(o,f)=>o?Object.entries(o).reduce((t,[c,v])=>t+(f(c)?v:0),0):0;
  const row=(lab,f,cls)=>{const ps=M.map(m=>tot(m.p,f)),as=M.map(m=>tot(m.a,f));const P=ps.reduce((x,y)=>x+y,0),A=as.reduce((x,y)=>x+y,0);
    const cell=(p,a,x='')=>{const h=mxCell(p,a);return `<td class="n ${x}${h===''?' z':''}">${h===''?'·':h}</td>`;};
    return `<tr class="${cls||''}"><td>${lab}</td>${M.map((m,i)=>cell(ps[i],as[i])).join('')}${cell(P,A,'tt')}</tr>`;};
  let body='';
  ['A','B','C','D'].forEach(a=>{
    const cs=cells.filter(c=>c[0]===a);if(!cs.length)return;
    body+=`<tr class="gh"><td colspan="${M.length+2}">${AGE_L[a]}</td></tr>`;
    cs.forEach(c=>{body+=row(`${GEN_L[c[1]]} ${BRD_L[c[2]]}`,x=>x===c);});
    body+=row(`${AGE_L[a]} total`,x=>x[0]===a,'st');
  });
  body+=row('All events',()=>true,'tot');
  const head=`<tr><th>Event</th>${M.map(m=>`<th class="n" title="${esc(m.sub)}">${esc(m.name)}</th>`).join('')}<th class="n tt">${D.jn?'Junior Nationals':'All meets'}</th></tr>`;
  return `<table class="mx">${head}${body}</table>`;
}
function matrixCSV(){
  const sc=SEAS.scenarios[SID],out=[['scenario','season','stop','meet','age group','gender','board','proportional entries',`as run (same counties)`]];
  Object.entries(sc.years).forEach(([yr,Y])=>{
    const add=(stop,meet,p,a)=>EVT_ORDER.forEach(c=>{const pv=(p&&p[c])||0,av=(a&&a[c])||0;if(pv||av)out.push([sc.name,yr,stop,meet,AGE_L[c[0]],GEN_L[c[1]],BRD_L[c[2]],pv,av]);});
    Y.regions.forEach(r=>add('Regionals',r.name,r.first,r.actual.Regionals));
    Y.zones.forEach(z=>add('Zones',z.name,z.field,z.actual.Zones));
    Y.zones.forEach(z=>add('Junior Nationals','from '+z.name,z.toJN,z.actual.Nationals));
  });
  const csv=out.map(r=>r.map(v=>/[",]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),l=document.createElement('a');
  l.href=u;l.download=`${SID}-every-meet-every-event.csv`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

}

}

function sxPickHTML(Y){

    <label>Zone <select id="sxZone">${Y.zones.map((z,i)=>`<option value="${i}" ${i===SX.zone?'selected':''}>${esc(z.name)}</option>`).join('')}</select></label>`;

function sxFlowHTML(Y){
  const c=SX.cell,z=Y.zones[SX.zone],regs=Y.regions.filter(r=>r.zone===z.name),plat=c[2]==='P',cd=/^[CD]/.test(c);
  const v=(o)=>o?(o[c]||0):0;
  const zField=v(z.field),zOpen=v(z.open),toJN=v(z.toJN),semi=Math.round(v(z.semi)),realZ=v(z.actual.Zones),realJ=v(z.actual.Nationals);
  const rBoxes=regs.map(r=>{const f=v(r.first),sp=r.spots?(r.spots[c]||0):0,to=v(r.toZone);
    return `<div class="sx-box"><div class="t">${esc(r.name)}<span>${fmt(f)} divers</span></div>

          <div class="l"><span>Expected at the Zone (take-up)</span><b>${fmt(to)}</b></div>`}
      <div class="l r"><span>${SX.yr} real: at Regionals → at Zones</span><b>${fmt(v(r.actual.Regionals))} → ${fmt(v(r.actual.Zones))}</b></div></div>`;}).join('');
  const zBox=`<div class="sx-box hl"><div class="t">${esc(z.name)}<span>${fmt(zField)} divers</span></div>
      ${plat?`<div class="l"><span>Platform by open entry</span><b>${fmt(zOpen)}</b></div>`:`<div class="l"><span>From its Regionals</span><b>${fmt(zField-zOpen)}</b></div>`}
      <div class="l"><span>${cd?'55% of the field':'Top 2, then rest of 55%'}</span><b>${fmt(toJN)} go on</b></div>
      <div class="l r"><span>${SX.yr} real at Zones</span><b>${fmt(realZ)}</b></div></div>`;
  const jBox=`<div class="sx-box"><div class="t">Junior Nationals<span>from ${esc(z.name)}</span></div>
      ${cd?`<div class="l"><span>Prelims and final, same day</span><b>${fmt(toJN)}</b></div>`
        :`<div class="l"><span>Straight to the semifinal</span><b>${fmt(Math.min(semi,toJN))}</b></div><div class="l"><span>Into prelims</span><b>${fmt(Math.max(0,toJN-Math.min(semi,toJN)))}</b></div>`}
      <div class="l r"><span>${SX.yr} real at Nationals</span><b>${fmt(realJ)}</b></div></div>`;
  const nR=regs.reduce((a,r)=>a+v(r.first),0),nRealR=regs.reduce((a,r)=>a+v(r.actual.Regionals),0);
  const say=plat
    ? `In ${SX.yr}, ${fmt(realZ)} ${esc(cellName(c))} divers from these counties dove at Zones and ${fmt(realJ)} reached Nationals. Under the proportional rule platform skips Regionals: all ${fmt(zOpen)} enter ${esc(z.name)} directly, and ${fmt(toJN)} go on to Junior Nationals.`
    : `In ${SX.yr}, ${fmt(nRealR)} divers from these counties entered ${esc(cellName(c))} at Regionals, ${fmt(realZ)} dove it at Zones and ${fmt(realJ)} at Junior Nationals. With the same divers, the proportional rule would give ${fmt(nR)} at Regionals, ${fmt(zField)} at ${esc(z.name)} and ${fmt(toJN)} at Junior Nationals${toJN===realJ?', the same as really happened':toJN>realJ?`, ${fmt(toJN-realJ)} more than really went`:`, ${fmt(realJ-toJN)} fewer than really went`}.`;
  return `<div class="sx-flow"><div class="sx-col"><div class="h">Regionals</div>${rBoxes}</div><div class="ar">→</div>
    <div class="sx-col"><div class="h">Zone</div>${zBox}</div><div class="ar">→</div><div class="sx-col"><div class="h">Junior Nationals</div>${jBox}</div></div>
    <div class="sx-say">${say}</div>`;
}
function sxWire(){
  const sc=SEAS.scenarios[SID];if(!sc)return;const Y=sc.years[SX.yr];
  if(SX.zone==null||SX.zone>=Y.zones.length){let b=0;Y.zones.forEach((z,i)=>{if(sumC(z.field)>sumC(Y.zones[b].field))b=i;});SX.zone=b;}

function checks(){
  const bad=[];
  DATA.scenarios.forEach(s=>{
    const sumMeets=s.meets.reduce((a,m)=>a+m.entries,0),sumTiers=s.tiers.reduce((a,t)=>a+t.entries,0);
    if(Math.abs(sumMeets-sumTiers)>0.5) bad.push(`${s.label}: meets add to ${sumMeets}, stops to ${sumTiers}`);
    const g=s.meets.reduce((a,m)=>a+m.gross,0);
    if(Math.abs(g-s.gross)>1) bad.push(`${s.label}: meet income adds to ${g}, total ${s.gross}`);
    if(Math.abs(s.gross-s.dm-s.hosts-s.usad)>1) bad.push(`${s.label}: collected is not DiveMeets + hosts + USA Diving`);
    if(s.flow&&Math.abs(s.flow.natsEntries-lastTier(s).entries)>0.5) bad.push(`${s.label}: pathway Nationals ${s.flow.natsEntries} vs ${lastTier(s).entries}`);
    if(s.flow&&Math.abs(s.flow.stop1-s.tiers[0].entries)>0.5) bad.push(`${s.label}: pathway first stop ${s.flow.stop1} vs ${s.tiers[0].entries}`);
  });
  Object.entries(SEAS.scenarios).forEach(([id,x])=>{const s=scen(id),y=x.years['2026'];if(!s||!y)return;
    [['first stop',y.totals.first,s.tiers[0].entries],['Zones',y.totals.zones,s.tiers[1].entries],['Junior Nationals',y.totals.jn,lastTier(s).entries]].forEach(([l,a,b])=>{if(Math.abs(a-b)>0.5)bad.push(`${s.label}: seasons ${l} ${a} vs report ${b}`);});
    Object.values(x.years).forEach(Y=>{const r=Y.regions.reduce((a,q)=>a+sumC(q.first),0),z=Y.zones.reduce((a,q)=>a+sumC(q.field),0),j=Y.zones.reduce((a,q)=>a+sumC(q.toJN),0);
      if(r!==Y.totals.first||z!==Y.totals.zones||j!==Y.totals.jn)bad.push(`${x.name}: seasons tables do not add up`);});});
  Object.entries(MAPS.scenarios).forEach(([id,S])=>{const s=scen(id);if(!s){bad.push(`map for ${id} has no projection`);return;}
    if(S.regions.length!==s.tiers[0].meets) bad.push(`${s.label}: map has ${S.regions.length} Regions, projection ${s.tiers[0].meets}`);
    if(S.zones.length!==s.tiers[1].meets) bad.push(`${s.label}: map has ${S.zones.length} Zones, projection ${s.tiers[1].meets}`);
    const regMeets=meetsAt(s,s.tiers[0].level).map(m=>m.stop).sort().join('|'),mapRegs=S.regions.map(r=>r.name).sort().join('|');
    if(regMeets!==mapRegs) bad.push(`${s.label}: map Regions do not match the projection's Regionals`);});
  return bad;
}
