<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Junior Circuit — USA Diving Staff Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/design.css?v=202607051200">
    <link rel="stylesheet" href="styles.css?v=202607051200">
    <link rel="stylesheet" href="ui-fixes.css">
    <link rel="stylesheet" href="pipeline-modeling.css?v=202607051200">
    <link rel="stylesheet" href="mobile.css?v=202607051200">
  <meta name="description" content="USA Diving Junior Circuit — Qualification Pipeline Tracker">
  <meta name="theme-color" content="#171f69">
  <meta property="og:site_name" content="USA Diving Staff Platform">
  <meta property="og:title" content="Junior Circuit — USA Diving Staff Platform">
  <meta property="og:description" content="Junior Circuit qualification pipeline tracker for USA Diving staff.">
    </head>
  <body>

    <!-- ── TOP BAR ─────────────────────────────────────────────── -->
    <header class="app-topbar">
      <a class="topbar-brand" href="../index.html" title="Back to Staff Platform">
        <img src="../shared/images/logo-white-horizontal.png" alt="USA Diving" class="topbar-logo" height="32">
        <span class="topbar-app-label">Staff Platform</span>
      </a>

      <!-- Stage navigation -->
      <nav class="stage-nav" id="stageNav" aria-label="Circuit stage"></nav>

      <!-- Actions -->
      <div class="topbar-actions">
        <button class="topbar-btn" id="overrideToggle" aria-pressed="false">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 3h10M3 6h6M5 9h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Overrides
          <span class="override-badge" id="overrideBadge" hidden>0</span>
        </button>
        <button class="topbar-btn primary" id="exportBtn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v7M6 8L4 6M6 8l2-2M2 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Export
        </button>
      </div>
    </header>

    <!-- ── OVERRIDE DRAWER ─────────────────────────────────────── -->
    <aside class="override-drawer" id="overrideDrawer" hidden>
      <div class="drawer-header">
        <div>
          <h2>Manual Overrides</h2>
          <p>Saved in this browser. Can be undone.</p>
        </div>
        <div class="drawer-header-actions">
          <button class="btn-ghost btn-sm" id="undoOverrideButton">Undo</button>
          <button class="btn-ghost btn-sm" id="redoOverrideButton">Redo</button>
          <button class="btn-ghost btn-sm" id="exportOverridesButton">Export JSON</button>
          <button class="btn-ghost btn-sm btn-danger" id="clearOverridesButton">Clear all</button>
        </div>
      </div>
      <div class="drawer-form">
        <label class="form-field"><span>Athlete ID</span><input id="overrideAthleteId" type="text" placeholder="DiveMeets ID"></label>
        <label class="form-field"><span>Name</span><input id="overrideAthleteName" type="text" placeholder="Optional — for reference"></label>
        <label class="form-field">
          <span>Override type</span>
          <select id="overrideType">
            <option value="foreign">Foreign athlete</option>
            <option value="dual">Dual citizen</option>
            <option value="dualEffect">Dual affects results</option>
            <option value="hps">HPS athlete</option>
            <option value="ymca">YMCA event champion</option>
            <option value="notAttending">Declared not attending</option>
            <option value="petition">Medical petition — approved</option>
            <option value="keptInvited">Kept invited (dual/policy)</option>
            <option value="review">Flag for review</option>
          </select>
        </label>
        <label class="form-field">
          <span>State</span>
          <select id="overrideValue"><option value="true">Turn on</option><option value="false">Turn off</option></select>
        </label>
        <label class="form-field form-field-wide"><span>Note</span><input id="overrideNote" type="text" placeholder="Reason or source"></label>
        <button class="btn-primary" id="addOverrideButton">Add override</button>
      </div>
      <div class="drawer-summary" id="overrideSummary"></div>
      <div class="drawer-log" id="overrideLog"></div>
    </aside>

    <!-- ── BODY ────────────────────────────────────────────────── -->
    <div class="app-body">

      <!-- SIDEBAR -->
      <aside class="control-sidebar" aria-label="Filters">
        <div class="sidebar-section" id="filterFields"></div>
        <div class="sidebar-section">
          <label class="synchro-toggle">
            <input type="checkbox" id="showSynchroToggle">
            <span>Show synchro results</span>
          </label>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">Filter by flag</div>
          <div class="filter-flags" id="filterFlags"></div>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main-workspace">
        <div class="stage-content" id="stageContent">
          <div class="kpi-row" id="kpiRow"></div>
          <div class="workspace">
            <aside class="event-panel">
              <div class="panel-head">
                <span class="panel-head-title">Events</span>
                <button class="btn-link" id="clearEventButton">All</button>
              </div>
              <div class="event-search-wrap">
                <input class="event-search" id="eventSearch" type="search" placeholder="Filter events…">
              </div>
              <div class="event-list" id="eventList"></div>
            </aside>
            <div class="results-panel">
              <div class="results-context" id="resultsContext"></div>
              <div class="results-toolbar">
                <div class="view-tabs" id="viewTabs" role="tablist"></div>
                <div class="toolbar-actions">
                  <span class="row-count" id="rowCount"></span>
                  <button class="btn-sm" id="copyTsvButton">Copy TSV</button>
                  <button class="btn-sm" id="downloadCsvButton">Download CSV</button>
                </div>
              </div>
              <div class="table-wrap" id="tableWrap"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!--
      LOAD ORDER (must match the <script> tags below exactly):
      1. config.js              — shared config (sync token)
      2. neon-client.js         — window.NEON.query() for direct Neon access
      3. overrides-sync.js      — GitHub override sync API (defines window.OverridesSync;
                                   not actually invoked until main.js's init() calls it,
                                   by which point `state` already exists)
      4. junior-data.js         — results data
      5. jo-nat-qualifiers.js   — official Junior Nationals qualifier list
      6. ewc-data.js            — E/W/C registration, foreign/dual/HPS lists
      7. ewc-results-2026.js    — E/W/C meet results
      8. junior-athlete-status.js — HPS/foreign/dual roster
      9. status-merge.js        — merges roster into data rows
     10. main.js                — app core (zone normalization, YMCA logic,
                                   qual impact, all formerly separate patch
                                   files consolidated; defines `state`)
     11. qualifier-views.js     — E/W/C and Nationals view overlays
     12. analytics.js           — pipeline analytics overlay
     13. reports-view.js        — comprehensive reports & cohort panels
     14. override-athlete-search.js — drawer athlete search
     15. athlete-lookup.js      — future athlete lookup stub
     16. pipeline-modeling.js   — multi-year funnels, cohort progression, financial overlay
     17. mobile-nav.js          — off-canvas filters drawer on phones
    -->
    <script src="../data/config.js?v=202606282030"></script>
  <script src="../shared/neon-client.js?v=202606282030"></script>
    <script src="overrides-sync.js?v=202607010117"></script>
    <script src="../data/junior-data.js?v=202606282030"></script>
    <script src="../data/jo-nat-qualifiers.js?v=202606282030"></script>
    <script src="../data/ewc-data.js?v=202606282030"></script>
  <script src="../data/ewc-results-2026.js?v=202606301830"></script>
    <script src="../data/junior-athlete-status.js?v=202606282030"></script>
    <script src="status-merge.js?v=202606282030"></script>
    <script src="main.js?v=202607010448"></script>
    <script src="qualifier-views.js?v=202607021200"></script>
    <script src="ewc-neon-loader.js?v=202607021230"></script>
    <script src="analytics.js?v=202607010448"></script>
    <script src="reports-view.js?v=202607071522"></script>
    <script src="override-athlete-search.js?v=202607010448"></script>
    <script src="athlete-lookup.js?v=202606282030"></script>
    <script src="pipeline-modeling.js?v=202607051200"></script>
    <script src="mobile-nav.js?v=202606300515"></script>
  </body>
</html>
